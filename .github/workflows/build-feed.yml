name: Build feed

on:
  push:
    paths:
      - 'reports/**'
      - 'puzzles/**'
      - 'games/**'
      - 'tools/**'
      - '.github/workflows/build-feed.yml'
  schedule:
    # Nightly, so forward-dated pieces publish on their own day without a push.
    # History: a single '0 2 * * *' slot was routinely queued by GitHub until
    # 06:45-08:15 UTC (07:45-09:15 London). Top-of-the-hour slots are the most
    # congested, so we use odd minutes and several slots straddling London
    # midnight (00:00 UTC in GMT, 23:00 UTC in BST). build-feed.js computes
    # "today" in Europe/London at run time and this job only commits when
    # feed.json changes, so a slot that fires before London midnight is a
    # harmless no-op and the next one publishes. Later slots are backstops.
    - cron: '13 23 * * *'   # BST 00:13 | GMT 23:13 (no-op)
    - cron: '13 0 * * *'    # BST 01:13 | GMT 00:13
    - cron: '43 0 * * *'    # BST 01:43 | GMT 00:43
    - cron: '27 2 * * *'    # backstop
    - cron: '41 4 * * *'    # backstop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add reader-activity script to new pieces
        run: node tools/inject-tracker.js

      - name: Build feed.json
        run: node tools/build-feed.js

      - name: Commit if changed
        run: |
          git config user.name  "digi-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json reports puzzles games 2>/dev/null || git add feed.json reports
          if git diff --staged --quiet; then
            echo "nothing changed — nothing to commit"
          else
            git commit -m "chore: rebuild feed.json, add tracker to new pieces [skip ci]"
            git push
          fi
