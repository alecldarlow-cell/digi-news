name: Build feed

on:
  push:
    paths:
      - 'reports/**'
      - 'puzzles/**'
      - 'tools/**'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build feed.json
        run: node tools/build-feed.js

      - name: Commit if changed
        run: |
          git config user.name  "digi-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "feed.json unchanged — nothing to commit"
          else
            git commit -m "chore: rebuild feed.json [skip ci]"
            git push
          fi
