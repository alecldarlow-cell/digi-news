name: Tidy root (remove duplicate puzzles)

# ---------------------------------------------------------------------------
# ONE-SHOT. Delete this workflow file once it has run.
#
# 100 Path puzzles (…-logic-path-0398 … 0497) were uploaded to the repo root
# by mistake. Identical copies already live in reports/, so the root copies
# are pure duplicates.
#
# Safety: a root file is deleted ONLY if reports/ holds a byte-identical copy.
# Anything without an exact match is listed and left alone.
#
# Defaults to a DRY RUN. Tick "apply" to actually commit the deletions.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the deletions (leave unticked for a dry run)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tidy-root
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out what would go
        run: |
          set -euo pipefail
          : > to-delete.txt
          kept=0
          for f in 20*.html; do
            [ -f "$f" ] || continue
            if [ -f "reports/$f" ] && cmp -s "$f" "reports/$f"; then
              echo "$f" >> to-delete.txt
            else
              echo "  KEEP (no identical copy in reports/)  $f"
              kept=$((kept+1))
            fi
          done
          echo "--- $(wc -l < to-delete.txt) duplicate(s) to delete, $kept kept ---"
          head -3 to-delete.txt; echo "  …"; tail -3 to-delete.txt

      - name: Delete and commit
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          git config user.name  "digi-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r f; do git rm --quiet "$f"; done < to-delete.txt
          rm -f to-delete.txt
          if git diff --staged --quiet; then
            echo "nothing to delete — already clean"
          else
            git commit -m "chore: remove duplicate puzzles uploaded to repo root"
            git push
          fi

      - name: Dry run notice
        if: ${{ !inputs.apply }}
        run: echo "DRY RUN — nothing deleted. Re-run with 'apply' ticked to commit."
