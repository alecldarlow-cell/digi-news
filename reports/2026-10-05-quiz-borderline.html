<style>
:root{
  --bg:#E3ECE8; --sea:#CFE6E8; --grat:#A9D0D5; --ink:#1F3A4A; --ink2:#4E6673;
  --paper:#FAFBF7; --pin:#C2453D; --pinT:#F4D6D1; --ok:#2E7A50; --okT:#D2EAD9;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:Archivo,"Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit}
a{color:inherit}
.screen{position:fixed;inset:0;height:100dvh;display:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen.on{display:block}
.wrap{max-width:560px;height:100%;margin:0 auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll .wrap{height:auto;min-height:100%}

/* buttons: printed-card feel, a hard ink offset instead of a soft shadow */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:8px;
  background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;
  font-weight:600;font-size:17px;font-stretch:90%;text-decoration:none;transition:transform .08s,box-shadow .08s,background .2s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{box-shadow:none;border-color:var(--ink2);color:var(--ink2);font-weight:500}
.btn.quiet:active{transform:none;background:#EEF2EE}
:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:15px;text-decoration:none;color:var(--ink2)}
.back:hover{text-decoration:underline}

/* the map sheet: sea tint, double neatline like an atlas plate */
.sheet{position:relative;background:var(--sea);border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;min-height:0}
.sheet::after{content:"";position:absolute;inset:5px;border:.75px solid var(--ink);opacity:.45;pointer-events:none}
.sheet svg.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grat line{stroke:var(--grat);stroke-width:1.6;stroke-dasharray:5 7}
.gl{font-family:var(--serif);font-style:italic;font-size:22px;fill:var(--ink2);opacity:0;transition:opacity .6s}
.revealed .gl{opacity:.85}
.land{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;fill-rule:nonzero}
.draw .land{transition:stroke-dashoffset 1.3s cubic-bezier(.5,.1,.3,1),fill-opacity .6s .9s}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(54px,17vw,80px);line-height:.9;margin:2px 0 0;letter-spacing:-.01em}
.bar{display:flex;align-items:flex-end;gap:0;margin-top:2px}
.bar i{display:block;width:34px;height:7px;border:1.25px solid var(--ink);margin-left:-1.25px}
.bar i:nth-child(odd){background:var(--ink)}
.bar span{font-family:var(--serif);font-style:italic;font-size:15px;margin-left:8px;line-height:1;color:var(--ink2)}
.lede{margin:0;font-size:16px;color:var(--ink2);max-width:34ch}
.hero{flex:1;display:block;width:100%;padding:0;text-align:left;cursor:pointer;min-height:200px;box-shadow:0 3px 0 var(--ink)}
.hero:active{transform:translateY(3px);box-shadow:none}
.bcard{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:60px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:8px;
  background:var(--sea);box-shadow:0 3px 0 var(--ink);color:inherit;text-decoration:none;transition:transform .08s,box-shadow .08s}
.bcard:active{transform:translateY(3px);box-shadow:none}
.bcard b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1}
.bcard small{font-size:13px;line-height:1.2;color:var(--ink2)}
.row.home2{grid-template-columns:1.55fr 1fr}
.cardtxt{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;background:linear-gradient(transparent,rgba(207,230,232,.95) 38%)}
.cardtxt b{display:block;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.cardtxt small{display:block;padding-right:110px;margin-top:4px;font-size:15px;color:var(--ink2)}
.cardtxt .go{position:absolute;right:18px;bottom:18px;background:var(--ink);color:var(--paper);border-radius:6px;padding:9px 16px;font-weight:600;font-stretch:90%}
.specimen{position:absolute;top:14px;left:18px;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.atlasbtn small{font-weight:500;color:var(--ink2);font-stretch:100%}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:22px;border:1.25px solid var(--ink2);background:transparent;cursor:pointer;font-size:14px;color:var(--ink2)}
.tog::before{content:"";width:26px;height:15px;border-radius:8px;background:#C3CEC9;box-shadow:inset 0 0 0 2px #C3CEC9;transition:background .2s}
.tog[aria-checked="true"]{color:var(--ink);border-color:var(--ink)}
.tog[aria-checked="true"]::before{background:var(--ink);box-shadow:inset 13px 0 0 2px var(--ink),inset 11px 0 0 6px var(--paper)}
.tog[aria-checked="false"]::before{box-shadow:inset 0 0 0 2px #C3CEC9,inset -11px 0 0 6px var(--paper)}

/* quiz */
.qtop{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:16px;height:16px}
#ticks{display:flex;gap:4px}
#ticks i{flex:1;height:7px;border-radius:2px;border:1.25px solid var(--ink2);opacity:.6}
#ticks i.cur{opacity:1;border-color:var(--ink);border-width:2px}
#ticks i.ok{background:var(--ok);border-color:var(--ok);opacity:1}
#ticks i.bad{background:var(--pin);border-color:var(--pin);opacity:1}
#pts{font-family:var(--serif);font-size:22px;min-width:64px;text-align:right}
#pts small{font-family:var(--sans);font-size:12px;color:var(--ink2);margin-left:3px}
#sheet{flex:1}
#nameplate{position:absolute;top:12px;left:12px;max-width:calc(100% - 24px);padding:6px 8px 7px;border-radius:3px;background:rgba(207,230,232,.92);font-family:var(--serif);font-style:italic;font-size:clamp(28px,8.5vw,40px);line-height:1;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;text-shadow:0 0 8px var(--sea),0 0 3px var(--sea)}
#nameplate small{display:block;font-family:var(--sans);font-style:normal;font-size:14px;margin-top:6px;color:var(--ink2)}
.revealed #nameplate{opacity:1;transform:none}
#scale{position:absolute;left:18px;bottom:14px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2)}
#scale .segs{display:flex;margin-bottom:3px}
#scale .segs i{height:6px;border:1.25px solid var(--ink);margin-left:-1.25px;background:var(--paper)}
#scale .segs i:nth-child(odd){background:var(--ink)}
#scale .lab{display:flex;justify-content:space-between}
#inset{position:absolute;right:12px;bottom:12px;width:44%;max-width:210px;background:var(--paper);border:1.25px solid var(--ink);border-radius:2px;padding:4px;opacity:0;transform:scale(.92);transform-origin:100% 100%;transition:opacity .35s,transform .35s;pointer-events:none}
#inset.on{opacity:1;transform:none}
#inset svg{display:block;width:100%;height:auto}
.dot{fill:var(--pin)}
.ring{fill:none;stroke:var(--pin);stroke-width:3}
#inset.on .ring{animation:ping 1.6s ease-out 2}
@keyframes ping{0%{r:6;opacity:1}100%{r:26;opacity:0}}
#coach{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 36px);background:var(--paper);border:1.25px solid var(--ink);border-radius:6px;padding:8px 12px;font-size:14px;text-align:center;transition:opacity .3s}
#coach.off{opacity:0;pointer-events:none}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:58px;font-size:17px;line-height:1.15;font-stretch:82%;padding:8px 10px;text-align:center}
.opt.right{background:var(--okT);border-color:var(--ok);box-shadow:0 3px 0 var(--ok);color:#173F2A}
.opt.wrong{background:var(--pinT);border-color:var(--pin);box-shadow:0 3px 0 var(--pin);color:#5E1E18}
.opt.dim{opacity:.45}
.locked .opt{pointer-events:none}
.qfoot{display:grid;min-height:52px}
.qfoot>*{grid-area:1/1}
#hintBtn[disabled]{opacity:.5}

/* results */
.kick{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink2);margin:6px 0 0}
.big{font-family:var(--serif);font-weight:400;font-size:clamp(64px,22vw,104px);line-height:.9;margin:0}
.verdict{font-size:18px;margin:0}
.sub{margin:0;color:var(--ink2)}
.stars{display:inline-flex;gap:4px;vertical-align:-3px;margin-left:6px}
.stars svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;background:var(--sea);border:1.25px solid var(--ink);border-radius:3px;overflow:hidden}
.tile svg{width:100%;height:100%;display:block}
.tile .land{stroke-width:6}
.tile .mark{position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;line-height:1}
.tile .mark.ok{background:var(--ok)}
.tile .mark.bad{background:var(--pin)}
.cap{font-size:12px;line-height:1.15;text-align:center;margin-top:4px;font-stretch:85%;overflow-wrap:anywhere}
.endbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}

/* atlas */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tile.ghost{background:transparent;border-style:dashed;border-color:var(--ink2)}
.tile.ghost .land{fill:none;stroke:var(--ink2);stroke-width:5;stroke-dasharray:10 10;opacity:.55}
.cap.q{color:var(--ink2)}
.prog{height:8px;border:1.25px solid var(--ink);border-radius:2px;background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink)}

/* pause */
#pause{position:fixed;inset:0;background:rgba(31,58,74,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#pause.on{display:flex}
.dialog{width:100%;max-width:380px;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-family:var(--serif);font-weight:400;font-size:36px;margin:0;line-height:1}
.dialog .toggles{flex-direction:column;align-items:stretch}

.rm *,.rm *::before,.rm *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){ .btn,.opt{transition:none} }
@media (min-height:760px){ .opt{min-height:62px} }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on" aria-label="Borderline home">
 <div class="wrap">
  <div class="top"><a class="back" href="../games.html">← Digi Games</a></div>
  <div>
   <h1 class="title">Borderline</h1>
   <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><span>name the country from its outline</span></div>
  </div>
  <button id="resumeBtn" class="btn primary" hidden>Resume quiz</button>
  <button id="exploreBtn" class="sheet hero" aria-label="Explore ten outlines">
   <svg class="mapsvg" id="homeMap" aria-hidden="true"></svg>
   <span class="specimen" id="specimen"></span>
   <span class="cardtxt"><b>Explore ten</b><small>Ten outlines, easiest first. Seven to pass.</small><span class="go">Play</span></span>
  </button>
  <div class="row home2">
   <a id="dailyCard" class="bcard" href="../puzzles.html"><b id="dailyTitle">Today's Borders</b><small id="dailyStatus">The daily ten, in Digi Puzzles</small></a>
   <button id="atlasBtn" class="btn atlasbtn">Atlas <small id="atlasCount">0/0</small></button>
  </div>
  <div class="toggles" id="homeToggles"></div>
 </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen" aria-label="Quiz">
 <div class="wrap">
  <div class="qtop">
   <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg></button>
   <div id="ticks" aria-hidden="true"></div>
   <div id="pts" aria-live="polite">0<small>pts</small></div>
  </div>
  <div id="sheet" class="sheet">
   <svg class="mapsvg" id="qmap" role="img" aria-label="Country outline"></svg>
   <div id="nameplate" aria-live="polite"></div>
   <div id="scale" aria-hidden="true"></div>
   <div id="inset" aria-hidden="true"></div>
   <div id="coach" class="off">Which country is this? “Show on map” helps, for half points.</div>
  </div>
  <div id="opts"></div>
  <div class="qfoot">
   <button id="hintBtn" class="btn quiet">Show on map (half points)</button>
   <button id="nextBtn" class="btn primary" hidden>Next</button>
  </div>
 </div>
</section>

<!-- RESULTS -->
<section id="results" class="screen scroll" aria-label="Results">
 <div class="wrap">
  <div class="top"><a class="back" href="../games.html">← Digi Games</a></div>
  <p class="kick" id="rKick"></p>
  <h2 class="big" id="rBig"></h2>
  <p class="verdict" id="rVerdict"></p>
  <p class="sub" id="rSub"></p>
  <div class="strip" id="rStrip"></div>

/* ---------- save (localStorage, every access guarded) ---------- */
const KEY='digi-borderline-v1';
const coarse=(()=>{try{return matchMedia('(pointer: coarse)').matches}catch(e){return false}})();
/* The atlas (found) is shared: the daily Borders puzzle adds to it, and may create this save as just
   {v:1,found:{}}. So writes merge with what is stored rather than overwrite it. */
function defaults(){return {v:1,found:{},best:0,played:0,passed:0,snd:true,rm:null,fs:coarse,seenCoach:false,quiz:null};}
let save=defaults();
function storedFound(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.v===1&&s.found&&typeof s.found==='object'?s.found:{};}catch(e){return {}}}
function mergeFound(f){for(const k in f){const n=+f[k]||0;if(n>(save.found[k]||0))save.found[k]=n;}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===1)save=Object.assign(defaults(),s);}}catch(e){}
  if(!save.found||typeof save.found!=='object')save.found={};
  delete save.daily;delete save.streak;                       // the game's old daily, now in Digi Puzzles
  if(save.quiz&&(save.quiz.mode!=='explore'||!save.quiz.qs))save.quiz=null;}
function persist(){mergeFound(storedFound());try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
load();

function goFS(){if(!fsOK||!save.fs||isFS())return;try{const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!rq)return;
 const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});}catch(e){}};
 const p=rq.call(el,{navigationUI:'hide'});if(p&&p.then)p.then(lock,()=>{});else lock();}catch(e){}}
function exitFS(){try{if(!isFS())return;const x=document.exitFullscreen||document.webkitExitFullscreen;const p=x&&x.call(document);if(p&&p.catch)p.catch(()=>{});}catch(e){}}

let actx=null;
function audio(){if(!save.snd)return null;try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();}
  if(actx.state==='suspended')actx.resume().catch(()=>{});return actx;}catch(e){return null}}
function tone(f,t,dur,type,g){const a=audio();if(!a)return;try{const o=a.createOscillator(),v=a.createGain(),t0=a.currentTime+t;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(g||0.18,t0+0.012);
  v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(v).connect(a.destination);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}}

function toggles(host){

  if(fsOK)items.push(['Full screen',()=>!!save.fs,v=>{save.fs=v;if(v)goFS();else exitFS();}]);
  for(const [label,get,set] of items){const b=document.createElement('button');b.className='tog';b.setAttribute('role','switch');

/* ---------- small helpers ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function today(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
  catch(e){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}}
function gdist(a,b){const r=Math.PI/180,s1=Math.sin((b.la-a.la)*r/2),s2=Math.sin((b.lo-a.lo)*r/2);
  return 2*Math.asin(Math.min(1,Math.sqrt(s1*s1+Math.cos(a.la*r)*Math.cos(b.la*r)*s2*s2)));}
const foundCount=()=>C.filter(c=>save.found[c.id]).length;
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* ---------- building a quiz ---------- */
function makeQuiz(seedStr){                         // Explore: ten outlines, favouring ones not yet in the atlas
  const r=rng(hashStr(seedStr));const used=new Set();const qs=[];
  for(const t of PLAN){
    let pool=C.filter(c=>c.t===t&&!used.has(c.i));
    const fresh=pool.filter(c=>!save.found[c.id]);if(fresh.length&&r()<0.75)pool=fresh;
    const c=pool[Math.floor(r()*pool.length)];used.add(c.i);
    // three wrong answers drawn from the nearest neighbours, so the map knowledge matters
    const near=C.filter(o=>o.i!==c.i).map(o=>[gdist(c,o),o.i]).sort((a,b)=>a[0]-b[0]).slice(0,8).map(x=>x[1]);
    const opts=shuffle([c.i,...shuffle(near,r).slice(0,3)],r);
    qs.push({c:c.i,o:opts});
  }
  return {mode:'explore',qs,i:0,ans:[],pts:0,run:0,secs:0,hint:false};
}

/* ---------- map drawing ---------- */
const VB={w:600,h:600,x:0,y:0};
function fitBox(svg,pb){pb=pb||0;const r=svg.getBoundingClientRect();const rw=r.width||1,rh=Math.max(1,(r.height||1)*(1-pb));const ar=rw/rh;
  const w=Math.max(600,600*ar),h=Math.max(600,600/ar),H=h/(1-pb);VB.w=w;VB.h=H;VB.x=(600-w)/2;VB.y=(600-h)/2;VB.px=rw/w;
  svg.setAttribute('viewBox',`${VB.x} ${VB.y} ${w} ${H}`);}
function graticule(c,g){
  g.innerHTML='';
  const deg=Math.PI/180,spanDeg=VB.w/(c.K*deg);
  const step=[1,2,5,10,15,20,30,45].find(s=>spanDeg/s<=5.5)||60;
  const yOf=p=>c.ty-c.K*Math.log(Math.tan(Math.PI/4+p*deg/2));
  const latOf=y=>(2*Math.atan(Math.exp((c.ty-y)/c.K))-Math.PI/2)/deg;
  const x0=VB.x,x1=VB.x+VB.w,y0=VB.y,y1=VB.y+VB.h;
  const l0=c.lo+(x0-c.tx)/(c.K*deg),l1=c.lo+(x1-c.tx)/(c.K*deg);
  for(let L=Math.ceil(l0/step)*step;L<=l1;L+=step){const x=c.tx+c.K*(L-c.lo)*deg;el('line',{x1:x,x2:x,y1:y0,y2:y1},g);
    let w=((L+540)%360)-180;const t=el('text',{x:x+6,y:y0+30,class:'gl'},g);t.textContent=w===0?'0°':Math.abs(w)+'°'+(w>0?'E':'W');if(Math.abs(w)===180)t.textContent='180°';}
  const pa=Math.max(-84,latOf(y1)),pb=Math.min(84,latOf(y0));
  for(let P=Math.ceil(pa/step)*step;P<=pb;P+=step){const y=yOf(P);el('line',{x1:x0,x2:x1,y1:y,y2:y},g);
    const t=el('text',{x:x0+14,y:y-7,class:'gl'},g);t.textContent=P===0?'0°':Math.abs(P)+'°'+(P>0?'N':'S');}
}
function refit(svg,c,pb){if(!svg.querySelector('.land'))return;fitBox(svg,pb);graticule(c,svg.querySelector('.grat'));
  svg.querySelector('.land').style.strokeWidth=(1.9/(VB.px||0.5))+'px';}
function drawLand(svg,c,animate,pb){
  svg.innerHTML='';fitBox(svg,pb);
  const g=el('g',{class:'grat'},svg);graticule(c,g);
  const p=el('path',{d:c.d,class:'land',fill:colourOf(c)},svg);
  p.style.strokeWidth=(1.9/(VB.px||0.5))+'px';
  if(animate&&!reduced()){
    let len=0;try{len=p.getTotalLength();}catch(e){}
    if(len>0){svg.classList.remove('draw');p.style.strokeDasharray=len+' '+len;p.style.strokeDashoffset=len;p.style.fillOpacity=0;
      void p.getBoundingClientRect();svg.classList.add('draw');requestAnimationFrame(()=>{p.style.strokeDashoffset=0;p.style.fillOpacity=1;});}
  }
  return p;
}
function scaleBar(c){
  const host=$('scale');host.innerHTML='';
  const kmPerPx=c.km/(VB.px||1);       // c.km is km per 600-box unit
  const target=kmPerPx*110;const mag=Math.pow(10,Math.floor(Math.log10(target)));
  const nice=[1,2,2.5,5,10].map(m=>m*mag).filter(v=>v<=target).pop()||mag;
  const px=nice/kmPerPx;const segs=document.createElement('div');segs.className='segs';
  for(let i=0;i<4;i++){const s=document.createElement('i');s.style.width=(px/4+1.25)+'px';segs.appendChild(s);}
  const lab=document.createElement('div');lab.className='lab';lab.style.width=px+'px';
  lab.innerHTML='<span>0</span><span>'+(nice>=1000?nice.toLocaleString('en-GB'):nice)+' km</span>';
  host.append(segs,lab);
}
function insetMap(c){
  const h=Math.min(DATA.wh*2,270);const s=document.createElementNS(SVGNS,'svg');s.setAttribute('viewBox',`0 0 600 ${h}`);
  el('path',{d:DATA.s,fill:'#E4F1F1',stroke:'#1F3A4A','stroke-width':1.5},s);
  el('path',{d:DATA.w,fill:'#E9DCAE',stroke:'#1F3A4A','stroke-width':1},s);
  el('circle',{cx:c.x*2,cy:c.y*2,r:6,class:'ring'},s);
  el('circle',{cx:c.x*2,cy:c.y*2,r:6,class:'dot',stroke:'#fff','stroke-width':2},s);
  $('inset').innerHTML='';$('inset').appendChild(s);
}
function tileSVG(c,cls){return `<svg viewBox="0 0 600 600" aria-hidden="true"><path class="land ${cls||''}" fill="${colourOf(c)}" d="${c.d}"/></svg>`;}

/* ---------- home ---------- */
/* Today's daily lives in Digi Puzzles as Borders: one file per day in this folder,
   YYYY-MM-DD-geo-borders-NNNN.html, NNNN = days since 2026-10-05 (London date) + 1. */
const BORDERS_FIRST='2026-10-05';
const BORDERS_LAST='2027-10-04';                    // last day of the current batch: bump when a new batch ships
function bordersToday(){const t=today();if(t<BORDERS_FIRST||t>BORDERS_LAST)return null;
  const n=String(Math.round((Date.parse(t+'T12:00:00Z')-Date.parse(BORDERS_FIRST+'T12:00:00Z'))/864e5)+1).padStart(4,'0');
  return {date:t,n,id:'DP\u00B7BORD\u00B7'+n,file:t+'-geo-borders-'+n+'.html'};}
function bordersDone(id){try{const s=JSON.parse(localStorage.getItem('digi-borders-v1')||'null');const r=s&&s.done&&s.done[id];
  return r&&Number.isFinite(+r.c)?r:null;}catch(e){return null}}
/* today's Borders answers, read from that file's PUZZLE.qs[].n, so the specimen never gives one away */
let answers={date:null,names:null,pending:null};
function bordersAnswers(b){
  if(answers.date===b.date&&(answers.names||answers.pending))return answers.pending||Promise.resolve(answers.names);
  answers={date:b.date,names:null,pending:null};
  let p;
  try{p=window.fetch(b.file,{credentials:'same-origin'}).then(r=>{if(!r.ok)throw new Error('status '+r.status);return r.text();}).then(t=>{
    const line=(t.match(/const PUZZLE=\{.*$/m)||[''])[0];const names=[];const re=/"n":"((?:[^"\\]|\\.)*)"/g;let m;
    while((m=re.exec(line)))names.push(JSON.parse('"'+m[1]+'"'));
    if(names.length<NQ)throw new Error('no puzzle in file');return names;});}
  catch(e){p=Promise.reject(e);}
  answers.pending=p.then(n=>{answers.names=n;answers.pending=null;return n;},e=>{answers.pending=null;answers.date=null;throw e;});
  return answers.pending;}
let homePick=null,homeGen=0;
function drawWorld(svg){
  svg.innerHTML='';const r=svg.getBoundingClientRect();const w=r.width||1,h=r.height||1,hu=h*0.66;
  const sc=Math.min(w/660,hu/330),vw=w/sc,vh=h/sc;svg.setAttribute('viewBox',`${300-vw/2} ${135-hu/sc/2} ${vw} ${vh}`);   // Antarctica sits below the crop, as in the inset
  el('path',{d:DATA.s,fill:'#E4F1F1',stroke:'#1F3A4A','stroke-width':1.5},svg);
  el('path',{d:DATA.w,fill:'#E9DCAE',stroke:'#1F3A4A','stroke-width':1},svg);}
function showSpecimen(exclude){
  const t=today();const ok=c=>!exclude.has(c.n);
  const mine=C.filter(c=>save.found[c.id]&&ok(c));
  const pick=mine.length?mine[hashStr(t+mine.length)%mine.length]:['Iceland','Italy','Madagascar'].map(n=>C.find(c=>c.n===n)).find(c=>c&&ok(c))||C.find(ok);
  homePick=pick;$('specimen').textContent=pick.n;drawLand($('homeMap'),pick,true,0.34);}
function renderHome(){
  const b=bordersToday(),card=$('dailyCard');
  if(b){card.href=b.file;card.setAttribute('aria-label',"Play today's Borders puzzle");$('dailyTitle').textContent="Today's Borders";
    const d=bordersDone(b.id);
    $('dailyStatus').textContent=d?`Played today: ${d.c} of ${NQ}`:'The daily ten, in Digi Puzzles';}
  else{card.href='../puzzles.html';card.setAttribute('aria-label','Daily puzzles in Digi Puzzles');$('dailyTitle').textContent='Borders';
    $('dailyStatus').textContent='Daily puzzles, in Digi Puzzles';}
  $('atlasCount').textContent=foundCount()+'/'+C.length;
  const rb=$('resumeBtn');
  if(save.quiz&&save.quiz.qs){rb.hidden=false;rb.textContent=`Resume your quiz: question ${Math.min(NQ,save.quiz.ans.length+1)} of ${NQ}`;}else rb.hidden=true;
  // a specimen from the reader's own atlas, never one of today's Borders answers; the world map if those can't be read
  const gen=++homeGen;
  if(!b){showSpecimen(new Set());}
  else if(answers.date===b.date&&answers.names){showSpecimen(new Set(answers.names));}
  else{homePick=null;$('specimen').textContent='';$('homeMap').innerHTML='';
    bordersAnswers(b).then(n=>{if(gen===homeGen&&view==='home')showSpecimen(new Set(n));},
      ()=>{if(gen===homeGen&&view==='home'){homePick=null;$('specimen').textContent='';drawWorld($('homeMap'));}});}
  toggles($('homeToggles'));
}

/* ---------- quiz flow ---------- */
function startQuiz(mode,how,fromSave){
  if(fromSave&&save.quiz){quiz=save.quiz;if(quiz.ans.length>quiz.i)quiz.i=quiz.ans.length;quiz.hint=false;}
  else quiz=makeQuiz('explore-'+Date.now()+'-'+Math.random());
  quiz.run=0;for(const a of quiz.ans){quiz.run=a.ok?quiz.run+1:0;}
  if(quiz.i>=NQ){finish();return;}
  save.quiz=quiz;persist();
  ending=false;paused=false;LEVEL=quiz.i+1;rndArm(how);
  show('quiz');buildTicks();showQuestion(true);
}
function buildTicks(){const t=$('ticks');t.innerHTML='';for(let i=0;i<NQ;i++){const e=document.createElement('i');
  const a=quiz.ans[i];if(a)e.className=a.ok?'ok':'bad';else if(i===quiz.i)e.className='cur';t.appendChild(e);}}
function updatePts(){$('pts').innerHTML=quiz.pts+'<small>pts</small>';}
function showQuestion(first){
  const q=quiz.qs[quiz.i],c=C[q.c];locked=false;quiz.hint=false;LEVEL=quiz.i+1;
  $('sheet').classList.remove('revealed');$('quiz').classList.remove('locked');
  $('nameplate').innerHTML='';$('inset').classList.remove('on');
  drawLand($('qmap'),c,true);scaleBar(c);insetMap(c);
  const box=$('opts');box.innerHTML='';
  q.o.forEach((ci,k)=>{const b=document.createElement('button');b.className='btn opt';b.textContent=C[ci].n;
    b.addEventListener('click',()=>answer(k));box.appendChild(b);});
  $('hintBtn').hidden=false;$('hintBtn').disabled=false;$('nextBtn').hidden=true;
  $('coach').classList.toggle('off',!!save.seenCoach);
  buildTicks();updatePts();
  rndStart();                         // the round begins when the first outline is put on the map
  last=performance.now();
}
function useHint(){if(locked||quiz.hint)return;quiz.hint=true;$('inset').classList.add('on');$('hintBtn').disabled=true;sfx.hint();}
function answer(k,fast){
  if(locked||!quiz)return;locked=true;
  const q=quiz.qs[quiz.i],c=C[q.c],ok=q.o[k]===q.c;
  quiz.run=ok?quiz.run+1:0;
  const gain=ok?(quiz.hint?50:100)+Math.min(50,(quiz.run-1)*10):0;quiz.pts+=gain;
  const isNew=ok&&!save.found[c.id];if(ok)save.found[c.id]=(save.found[c.id]||0)+1;
  quiz.ans.push({k,ok,h:quiz.hint});
  if(!save.seenCoach){save.seenCoach=true;$('coach').classList.add('off');}
  save.quiz=quiz;persist();
  if(fast)return;
  $('quiz').classList.add('locked');
  [...$('opts').children].forEach((b,j)=>{if(q.o[j]===q.c)b.classList.add('right');else if(j===k)b.classList.add('wrong');else b.classList.add('dim');});
  $('nameplate').innerHTML=c.n+'<small>'+(ok?(isNew?'New in your atlas. ':'')+'+'+gain+' points':'Not this time.')+'</small>';
  $('sheet').classList.add('revealed');$('inset').classList.add('on');
  $('hintBtn').hidden=true;$('nextBtn').hidden=false;$('nextBtn').textContent=quiz.i===NQ-1?'See results':'Next';
  buildTicks();updatePts();
  (ok?sfx.right:sfx.wrong)();
  try{if(!ok&&navigator.vibrate&&!reduced())navigator.vibrate(30);}catch(e){}
  setTimeout(()=>{try{$('nextBtn').focus({preventScroll:true});}catch(e){}},50);
}
function next(){if(!locked||!quiz)return;quiz.i++;save.quiz=quiz;persist();if(quiz.i>=NQ)finish();else showQuestion(false);}
function finish(){
  if(!quiz||ending)return;ending=true;
  const correct=quiz.ans.filter(a=>a.ok).length,win=correct>=PASS,stars=correct>=10?3:correct>=9?2:correct>=PASS?1:0;
  LEVEL=Math.min(NQ,quiz.ans.length);
  rndEnd(win,{score:quiz.pts,stars,mode:quiz.mode,correct});
  save.played++;if(win)save.passed++;
  const best=quiz.pts>save.best;if(best)save.best=quiz.pts;
  const done=quiz;quiz=null;save.quiz=null;persist();
  renderResults(done,correct,win,stars,best);
  (win?sfx.pass:sfx.fail)();
}
function abandon(){quiz=null;save.quiz=null;persist();rnd={armed:false,open:false,secs:0,how:'new'};closePause();show('home');renderHome();}

/* ---------- results ---------- */
function starSVG(on){return `<svg viewBox="0 0 20 20"><path d="M10 1.8l2.5 5.3 5.7.7-4.2 3.9 1.1 5.7L10 14.6l-5.1 2.8 1.1-5.7L1.8 7.8l5.7-.7z" fill="${on?'#1F3A4A':'none'}" stroke="#1F3A4A" stroke-width="1.4" stroke-linejoin="round"/></svg>`;}
function renderResults(q,correct,win,stars,best){
  show('results');$('results').scrollTop=0;
  $('rKick').textContent='Explore';
  $('rBig').textContent=correct+' of '+NQ;
  $('rVerdict').innerHTML=(win?'Passed':'Not quite: seven to pass')+(stars?'<span class="stars" aria-label="'+stars+' stars">'+[0,1,2].map(i=>starSVG(i<stars)).join('')+'</span>':'');
  const fresh=q.ans.filter((a,i)=>a.ok&&save.found[C[q.qs[i].c].id]===1).length;
  let sub=q.pts+' points'+(best?', your best explore score':'')+'. ';
  sub+=fresh?`${fresh} new ${fresh===1?'country':'countries'} in your atlas (${foundCount()} of ${C.length}).`:`Atlas: ${foundCount()} of ${C.length}.`;
  $('rSub').textContent=sub;
  $('rStrip').innerHTML=q.qs.map((qq,i)=>{const c=C[qq.c],a=q.ans[i];
    return `<div><div class="tile">${tileSVG(c)}${a?`<span class="mark ${a.ok?'ok':'bad'}">${a.ok?'✓':'✕'}</span>`:''}</div><div class="cap">${c.n}</div></div>`;}).join('');
}

/* ---------- atlas ---------- */
function renderAtlas(){
  show('atlas');$('atlas').scrollTop=0;
  const n=foundCount();$('atlasSub').textContent=(n?`${n} of ${C.length} countries named correctly. Grey outlines are still to find.`:`Name a country correctly and it is added here. ${C.length} to find.`)+' Countries you name in the daily Borders puzzle count too.';
  $('atlasProg').style.width=(100*n/C.length)+'%';
  const got=C.filter(c=>save.found[c.id]).sort((a,b)=>a.n.localeCompare(b.n));
  const rest=shuffle(C.filter(c=>!save.found[c.id]),rng(7));
  $('agrid').innerHTML=got.map(c=>`<div><div class="tile">${tileSVG(c)}</div><div class="cap">${c.n}</div></div>`).join('')+
    rest.map(c=>`<div><div class="tile ghost">${tileSVG(c)}</div><div class="cap q">?</div></div>`).join('');
}

/* ---------- pause ---------- */
function openPause(){if(view!=='quiz'||paused)return;paused=true;toggles($('pauseToggles'));$('pause').classList.add('on');persist();setTimeout(()=>{try{$('resumePause').focus();}catch(e){}},30);}
function closePause(){paused=false;$('pause').classList.remove('on');last=performance.now();}

/* ---------- active-time clock (excludes paused and hidden time) ---------- */
function loop(now){
  const dt=Math.min(0.25,Math.max(0,(now-last)/1000));last=now;
  if(view==='quiz'&&!paused&&!document.hidden&&quiz){if(rnd.open)rnd.secs+=dt;quiz.secs+=dt;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t);});

/* ---------- wiring (full screen is asked for from click handlers only) ---------- */
$('exploreBtn').addEventListener('click',()=>{goFS();audio();startQuiz('explore','new');});
$('resumeBtn').addEventListener('click',()=>{goFS();audio();startQuiz('explore','resume',true);});
$('atlasBtn').addEventListener('click',renderAtlas);
$('atlasDone').addEventListener('click',()=>{show('home');renderHome();});
$('hintBtn').addEventListener('click',useHint);
$('nextBtn').addEventListener('click',()=>{goFS();next();});
$('pauseBtn').addEventListener('click',openPause);
$('resumePause').addEventListener('click',()=>{goFS();closePause();});
$('quitBtn').addEventListener('click',abandon);
$('againBtn').addEventListener('click',()=>{goFS();audio();startQuiz('explore','retry');});
$('menuBtn').addEventListener('click',()=>{show('home');renderHome();});
document.addEventListener('keydown',e=>{
  if(view!=='quiz')return;
  if(e.key==='Escape'){paused?closePause():openPause();return;}
  if(paused)return;
  if(!locked&&/^[1-4]$/.test(e.key))answer(+e.key-1);
  else if(locked&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();}
  else if(!locked&&e.key.toLowerCase()==='m')useHint();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(view==='quiz')openPause();persist();}else{last=performance.now();refreshShared();}});
window.addEventListener('pagehide',persist);
function refreshShared(){mergeFound(storedFound());if(view==='home')renderHome();else if(view==='atlas')renderAtlas();}
window.addEventListener('pageshow',e=>{if(e.persisted)refreshShared();});
let rsT=0;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{
  if(view==='quiz'&&quiz&&quiz.i<NQ){const c=C[quiz.qs[quiz.i].c];refit($('qmap'),c);scaleBar(c);}
  else if(view==='home'){if(homePick)refit($('homeMap'),homePick,0.34);else if($('homeMap').firstChild)drawWorld($('homeMap'));}},120);});

/* ---------- test hook (site contract §5.5) ---------- */
if(window.__DGTEST===true){window.__dg={
  end(win){if(view==='results'||ending)return;if(!quiz)startQuiz('explore','new');
    while(quiz&&quiz.i<NQ){const q=quiz.qs[quiz.i];if(!locked){const k=q.o.findIndex(ci=>win?ci===q.c:ci!==q.c);answer(k,true);}locked=true;quiz.i++;locked=false;}
    finish();},
  answer:k=>answer(k), next:()=>next(), state:()=>({screen:view,quiz,save,rnd,locked}), data:C, makeQuiz
};}

renderHome();
</script>
<script src="../dn-track.js" defer></script>
