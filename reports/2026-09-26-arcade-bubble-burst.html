<style>
:root{
  --ink:#1E2340; --ink-2:#474E72; --glass:rgba(255,255,255,.66); --glass-hi:rgba(255,255,255,.88);
  --edge:rgba(255,255,255,.92); --lift:0 6px 18px rgba(38,48,110,.14); --rose-a:#FFB0C8; --rose-b:#FF8AAE;
  --warn:#A8204A; --focus:#4B34B8; --sky-a:#BFE9D6; --sky-b:#FFF6E0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;overscroll-behavior:none;background:linear-gradient(180deg,var(--sky-a),var(--sky-b)) fixed;transition:background .6s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden;--gut:max(12px,calc(50% - 268px))}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.chip,.back,.iconbtn,.press,.toast,.tip,.card{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);
  border:1px solid var(--edge);box-shadow:var(--lift)}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) var(--gut) 0;z-index:6;pointer-events:none}
.top>*{pointer-events:auto}
.back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 11px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;white-space:nowrap}
.back svg{width:16px;height:16px}
.sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px}
.iconbtn .off{display:none}
.iconbtn[aria-pressed="false"] .on{display:none}
.iconbtn[aria-pressed="false"] .off{display:block}
.hud{position:absolute;top:calc(62px + env(safe-area-inset-top));left:var(--gut);right:var(--gut);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:3;pointer-events:none}
.chip{border-radius:16px;padding:5px 8px 6px;text-align:center;min-width:0}
.lab{font-size:10px;line-height:1.3;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-family:'Fredoka',system-ui,sans-serif;font-size:18px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.press{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;pointer-events:none;
  display:flex;align-items:baseline;gap:8px;padding:5px 14px 6px;border-radius:999px;white-space:nowrap}
.press .lab{font-size:10.5px}
.press .val{font-size:17px}
.press.warn .val,.press.warn .lab{color:var(--warn)}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,6px);color:var(--ink);z-index:4;padding:8px 16px;border-radius:999px;font-weight:800;font-size:14.5px;
  pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tip{position:absolute;left:50%;top:50%;transform:translateX(-50%);width:min(88%,330px);color:var(--ink);border-radius:18px;padding:10px 14px;z-index:4;
  font-size:14px;line-height:1.4;font-weight:700;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;text-wrap:balance}
.tip.show{opacity:1}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 16px 16px;z-index:5;
  background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.overlay[hidden]{display:none}
.card{background:var(--glass-hi);border-radius:28px;padding:22px 18px 18px;width:100%;max-width:350px;max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 18px 50px rgba(38,48,110,.2)}
.card h2{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1.1;margin:2px 0 8px;text-wrap:balance;letter-spacing:-.01em}
.card h2.title{font-size:42px;margin:6px 0 8px}
.card h3{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;font-size:16px;margin:16px 2px 8px;text-align:left}
.card p{margin:6px 0;line-height:1.45}
.sub{color:var(--ink-2);font-weight:700;font-size:14.5px;text-wrap:balance}
.small{font-size:13px;color:var(--ink-2);font-weight:700}
.btn{display:block;width:100%;font:800 16px 'Nunito',system-ui,sans-serif;padding:13px 10px;border-radius:16px;border:1px solid var(--edge);
  background:rgba(255,255,255,.72);color:var(--ink);margin-top:10px;cursor:pointer;box-shadow:0 3px 10px rgba(38,48,110,.1)}
.btn.primary{background:linear-gradient(180deg,var(--rose-a),var(--rose-b));border-color:rgba(255,255,255,.7);font-size:18px;padding:15px 10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 8px 20px rgba(255,110,160,.35)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid rgba(30,35,64,.16)}
.btn:active,.lv:active,.iconbtn:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo{display:flex;justify-content:center;gap:5px;margin:2px 0 4px}
.logo i{width:24px;height:24px;border-radius:50%;display:block;background:
  radial-gradient(circle at 33% 28%,rgba(255,255,255,.95) 0 13%,rgba(255,255,255,0) 15%),
  radial-gradient(circle at 42% 40%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),var(--c);
  box-shadow:inset -2px -4px 6px rgba(30,35,64,.14),inset 0 0 0 1.5px rgba(255,255,255,.55),0 4px 8px rgba(38,48,110,.15)}
.logo i:nth-child(even){transform:translateY(5px)}
.stars{font-size:40px;letter-spacing:8px;margin:6px 0 0;line-height:1}
.stars .on{color:#E8A300;text-shadow:0 2px 0 #B97F00}
.stars .off{color:rgba(30,35,64,.18)}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lv{aspect-ratio:1/1;border:1px solid var(--edge);border-radius:18px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:600 20px 'Fredoka',system-ui,sans-serif;padding:0;background:linear-gradient(160deg,#FFFFFF,var(--t) 75%);box-shadow:0 3px 10px rgba(38,48,110,.1)}
.lv small{font:800 11px 'Nunito',system-ui,sans-serif;letter-spacing:1px;margin-top:2px;color:#9A6B00}
.lv:disabled{background:rgba(255,255,255,.4) !important;color:#5E6480;cursor:default;box-shadow:none}
.lv:disabled small{color:#5E6480;letter-spacing:.04em;text-transform:uppercase;font-size:9.5px}
.lv.cur{box-shadow:0 0 0 3px var(--ink),0 3px 10px rgba(38,48,110,.1)}
.wname{display:flex;justify-content:space-between;align-items:baseline}
.wname span{font:800 12px 'Nunito',system-ui,sans-serif;color:var(--ink-2)}
.keys{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:12px}
@media (max-width:370px){.back{padding:0 12px 0 9px;font-size:13px}.val{font-size:16.5px}}
@media (orientation:landscape) and (max-height:520px){
  #app{--gut:12px}
  .hud{right:auto;width:150px;grid-template-columns:1fr}
  .press{left:12px;transform:none}
  .overlay{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){body,.toast,.tip{transition:none}.btn:active,.lv:active,.iconbtn:active{transform:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" role="img" aria-label="Bubble Burst board. Drag or move to aim, release or click to shoot."></canvas>
  <h1 class="sr">Bubble Burst</h1>
  <header class="top">

<script>
(() => {
'use strict';

/* ---------- constants & geometry ---------- */
const W = 368, COLS = 11, D = 32, R = 16, RH = D * Math.sqrt(3) / 2, ROWS = 20, DEAD = 16;
const DEAD0 = R + (DEAD - 1) * RH + R + 3, TRAY = 136;
const LX = W / 2, NX = LX - 112;
let H = 640, BT = 100, DEADY = BT + DEAD0, LY = H - 88, NY = LY + 6, VW = 368, VH = 640, X0 = 0, DPR = 1;
const SPEED = 1150, MIN_A = 0.16, MAX_A = Math.PI - 0.16;

const COLORS = [
  { name: 'Rose',   fill: '#F59AB2', dark: '#9C2F50', g: 'dot'   },
  { name: 'Sky',    fill: '#86C5F0', dark: '#1B5E8C', g: 'tri'   },
  { name: 'Mint',   fill: '#86D9AE', dark: '#1B6E46', g: 'sq'    },
  { name: 'Butter', fill: '#FFD470', dark: '#855A00', g: 'dia'   },
  { name: 'Lilac',  fill: '#BFA7F4', dark: '#4E3399', g: 'heart' },
  { name: 'Peach',  fill: '#FFAF80', dark: '#94420F', g: 'plus'  }
];
const WORLDS = [
  { name: 'Meadow',  bg: '#BDE8D4', bg2: '#FFF5DF', tile: '#CDEFDD' },
  { name: 'Lagoon',  bg: '#AEDDF4', bg2: '#F0FAFF', tile: '#C9E8F9' },
  { name: 'Orchard', bg: '#FFC8B4', bg2: '#FFF2E8', tile: '#FFD8C8' },
  { name: 'Aurora',  bg: '#CEC1F6', bg2: '#FDE5F0', tile: '#E0D6FB' },
  { name: 'Summit',  bg: '#BFD1EB', bg2: '#F6F9FD', tile: '#D5E1F2' }
];
const ENDLESS_W = { name: 'Endless', bg: '#FFCFB6', bg2: '#E2DAFB' };
const SPECIAL_NAMES = { bomb: 'Bomb', rainbow: 'Rainbow', zap: 'Zap' };

/* ---------- levels ---------- */
const L = (name, o) => Object.assign({ name }, o);
const ALL3 = ['rainbow', 'bomb', 'zap'];
const LEVELS = [
  // Meadow: learn the basics
  L('First Pops',     { shape: 'full', rows: 7, colors: 3, p: .6, hint: 'Drag to aim, let go to shoot. Match 3 or more of a colour to pop them.' }),
  L('Bank Shot',      { shape: 'pillars', rows: 8, colors: 3, p: .6, hint: 'Bounce shots off the side walls to reach into the gaps.' }),
  L('Chandelier',     { shape: 'chandelier', rows: 10, colors: 3, p: .55, hint: 'Pop the thin threads at the top and everything below them falls, for bonus points.' }),
  L('Swap Meet',      { shape: 'funnel', rows: 10, colors: 4, p: .55, hint: 'Tap the Next bubble (or press S) to swap it with the one you are holding.' }),
  L('Low Ceiling',    { shape: 'full', rows: 9, colors: 4, p: .5, drop: 8, anchors: 1, hint: 'The ceiling drops a row every 8 shots. Keep bubbles above the dashed line. Grey stones cannot be popped.' }),
  L('Heartfelt',      { shape: 'heart', rows: 12, colors: 4, p: .5, drop: 8, canopy: 1, anchors: 2 }),
  L('Star Rescue',    { shape: 'full', rows: 10, colors: 4, p: .5, goal: 'rescue', stars: 3, anchors: 2, hint: 'Free every star: pop a match right next to it, or cut it loose so it drops.' }),
  L('Meadow Waves',   { shape: 'waves', rows: 9, colors: 4, p: .45, drop: 7, anchors: 2, hint: 'Grey stones hold everything up. Bigger drops score more.' }),
  // Lagoon: ice, fog, rainbow
  L('Thin Ice',       { shape: 'full', rows: 8, colors: 4, p: .5, ice: 7, anchors: 2, hint: 'Frosted bubbles will not match. Pop a match next to one to crack its ice.' }),
  L('Rainbow Road',   { shape: 'diamond', rows: 12, canopy: 2, colors: 4, p: .45, anchors: 2, specials: ['rainbow'], meter: 16, start: 'rainbow', hint: 'Pops fill the Power bar. When it is full you get a Rainbow, which matches any colour.' }),

function hideOverlay() { ov.hidden = true; }
function nextLevelIdx() {
  for (let i = 0; i <= Math.min(save.unlocked, LEVELS.length - 1); i++) if (!save.stars[i]) return i;
  return Math.min(save.unlocked, LEVELS.length - 1);
}
function totalStars() { let n = 0; for (const k in save.stars) n += save.stars[k]; return n; }
function homeHtml() {
  const n = nextLevelIdx(), paused = S.mode === 'paused';
  const logo = COLORS.map(c => '<i style="--c:' + c.fill + '"></i>').join('');
  return '<div class="logo" aria-hidden="true">' + logo + '</div><h2 id="ovTitle" class="title">Bubble Burst</h2>' +
    '<p class="sub">Aim, bounce off the walls and match 3 or more to pop. Cut bubbles loose to drop them for big points.</p>' +
    (paused ? '<button class="btn primary" data-act="resume" data-focus>Resume ' + (S.kind === 'endless' ? 'Endless' : 'Level ' + (S.idx + 1)) + '</button>' : '') +
    '<button class="btn' + (paused ? '' : ' primary') + '" data-act="lv" data-arg="' + n + '"' + (paused ? '' : ' data-focus') + '>Play · Level ' + (n + 1) + '</button>' +
    '<div class="row2"><button class="btn" data-act="levels">Levels · ★' + totalStars() + '</button>' +
    '<button class="btn" data-act="endless">Endless</button></div>' +
    fsBtn('home') +
    '<p class="small" style="margin-top:10px">Endless best: ' + save.endlessBest.toLocaleString() + '</p>' +
    '<p class="keys">Keyboard: ← → aim · Space shoot · S swap · P pause</p>';
}
function levelsHtml() {
  let h = '<h2 id="ovTitle">Levels</h2><p class="small">★ ' + totalStars() + ' of ' + LEVELS.length * 3 + ' stars</p>';
  WORLDS.forEach((w, wi) => {
    let got = 0; for (let i = wi * PER_WORLD; i < (wi + 1) * PER_WORLD; i++) got += save.stars[i] || 0;
    h += '<h3 class="wname">' + w.name + ' <span>★ ' + got + '/' + PER_WORLD * 3 + '</span></h3><div class="lvgrid">';
    for (let i = wi * PER_WORLD; i < (wi + 1) * PER_WORLD && i < LEVELS.length; i++) {
      const locked = i > save.unlocked, st = save.stars[i] || 0;
      const label = 'Level ' + (i + 1) + ', ' + LEVELS[i].name + (locked ? ', locked' : st ? ', ' + st + ' of 3 stars' : ', not yet cleared');
      h += '<button class="lv' + (i === nextLevelIdx() ? ' cur' : '') + '" style="--t:' + w.tile + '" data-act="lv" data-arg="' + i + '"' + (locked ? ' disabled' : '') +
        ' aria-label="' + label + '" title="' + LEVELS[i].name + '">' + (i + 1) +
        '<small aria-hidden="true">' + (locked ? 'locked' : '★'.repeat(st) + '☆'.repeat(3 - st)) + '</small></button>';
    }
    h += '</div>';
  });
  return h + '<button class="btn ghost" data-act="home" style="margin-top:14px">Back</button>';
}
function pauseHtml() {
  const title = S.kind === 'endless' ? 'Endless' : 'Level ' + (S.idx + 1) + ' · ' + S.spec.name;
  return '<h2 id="ovTitle">Paused</h2><p class="sub">' + title + '</p>' + (hintText ? '<p class="small">' + hintText + '</p>' : '') +
    '<button class="btn primary" data-act="resume" data-focus>Resume</button>' +
    '<div class="row2"><button class="btn" data-act="retry">Restart</button><button class="btn" data-act="levels">Levels</button></div>' +
    '<button class="btn ghost" data-act="home">Menu</button>' + fsBtn('pause');
}
function openHome() {
  if (S.mode === 'play') S.mode = 'paused';
  if (S.mode !== 'paused') S.mode = 'menu';
  showOverlay(homeHtml());
}
function pause() {
  if (S.mode !== 'play') return;
  S.mode = 'paused'; S.aiming = false; showOverlay(pauseHtml());
}
function resume() { if (S.mode === 'paused') { S.mode = 'play'; hideOverlay(); last = performance.now(); } }
card.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'lv' || a === 'endless' || a === 'resume' || a === 'retry' || a === 'next') goFS();
  if (a === 'fs') { save.fs = !save.fs; persist(); if (save.fs) goFS(); else exitFS(); showOverlay(b.dataset.arg === 'pause' ? pauseHtml() : homeHtml()); const nb = card.querySelector('[data-act=fs]'); if (nb) try { nb.focus({ preventScroll: true }); } catch (e) {} return; }
  if (a === 'lv') startLevel(+b.dataset.arg);
  else if (a === 'levels') { if (S.mode === 'play') S.mode = 'paused'; if (S.mode !== 'paused') S.mode = 'menu'; showOverlay(levelsHtml()); }
  else if (a === 'endless') startEndless();
  else if (a === 'home') openHome();
  else if (a === 'resume') resume();
  else if (a === 'retry') S.kind === 'endless' ? startEndless() : startLevel(S.idx);
  else if (a === 'next') startLevel(S.idx + 1);
});
$('pauseBtn').addEventListener('click', () => { if (S.mode === 'play') pause(); else if (S.mode === 'paused' && !ov.hidden && card.querySelector('[data-act=resume]')) { goFS(); resume(); } });
const sndBtn = $('sndBtn');
function syncSnd() { sndBtn.setAttribute('aria-pressed', String(!save.muted)); sndBtn.setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on'); }
sndBtn.addEventListener('click', () => { save.muted = !save.muted; persist(); syncSnd(); if (!save.muted) snd('swap'); });
syncSnd();
function releaseKeys() { for (const k in keys) keys[k] = false; }
document.addEventListener('visibilitychange', () => { releaseKeys(); if (document.hidden) pause(); });
window.addEventListener('blur', releaseKeys);

/* ---------- input ---------- */
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - X0) / scale, (e.clientY - r.top) / scale]; }
function aimAt(x, y) {
  S.angle = clamp(Math.atan2(Math.max(LY - y, 4), x - LX), MIN_A, MAX_A);
}
let downOnNext = null;
cv.addEventListener('pointerdown', e => {
  if (S.mode !== 'play') return;
  e.preventDefault();
  const [x, y] = toLogical(e);
  if (Math.hypot(x - NX, y - NY) < 30) { downOnNext = [NX, NY]; return; }
  if (Math.hypot(x - LX, y - LY) < 24) { downOnNext = [LX, LY]; return; }
  downOnNext = null;
  S.aiming = true; S.guide = true; aimAt(x, y);
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});
cv.addEventListener('pointermove', e => {
  if (S.mode !== 'play') return;
  const [x, y] = toLogical(e);
  if (S.aiming || e.pointerType === 'mouse') {
    if (e.pointerType === 'mouse' && !S.aiming && y > LY - 6) return;
    aimAt(x, y); S.guide = true;
  }
});
cv.addEventListener('pointerup', e => {
  if (S.mode !== 'play') { S.aiming = false; return; }
  const [x, y] = toLogical(e);
  if (downOnNext) { const [tx, ty] = downOnNext; downOnNext = null; if (Math.hypot(x - tx, y - ty) < 34) swap(); return; }
  if (!S.aiming) return;
  S.aiming = false;
  if (y < LY - 10) { aimAt(x, y); fire(); }
  else if (e.pointerType !== 'mouse') S.guide = false;
});
cv.addEventListener('pointercancel', () => { S.aiming = false; downOnNext = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !S.aiming) S.guide = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
const keys = {};
window.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !ov.hidden) {
    const f = [...card.querySelectorAll('button:not([disabled])')];
    if (f.length) {
      const i = f.indexOf(document.activeElement);
      if (i === -1) { e.preventDefault(); f[0].focus(); }
      else if (e.shiftKey && i === 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'p' || k === 'Escape') { if (S.mode === 'play') { pause(); e.preventDefault(); } else if (S.mode === 'paused' && card.querySelector('[data-act=resume]')) { resume(); e.preventDefault(); } return; }
  if (S.mode !== 'play' || !ov.hidden) return;
  if (['ArrowLeft', 'ArrowRight', 'a', 'd', 'Shift'].includes(k)) { keys[k] = true; e.preventDefault(); }
  else if (k === ' ' || k === 'ArrowUp' || k === 'Enter' || k === 'w') { e.preventDefault(); if (!e.repeat) fire(); }
  else if (k === 's' || k === 'x' || k === 'ArrowDown') { e.preventDefault(); if (!e.repeat) swap(); }
});
window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });

/* ---------- test hook (only with #test in the URL) ---------- */
if (location.hash === '#test') {
  window.BB = { S, LEVELS, startLevel, startEndless, simulate, resolveShot, presentColours, countWhere, isColour, goalLeft, lowestEff, nbrs,
    clone: () => ({ grid: S.grid.map(r => r.slice()), parity: S.parity, ceil: S.ceil }),
    shootNow(angle, doSwap) { if (doSwap) swap(); S.angle = angle; const sim = simulate(S, angle); if (!sim) return false; const b = S.cur; S.cur = S.next; S.next = newBubble(); land(sim, b); return true; },
    step, draw, MIN_A, MAX_A, DEAD, geo: () => ({ X0, scale, LX, LY, NX, NY, BT, DEADY }) };
}

/* ---------- boot ---------- */
resize();
(() => { setSky(worldOf(nextLevelIdx())); const B = buildLevel(nextLevelIdx()); S.grid = B.grid; S.idx = nextLevelIdx(); S.spec = LEVELS[S.idx]; S.cur = { t: 'c', k: 0 }; S.next = { t: 'c', k: 1 }; updHud(); })();
S.mode = 'menu';
showOverlay(homeHtml());
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
