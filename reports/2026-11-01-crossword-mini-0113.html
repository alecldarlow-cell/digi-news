<!-- ---- Digi News feed metadata — REQUIRED on every shipped puzzle ----
     The Digi News front page builds each card by reading this block out of the
     <head>. It must sit immediately after the viewport meta, and every field
     must be filled before upload — no placeholders ship.
       dn:headline   puzzle name + number, e.g. "Mini 0005", "Doku 0003"
                     (articles use their <h1> verbatim; puzzle pages have no
                     <h1> — the masthead is the wordmark — so the name+number
                     is the house rule for /puzzles)
       dn:standfirst one or two sentences, plain text, no tags
       dn:topic      Crossword (the Mini) | Logic (the Doku)
       dn:date       YYYY-MM-DD — must match the filename date and any footer date
       dn:kind       always "puzzle" for files in /puzzles
       dn:read       "~3 min"
     Filename: YYYY-MM-DD-topic-slug.html — see the pre-publish checklist. -->
<meta name="dn:headline"   content="Mini 0113">
<meta name="dn:standfirst" content="An open square in the city, and full of green branches. Medium.">

<title>Digi Puzzles — The Digi Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ---------- Digi Puzzles house style ----------
   Cobalt + marigold on cool paper. Mono for the machinery (wordmark,
   grid numbers, IDs), Space Grotesk for clues & UI. One bold move: the
   marigold active cell. Everything else stays quiet. */
:root{
  --paper:#EDEEF2; --card:#FFFFFF; --ink:#141726; --ink-soft:#5A5F73;
  --line:#141726; --brand:#2E5BFF; --brand-deep:#1B3B9E;
  --active:#FFD54A; --active-word:#FFF0B8; --good:#1F9E6B; --bad:#E4483B;
  --block:#141726; --radius:14px;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  line-height:1.45;-webkit-font-smoothing:antialiased;padding:18px;display:flex;justify-content:center}
.app{width:100%;max-width:560px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:11px}
.masthead{display:flex;align-items:center;gap:10px}
.mono-mark{flex:0 0 auto;width:32px;height:32px;border-radius:7px;background:var(--brand);color:#fff;
  font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18),0 1.5px 0 var(--brand-deep)}
.mh-text{display:flex;flex-direction:column;line-height:1.05}
.mh-name{font-family:var(--sans);font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.mh-name .accent{color:var(--brand)}
.mh-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px}
.streakbox{font-family:var(--mono);font-size:13px;color:var(--ink-soft);background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px}
.streakbox b{color:var(--ink)}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.tag{background:var(--brand);color:#fff;border-radius:5px;padding:1px 7px;text-transform:uppercase;font-weight:700;font-size:11px}
#timer{margin-left:auto;color:var(--ink);font-weight:700}
main{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
/* grid */
.grid{--n:5;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:0;width:min(100%,320px);aspect-ratio:1;
  border:3px solid var(--line);background:var(--line);border-radius:10px;overflow:hidden}
.cell{position:relative;min-width:0;min-height:0;background:var(--card);border:1px solid #cfd3dc;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.cell.block{background:var(--block);cursor:default;border-color:var(--block)}
.cell .num{position:absolute;top:2px;left:4px;font-family:var(--mono);font-size:10px;color:var(--ink-soft);line-height:1}
.cell .ltr{font-family:var(--sans);font-weight:700;font-size:min(6vw,26px);text-transform:uppercase}
.cell.inword{background:var(--active-word)}
.cell.active{background:var(--active)}
.cell.good .ltr{color:var(--good)}
.cell.bad .ltr{color:var(--bad)}
.cell.bad::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;background:var(--bad);border-radius:50%}
/* active-clue nav bar */
.cluebox{display:flex;align-items:stretch;gap:8px;width:min(100%,340px)}
.cluearrow{flex:0 0 auto;width:44px;font-family:var(--mono);font-weight:700;font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.cluearrow:hover{background:#e3e6ee}
.cluearrow:active{background:var(--active-word)}
.cluebar{flex:1;display:flex;align-items:center;font-family:var(--sans);font-size:15px;padding:8px 14px;
  background:var(--card);border:1.5px solid var(--ink);border-radius:10px;min-height:48px;cursor:pointer}
.cluebar b{font-family:var(--mono);color:var(--brand);margin-right:8px;white-space:nowrap}
.alltoggle{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  background:none;border:0;border-radius:8px;padding:5px 10px;cursor:pointer}
.alltoggle:hover{color:var(--ink);background:#e3e6ee}
/* off-screen input that summons the device keyboard */
.hiddeninput{position:absolute;top:0;left:50%;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;margin:0;font-size:16px}
/* clue lists (collapsed by default) */
.clues{width:min(100%,340px)}
.clues section{margin-bottom:14px}
.clues h3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.clue{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:5px 8px;font-family:var(--sans);font-size:14px;color:var(--ink);cursor:pointer}
.clue b{font-family:var(--mono);color:var(--ink-soft);min-width:18px}
.clue:hover{background:#e3e6ee}
.clue.sel{background:var(--active-word)}
.clue.sel b{color:var(--brand-deep)}
/* controls */
.msg{min-height:22px;margin:14px 0 6px;font-size:15px;color:var(--brand-deep)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
button,select{font-family:var(--sans);font-size:13px;font-weight:500;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover{background:#e3e6ee}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.primary:hover{background:var(--brand-deep)}
.spacer{flex:1}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
/* on-screen keyboard */
.kb{display:none;flex-direction:column;gap:6px;margin-top:4px;width:min(100%,340px)}
.kb.show{display:flex}
.kbrow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:38px;height:46px;padding:0;font-family:var(--mono);font-weight:700;font-size:15px;border-radius:8px}
.key.wide{max-width:56px}
/* win celebration */
.grid.celebrate .cell:not(.block){animation:cellwin .6s ease both}
@keyframes cellwin{0%{transform:scale(1)}35%{transform:scale(1.14);background:var(--active)}70%{background:var(--active-word)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;display:none}
.confetti.on{display:block}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(20,23,38,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.modal.on{display:flex}
.modalcard{width:100%;max-width:340px;background:var(--card);border:2px solid var(--ink);border-radius:16px;
  padding:22px 20px 18px;text-align:center;box-shadow:0 10px 0 var(--brand-deep),0 26px 44px rgba(20,23,38,.30);
  animation:rise .48s cubic-bezier(.2,.9,.25,1.12)}
@keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.modalcard .check{width:54px;height:54px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:30px;line-height:1;box-shadow:0 4px 0 #157a52}
.modalcard h2{font-family:var(--sans);font-size:25px;margin:0 0 3px;color:var(--ink);letter-spacing:-.01em}
.modalcard .sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:15px}
.statrow{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.stat{flex:1;max-width:100px;background:var(--paper);border:1.5px solid var(--ink);border-radius:11px;padding:9px 6px}
.stat b{display:block;font-family:var(--mono);font-size:21px;color:var(--ink);line-height:1.15}
.stat span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.modalbtns{display:flex;gap:8px}
.modalbtns button{flex:1;margin:0}
@media(prefers-reduced-motion:reduce){.grid.celebrate .cell:not(.block){animation:none}.modalcard{animation:none}}
footer{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.05em;margin-top:6px;text-align:center}
.gridwrap{display:contents}

/* ---------- APP MODE ----------------------------------------------------
   On touch devices we lock the whole game into one viewport-tall column so
   the clue, the board and the keyboard are all visible at once — no scroll.
   Height uses svh (the viewport height WHILE the browser bar is showing), so
   it fits whether or not the address bar is present, and never jumps. The
   board flexes to fill whatever height is left after the fixed chrome. */
html.app-mode,html.app-mode body{height:100%;overflow:hidden;overscroll-behavior:none}
html.app-mode body{padding:0;display:block}
html.app-mode .app{
  height:100vh;height:100dvh;height:100svh;   /* last supported wins → svh */
  max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:calc(6px + env(safe-area-inset-top)) 12px calc(6px + env(safe-area-inset-bottom));
}
html.app-mode header{margin-bottom:8px;padding-bottom:8px}
html.app-mode .mono-mark{width:28px;height:28px;font-size:12px}
html.app-mode .mh-name{font-size:17px}
html.app-mode .streakbox{font-size:12px;padding:3px 10px}
html.app-mode .meta{margin-bottom:8px;font-size:11px}

html.app-mode main{flex:1 1 auto;min-height:0;width:100%;gap:8px;justify-content:flex-start}
html.app-mode .cluebox{order:1;width:100%;max-width:none}
html.app-mode .cluebar{min-height:44px;font-size:15px}
html.app-mode .cluearrow{width:42px;font-size:20px}
html.app-mode .gridwrap{order:2;display:flex;flex:1 1 auto;min-height:0;width:100%;
  align-items:center;justify-content:center}
html.app-mode .grid{width:var(--side,320px);height:var(--side,320px);max-width:100%}
html.app-mode .cell .ltr{font-size:calc(var(--cell,60px)*.46)}
html.app-mode .cell .num{font-size:calc(var(--cell,60px)*.2)}
/* the full clue list + footer don't earn their vertical space on a phone;
   prev/next already walk every clue */
html.app-mode #toggleClues,html.app-mode #cluesWrap,html.app-mode footer{display:none}

html.app-mode .msg{order:4;min-height:0;margin:4px 0 0;font-size:12px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* controls collapse to a single quiet, swipeable strip */
html.app-mode .controls{order:5;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:6px 0 0;padding:1px 0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
html.app-mode .controls::-webkit-scrollbar{display:none}
html.app-mode .controls button,html.app-mode .controls select{flex:0 0 auto;
  padding:6px 10px;font-size:12px;white-space:nowrap}
html.app-mode .controls .spacer{display:none}

/* keyboard is part of the layout, pinned at the foot */
html.app-mode .kb{order:6;flex:0 0 auto;width:100%;max-width:none;margin-top:8px}
html.app-mode .kb.show{display:flex}
html.app-mode .key{max-width:none;height:clamp(40px,6.2svh,52px);font-size:16px}
html.app-mode .key.wide{max-width:64px}

/* very short viewports (small phones, landscape): tighten further */
@media (max-height:660px){
  html.app-mode header{margin-bottom:5px;padding-bottom:5px}
  html.app-mode .mh-eyebrow{display:none}
  html.app-mode .meta{margin-bottom:5px}
  html.app-mode .kb{margin-top:5px}
  html.app-mode .key{height:clamp(34px,5.6svh,46px)}
}
</style></head><body><div class="app">

      <button id="winNew" class="primary">New grid</button>
    </div>
  </div>
</div>

function findSlots(grid){

}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* An authored, fully-clued sample so the shell opens playable.
   In production the engine fills the grid and Digi Puzzles authors the clues. */
const SAMPLE={
  type:"mini",
  id:"DP·MINI·0113", band:"medium",
  grid:[["H","O","L","D","#"],["O","W","E","#","#"],["P","L","A","Z","A"],["#","#","F","I","T"],["#","T","Y","P","E"]],
  clues:{ // keyed by answer (unique within a puzzle)
    hold:"Keep a grip on it",
    owe:"Be in the red to someone",
    plaza:"Open square in the city",
    fit:"Slot in nicely",
    type:"Tap it out on the keys",
    hop:"The bunny's move",
    owl:"It asks who",
    leafy:"Full of green branches",
    zip:"Fastener with teeth",
    ate:"Tucked in, past tense"
  }
};

let P=null;         // current puzzle {grid,slots,clues,id,band,nums}
let entries=[];     // player letters 5x5
let checked=null;   // per-cell check state
let sel={r:0,c:0,dir:"A"};
let started=false, tHandle=null, seconds=0, solved=false;

/* ---- numbering + slot lookup ---- */
function numberGrid(grid){
  const nums=Array.from({length:5},()=>Array(5).fill(0));
  let n=0;
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    if(grid[r][c]==="#")continue;
    const startA=(c===0||grid[r][c-1]==="#")&&(c<4&&grid[r][c+1]!=="#");
    const startD=(r===0||grid[r-1][c]==="#")&&(r<4&&grid[r+1][c]!=="#");
    if(startA||startD)nums[r][c]=++n;
  }
  return nums;
}
function slotsFrom(grid){return findSlots(grid);}
function wordAt(r,c,dir){
  return P.slots.find(s=>s.t===dir&&s.cells.some(([y,x])=>y===r&&x===c));
}
function clueList(dir){
  return P.slots.filter(s=>s.t===dir).map(s=>{
    const [r,c]=s.cells[0]; const ans=s.cells.map(([y,x])=>P.grid[y][x]).join("").toLowerCase();
    return {num:P.nums[r][c], clue:P.clues[ans]||`(${s.L})`, r, c, dir, ans};
  }).sort((a,b)=>a.num-b.num);
}

/* ---- load a puzzle ---- */
let curSrc=SAMPLE;
function load(pz){
  curSrc=pz;
  P={...pz, slots:slotsFrom(pz.grid), nums:numberGrid(pz.grid)};
  entries=P.grid.map(row=>row.map(ch=>ch==="#"?"#":""));
  checked=P.grid.map(row=>row.map(()=>null));
  solved=false; started=false; seconds=0; stopTimer(); renderTime();
  document.body.classList.remove("win");
  const wm=document.querySelector("#winModal"); if(wm)wm.classList.remove("on");
  const gr=document.querySelector("#grid"); if(gr)gr.classList.remove("celebrate");
  sel={r:0,c:0,dir:"A"};
  const first=P.slots.find(s=>s.t==="A")||P.slots[0]; sel={r:first.cells[0][0],c:first.cells[0][1],dir:first.t};
  $("#pid").textContent=P.id; $("#pband").textContent=P.band;
  buildGrid(); buildClues(); paint(); refreshStreakUI();
  $("#msg").textContent="";
  if(typeof scheduleFit==="function")scheduleFit();
}

/* ---- render grid ---- */
function buildGrid(){
  const g=$("#grid"); g.innerHTML="";
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    const cell=document.createElement("div");
    cell.className="cell"+(P.grid[r][c]==="#"?" block":"");
    cell.dataset.r=r; cell.dataset.c=c;
    if(P.grid[r][c]!=="#"){
      if(P.nums[r][c])cell.insertAdjacentHTML("beforeend",`<span class="num">${P.nums[r][c]}</span>`);
      cell.insertAdjacentHTML("beforeend",`<span class="ltr"></span>`);
      cell.addEventListener("click",()=>{
        if(sel.r===r&&sel.c===c)sel.dir=sel.dir==="A"?"D":"A";
        else{sel={r,c,dir:sel.dir};}
        if(!wordAt(r,c,sel.dir))sel.dir=sel.dir==="A"?"D":"A";
        paint();
        if(wantNative())focusHidden();
      });
    }
    g.appendChild(cell);
  }
}
function buildClues(){
  const mk=(dir,host)=>{ host.innerHTML="";
    clueList(dir).forEach(cl=>{
      const el=document.createElement("button"); el.className="clue"; el.type="button";
      el.dataset.dir=dir; el.dataset.r=cl.r; el.dataset.c=cl.c;
      el.innerHTML=`<b>${cl.num}</b><span>${cl.clue}</span>`;
      el.addEventListener("click",()=>{sel={r:cl.r,c:cl.c,dir};paint();});
      host.appendChild(el);
    });
  };
  mk("A",$("#across")); mk("D",$("#down"));
}

/* ---- paint state ---- */
function paint(){
  const active=wordAt(sel.r,sel.c,sel.dir);
  $$("#grid .cell").forEach(cell=>{
    const r=+cell.dataset.r,c=+cell.dataset.c; if(P.grid[r][c]==="#")return;
    cell.classList.remove("active","inword","good","bad");
    const inWord=active&&active.cells.some(([y,x])=>y===r&&x===c);
    if(inWord)cell.classList.add("inword");
    if(r===sel.r&&c===sel.c)cell.classList.add("active");
    if(checked[r][c]==="good")cell.classList.add("good");
    if(checked[r][c]==="bad")cell.classList.add("bad");
    cell.querySelector(".ltr").textContent=entries[r][c]==="#"?"":entries[r][c];
  });
  // clue bar
  if(active){
    const [r,c]=active.cells[0]; const ans=active.cells.map(([y,x])=>P.grid[y][x]).join("").toLowerCase();
    $("#cluebar").innerHTML=`<b>${P.nums[r][c]}${active.t==="A"?"A":"D"}</b> ${P.clues[ans]||"("+active.L+")"}`;
  }
  $$(".clue").forEach(el=>{
    el.classList.toggle("sel", active && +el.dataset.r===active.cells[0][0] && +el.dataset.c===active.cells[0][1] && el.dataset.dir===active.t);
  });
}

/* ---- input ---- */
function advance(back=false){
  const w=wordAt(sel.r,sel.c,sel.dir); if(!w)return;
  const i=w.cells.findIndex(([y,x])=>y===sel.r&&x===sel.c);
  const j=back?i-1:i+1;
  if(j>=0&&j<w.cells.length){sel.r=w.cells[j][0];sel.c=w.cells[j][1];}
}
function type(ch){
  if(P.grid[sel.r][sel.c]==="#"||solved)return;
  startTimer();
  entries[sel.r][sel.c]=ch.toUpperCase(); checked[sel.r][sel.c]=null;
  advance(); paint(); checkWin();
}
function del(){
  if(solved)return; startTimer();
  if(entries[sel.r][sel.c]){entries[sel.r][sel.c]="";checked[sel.r][sel.c]=null;}
  else{advance(true);entries[sel.r][sel.c]="";}
  paint();
}
function move(dr,dc){
  let r=sel.r,c=sel.c;
  for(let k=0;k<5;k++){r+=dr;c+=dc;if(r<0||r>4||c<0||c>4)return;if(P.grid[r][c]!=="#"){sel.r=r;sel.c=c;paint();return;}}
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey)return;
  const fromHidden=e.target===hidden;              // native-keyboard input is handled via beforeinput
  if(e.key==="Tab"){gotoClue(e.shiftKey?-1:1);e.preventDefault();return;}
  if(/^[a-zA-Z]$/.test(e.key)){if(!fromHidden){type(e.key);e.preventDefault();}}
  else if(e.key==="Backspace"){if(!fromHidden){del();e.preventDefault();}}
  else if(e.key==="ArrowRight"){sel.dir="A";move(0,1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){sel.dir="A";move(0,-1);e.preventDefault();}
  else if(e.key==="ArrowDown"){sel.dir="D";move(1,0);e.preventDefault();}
  else if(e.key==="ArrowUp"){sel.dir="D";move(-1,0);e.preventDefault();}
  else if(e.key===" "){if(!fromHidden){sel.dir=sel.dir==="A"?"D":"A";paint();e.preventDefault();}}
});

/* ---- check / reveal ---- */
function checkCells(cells){cells.forEach(([r,c])=>{if(P.grid[r][c]==="#")return;checked[r][c]=entries[r][c]===P.grid[r][c]?(entries[r][c]?"good":null):(entries[r][c]?"bad":null);});paint();}
function allCells(){const a=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(P.grid[r][c]!=="#")a.push([r,c]);return a;}
function revealCells(cells){startTimer();cells.forEach(([r,c])=>{if(P.grid[r][c]==="#")return;entries[r][c]=P.grid[r][c];checked[r][c]="good";});paint();checkWin();}
$("#checkWord").onclick=()=>{const w=wordAt(sel.r,sel.c,sel.dir);if(w)checkCells(w.cells);};
$("#checkAll").onclick=()=>checkCells(allCells());
$("#revealWord").onclick=()=>{const w=wordAt(sel.r,sel.c,sel.dir);if(w)revealCells(w.cells);};
$("#revealAll").onclick=()=>revealCells(allCells());

/* ---- timer ---- */
function startTimer(){if(started||solved)return;started=true;tHandle=setInterval(()=>{seconds++;renderTime();},1000);}
function stopTimer(){if(tHandle)clearInterval(tHandle);tHandle=null;}
function renderTime(){const m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");$("#timer").textContent=`${m}:${s}`;}

/* ---- win + streak ---- */
async function checkWin(){
  if(solved)return;
  const done=allCells().every(([r,c])=>entries[r][c]===P.grid[r][c]);
  if(!done)return;
  solved=true; stopTimer();
  $("#msg").innerHTML=`Solved in <b>${$("#timer").textContent}</b>. Nice.`;
  document.body.classList.add("win");
  await bumpStreak();
  celebrate();
}
async function store(get){ // storage abstraction (persistent when available)
  const KEY="digi-mini-streak";
  try{
    if(window.storage){
      if(get){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null;}
    }
  }catch(e){}
  if(get){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
  return null;
}
async function saveStreak(obj){
  const KEY="digi-mini-streak";
  try{if(window.storage){await window.storage.set(KEY,JSON.stringify(obj));return;}}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(obj));}catch(e){}
}
function today(){return new Date().toISOString().slice(0,10);}
async function bumpStreak(){
  let s=await store(true)||{last:null,streak:0,best:0,dates:[]};
  const t=today();
  if(s.dates.includes(t)){refreshStreakUI(s);return;}
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  s.streak=(s.last===y)?s.streak+1:1;
  s.last=t; s.best=Math.max(s.best,s.streak); s.dates=[...new Set([...(s.dates||[]),t])].slice(-90);
  await saveStreak(s); refreshStreakUI(s);
}
async function refreshStreakUI(s){
  s=s||await store(true)||{streak:0,best:0};
  $("#streak").textContent=s.streak||0; $("#best").textContent=s.best||0;
}

/* ---- generate a fresh grid (demo of the engine gate) ---- */
$("#newPuzzle").onclick=()=>{
  const band=$("#bandSel").value;
  const out=produce(band, (Date.now()>>>0));           // engine: fill -> validate -> only return on PASS
  if(!out){$("#msg").textContent="Couldn't build a passing grid — try again.";return;}
  const nums=numberGrid(out.sol);
  // clues are authored by Digi Puzzles in production; demo stubs enumeration
  const clues={};
  entriesOf(out.sol,out.slots).forEach(e=>{clues[e.word.toLowerCase()]=`(${e.L}) — clue authored by Digi Puzzles`;});
  load({id:"DP·MINI·"+String(Math.floor(Math.random()*9000+1000)), band, grid:out.sol, clues});
  $("#msg").innerHTML=`Fresh <b>${band}</b> grid — generated & validated in-browser. Mean commonness ${out.meta.meanTier}. (Clues stubbed in demo.)`;
};
$("#reset").onclick=()=>load(curSrc);

/* ---- device (native) keyboard via an off-screen input ---- */
const hidden=$("#hidden");
const TOUCH=(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches)||("ontouchstart" in window);
let customKb=false;
function wantNative(){return TOUCH&&!customKb;}
function focusHidden(){if(solved)return;try{hidden.focus({preventScroll:true});}catch(_){hidden.focus();}}
function clearHidden(){hidden.value="";}
function feed(str){for(const ch of str){if(/[a-z]/i.test(ch))type(ch);else if(ch===" "){sel.dir=sel.dir==="A"?"D":"A";paint();}}}
hidden.addEventListener("beforeinput",e=>{
  if(e.inputType==="insertText"||e.inputType==="insertCompositionText"){if(e.data)feed(e.data);e.preventDefault();clearHidden();}
  else if(e.inputType&&e.inputType.indexOf("delete")===0){del();e.preventDefault();clearHidden();}
});
hidden.addEventListener("input",()=>{const v=hidden.value;if(v){feed(v);clearHidden();}}); // fallback where beforeinput is unsupported

/* ---- previous / next clue ---- */
function orderedSlots(){
  const num=s=>P.nums[s.cells[0][0]][s.cells[0][1]];
  const A=P.slots.filter(s=>s.t==="A").sort((a,b)=>num(a)-num(b));
  const D=P.slots.filter(s=>s.t==="D").sort((a,b)=>num(a)-num(b));
  return A.concat(D);
}
function gotoClue(delta){
  const list=orderedSlots(),cur=wordAt(sel.r,sel.c,sel.dir);
  let i=cur?list.indexOf(cur):0; if(i<0)i=0;
  i=(i+delta+list.length)%list.length;
  const s=list[i],cell=s.cells.find(([r,c])=>!entries[r][c])||s.cells[0];
  sel={r:cell[0],c:cell[1],dir:s.t}; paint();
  if(wantNative())focusHidden();
}
$("#prevClue").onclick=()=>gotoClue(-1);
$("#nextClue").onclick=()=>gotoClue(1);
$("#cluebar").addEventListener("click",()=>{
  sel.dir=sel.dir==="A"?"D":"A";
  if(!wordAt(sel.r,sel.c,sel.dir))sel.dir=sel.dir==="A"?"D":"A";
  paint(); if(wantNative())focusHidden();
});
$("#cluebar").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#cluebar").click();}});

/* ---- show / hide the full clue list ---- */
$("#toggleClues").onclick=()=>{
  const w=$("#cluesWrap"),open=w.hasAttribute("hidden"),t=$("#toggleClues");
  if(open)w.removeAttribute("hidden");else w.setAttribute("hidden","");
  t.setAttribute("aria-expanded",String(open));
  t.textContent=open?"Hide all clues ▴":"Show all clues ▾";
};

/* ---- on-screen keyboard (optional fallback) ---- */
const KB=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
const kbHost=$("#kb");
KB.forEach((row,i)=>{const d=document.createElement("div");d.className="kbrow";
  [...row].forEach(ch=>{const b=document.createElement("button");b.className="key";b.textContent=ch;b.addEventListener("click",()=>type(ch));d.appendChild(b);});
  if(i===2){const b=document.createElement("button");b.className="key wide";b.textContent="⌫";b.addEventListener("click",()=>del());d.appendChild(b);}
  kbHost.appendChild(d);
});
$("#toggleKb").onclick=()=>{
  customKb=!customKb;
  $("#kb").classList.toggle("show",customKb);
  $("#toggleKb").textContent=customKb?"Hide keys":"On-screen keys";
  if(customKb)hidden.blur(); else if(wantNative())focusHidden();
  scheduleFit();
};

/* ---- win celebration ---- */
const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function celebrate(){
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(P.grid[r][c]!=="#")checked[r][c]="good";
  paint();
  $("#winTime").textContent=$("#timer").textContent;
  $("#winStreak").textContent=$("#streak").textContent;
  $("#winBest").textContent=$("#best").textContent;
  $("#winSub").textContent=`${P.id} · ${P.band}`;
  if(reduceMotion){$("#winModal").classList.add("on");return;}
  // beat 1 — green cascade sweeps diagonally across the grid (~1.2s)
  const g=$("#grid"); g.classList.add("celebrate");
  $$("#grid .cell").forEach(cell=>{const r=+cell.dataset.r,c=+cell.dataset.c;if(P.grid[r][c]==="#")return;cell.style.animationDelay=((r+c)*90)+"ms";});
  setTimeout(()=>{g.classList.remove("celebrate");$$("#grid .cell").forEach(c=>c.style.animationDelay="");},1900);
  // beat 2 — confetti bursts a beat into the cascade
  setTimeout(()=>confettiBurst(200),350);
  // beat 3 — results card rises after the wave, greeted by a small second burst
  setTimeout(()=>{confettiBurst(80);$("#winModal").classList.add("on");},1450);
}
let _cf={cv:null,ctx:null,parts:[],raf:0,W:0,H:0,dpr:1};
function confettiBurst(n){
  if(reduceMotion)return;
  const cv=$("#confetti"); if(!cv||!cv.getContext)return;
  const ctx=cv.getContext("2d"); if(!ctx)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(!_cf.raf){                       // (re)size only when idle so a mid-air second burst doesn't reset
    cv.classList.add("on");
    _cf.dpr=dpr; _cf.W=cv.width=innerWidth*dpr; _cf.H=cv.height=innerHeight*dpr;
    cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
    _cf.cv=cv; _cf.ctx=ctx; _cf.parts.length=0;
  }
  const d=_cf.dpr, cols=["#2E5BFF","#FFD54A","#1F9E6B","#1B3B9E","#ffffff"];
  const rect=$("#grid").getBoundingClientRect();
  const ox=(rect.left+rect.width/2)*d, oy=(rect.top+rect.height*0.42)*d;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, sp=(4+Math.random()*9)*d;
    _cf.parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-8*d,g:.16*d,
      w:(5+Math.random()*6)*d,rot:Math.random()*6.28,vr:(-.35+Math.random()*.7),
      col:cols[i%cols.length],life:0,max:110+Math.random()*70});}
  if(!_cf.raf)confettiLoop();
}
function confettiLoop(){
  const {ctx,W,H}=_cf; ctx.clearRect(0,0,W,H); let alive=false;
  for(const p of _cf.parts){ if(p.life>p.max)continue; alive=true;
    p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
    ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w*0.6); ctx.restore(); }
  if(alive){_cf.raf=requestAnimationFrame(confettiLoop);}
  else{_cf.raf=0; _cf.parts.length=0; ctx.clearRect(0,0,W,H); _cf.cv.classList.remove("on");}
}
$("#winShare").onclick=async()=>{
  const txt=`The Digi Mini · ${P.id}\nSolved in ${$("#timer").textContent} — streak ${$("#streak").textContent} (best ${$("#best").textContent})\nmade with Digi Puzzles`;
  try{await navigator.clipboard.writeText(txt);const b=$("#winShare");b.textContent="Copied ✓";setTimeout(()=>b.textContent="Share result",1500);}
  catch(_){const b=$("#winShare");b.textContent="Copy unavailable";setTimeout(()=>b.textContent="Share result",1500);}
};
$("#winNew").onclick=()=>{$("#winModal").classList.remove("on");$("#newPuzzle").click();};
$("#winModal").addEventListener("click",e=>{if(e.target===$("#winModal"))$("#winModal").classList.remove("on");});

/* ---- app mode: fit clue + board + keyboard into one screen on touch ---- */
function fitGrid(){
  if(!document.documentElement.classList.contains("app-mode"))return;
  const wrap=document.querySelector(".gridwrap"),g=$("#grid");
  if(!wrap||!g)return;
  const side=Math.max(0,Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight)));
  if(side>0){g.style.setProperty("--side",side+"px");g.style.setProperty("--cell",(side/5)+"px");}
}
let _fitRAF=0;
function scheduleFit(){
  if(!("requestAnimationFrame" in window)){fitGrid();return;}
  cancelAnimationFrame(_fitRAF);
  _fitRAF=requestAnimationFrame(()=>requestAnimationFrame(fitGrid));
}
/* fullscreen — hides browser chrome on Android Chrome; iOS Safari blocks
   element fullscreen, so the button hides itself where it can't work */
(function(){
  const btn=$("#fs"),root=document.documentElement;
  if(!btn)return;
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req){btn.style.display="none";return;}
  btn.onclick=()=>{
    const on=document.fullscreenElement||document.webkitFullscreenElement;
    if(on)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else req.call(root);
  };
  document.addEventListener("fullscreenchange",scheduleFit);
  document.addEventListener("webkitfullscreenchange",scheduleFit);
})();
const APPMODE=!!(window.matchMedia&&window.matchMedia("(pointer:coarse) and (hover:none)").matches);
function initAppMode(){
  if(!APPMODE)return;               // phones/tablets only — not touchscreen laptops
  document.documentElement.classList.add("app-mode");
  customKb=true;                       // own keyboard → native one never reflows the layout
  $("#kb").classList.add("show");
  const t=$("#toggleKb"); if(t)t.textContent="Hide keys";
  hidden.blur();
  addEventListener("resize",scheduleFit);
  addEventListener("orientationchange",scheduleFit);
  if(window.visualViewport)visualViewport.addEventListener("resize",scheduleFit);
  scheduleFit();
}
initAppMode();
load(SAMPLE);
