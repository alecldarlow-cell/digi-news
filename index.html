<!DOCTYPE html>
<html lang="en" data-section="news">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FCFCFB">
<title>Digi News — the data desk</title>
<meta name="description" content="Digi News: data journalism. Facts first, fully sourced, honest about uncertainty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  DIGI NEWS — FRONT PAGE  (index.html)
  One of three section pages (index.html, puzzles.html, games.html). Layout,
  styles and script are shared in front.css and front.js; this
  file only sets the section (data-section on <html>), masthead and footer.
  You should never need to edit it to publish.
-->
<link rel="stylesheet" href="front.css">
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="mono" aria-hidden="true">DN</div>
    <div class="word">Digi<b>News</b></div>
    <div class="kick">The data desk<span class="k2">Facts first · fully sourced</span></div>
  </header>

  <nav class="controls" aria-label="Sections and filters">
    <div class="bar">
      <div class="sections" aria-label="Sections">
        <a class="sec news" href="index.html" aria-current="page">News</a>
        <a class="sec puzzles" href="puzzles.html">Puzzles</a>
        <a class="sec games" href="games.html">Games</a>
      </div>
      <button class="sbtn" id="sbtn" type="button" aria-label="Search" aria-expanded="false" aria-controls="searchrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </div>
    <div class="searchrow" id="searchrow" hidden>
      <input class="search" id="q" type="search" placeholder="Search headlines…" aria-label="Search headlines">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Topic"></div>
  </nav>

  <div id="status"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="feed" id="feed">
    <li class="skel"></li><li class="skel"></li><li class="skel"></li>
  </ul>

  <footer class="foot">
    <p><b>Digi News</b> — data journalism. Every piece is self-contained, sourced to tier, and
    dated to the day it was produced. Corrections are logged in the footer of the piece concerned.</p>
    <p style="margin-top:8px" id="built"></p>
    <p class="privacy"><a href="privacy.html">Privacy</a> · <button type="button" class="optout" data-digi-optout aria-pressed="false">Don’t record my visits</button></p>
  </footer>

</div>
<script src="front.js"></script>
<script src="dn-track.js" defer></script>
</body>
</html>
