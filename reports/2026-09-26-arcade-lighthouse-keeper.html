<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:dark;--ink:#f4ecd8;--night:#081421;--panel:rgba(8,20,33,.8);--line:rgba(244,236,216,.2);--gold:#f6c343;--sea:#1b5a7d}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--sea)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;line-height:1.25}
.chip small{display:block;font-weight:600;font-size:12px;opacity:.75}
#hud .chip{min-width:0;padding:6px 9px}
#wal{display:flex;align-items:center;gap:5px;font-size:16px;transform-origin:left center}
#walN{font-variant-numeric:tabular-nums}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4 0 18%,#f6c343 22% 66%,#b88a1b 70%);display:inline-block;flex:none}
.crt{width:12px;height:10px;background:#a7743f;border:1px solid #6e4a24;border-radius:2px;display:inline-block;margin-left:6px}
#walF{font-size:13px;display:flex;align-items:center;gap:2px}
#walF .full{color:#ff8a70;margin-left:4px;font-size:11px}
.bump{animation:bump .3s ease-out}@keyframes bump{40%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
.star{color:var(--gold)}
#phase{display:flex;align-items:center;gap:8px}
#menu{pointer-events:auto;cursor:pointer;color:var(--ink);width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
#bell{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:800 15px Nunito,system-ui,sans-serif;color:#1a1204;background:linear-gradient(90deg,#fff1c4 0 var(--p,0%),var(--gold) var(--p,0%));border:0;border-radius:12px;padding:13px 18px;min-height:48px;touch-action:none;-webkit-touch-callout:none;box-shadow:0 3px 0 #a67c14;cursor:pointer;white-space:nowrap}
#bell:focus-visible,.btn:focus-visible,#menu:focus-visible{outline:3px solid #fff;outline-offset:2px}
#tut{position:absolute;left:50%;top:66px;transform:translateX(-50%);width:min(340px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:#f6c343;color:#1a1204;border-radius:12px;padding:7px 8px 7px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #a67c14}
#tut .n{font-size:11px;font-weight:800;opacity:.7;white-space:nowrap}
#tut .h{flex:1}
#tut button{pointer-events:auto;background:rgba(26,18,4,.12);border:0;border-radius:8px;color:#1a1204;font:800 12px Nunito,system-ui,sans-serif;padding:8px 10px;min-height:36px;cursor:pointer}
#stage.tutOn #info{top:112px}#stage.tutOn #toast{top:160px}#stage.tutOn #tip{display:none}
.seg{display:flex;gap:6px;margin:8px 0 2px}.seg button{flex:1;margin:0;justify-content:center;flex-direction:column;align-items:center;text-align:center}.seg button.on{background:var(--gold);color:#1a1204;border:0}
#tip{position:absolute;left:50%;top:66px;transform:translateX(-50%);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#info{position:absolute;left:50%;transform:translateX(-50%);width:min(320px,calc(100% - 24px));top:66px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:none;font-size:12px;line-height:1.3}
#info .cost.short{color:#c9c2b0}
#info b{font-size:13px;font-weight:800}
#info .cost{float:right;color:var(--gold);font-weight:800;font-size:13px}
#info .stat{margin-top:1px;color:#ffe9a6;font-weight:700;font-variant-numeric:tabular-nums}
#info .desc{opacity:.8}
#toast{position:absolute;left:50%;top:116px;transform:translateX(-50%);text-align:center;pointer-events:none;transition:opacity .5s;width:86%}
#toast h2{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:28px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#toast p{margin:4px 0 0;font-weight:700;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#toast.banner{top:66px;width:max-content;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
#toast.banner h2{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:14px;text-shadow:none}
#toast.banner p{font-size:12px;margin-top:1px;text-shadow:none;font-weight:600}
.note{font-size:12px;opacity:.7;margin:12px 0 0}
.phead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;margin:-6px -6px 8px}
.phead h2{margin:0;font-size:22px}.phead::after{content:'';width:64px}
.bk{background:none;border:0;color:var(--gold);font:800 14px Nunito,system-ui,sans-serif;min-height:44px;min-width:64px;padding:0 6px;text-align:left;cursor:pointer;border-radius:8px}
.bk:focus-visible{outline:3px solid #fff}
.sect{text-align:left;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:16px 2px 0}
.nav .chev{font-size:24px;line-height:1;opacity:.6}
.lbl{text-align:left;font-weight:800;font-size:14px;margin:10px 2px 0}.lbl small{display:block;font-weight:600;opacity:.7;font-size:12px}
.sw2{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;flex:none}.sw2::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.sw2.on{background:var(--gold)}.sw2.on::after{left:21px}
@media (prefers-reduced-motion:reduce){.sw2::after{transition:none}}
.btn.opt.on{border-color:var(--gold)}.dot2{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex:none}.btn.opt.on .dot2{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 45%,transparent 50%)}
.btn.danger small{color:#ffb4a4}
.card .btn+.note{margin-top:14px}.btn.armed{border-color:#ff8a70;background:#3a2226}

.chart{text-align:left;max-height:52vh;overflow-y:auto;margin:6px 0 4px;position:relative}
.crow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-left:2px dashed rgba(244,236,216,.25);margin-left:12px;padding-left:22px;position:relative}
.crow .dot{position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:#193a55;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.crow .nm{flex:1;font-weight:800;font-size:14px}.crow .nm small{display:block;color:var(--gold);font-weight:700;font-size:12px}
.crow .st{color:var(--gold);letter-spacing:2px}.crow .st .off{color:rgba(255,255,255,.2)}
.crow.lock{opacity:.45}.crow.lock .dot{border-color:rgba(244,236,216,.3)}
.crow.cur .dot{background:var(--gold);color:#1a1204}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px;border:1px solid #2a1d10}
.log{text-align:left;margin:6px 0}.lrow{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
#modal{position:absolute;inset:0;background:rgba(4,10,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.card{background:#10263a;border:1px solid var(--line);border-radius:16px;padding:20px 18px;max-width:360px;width:100%;text-align:center}
.card h2{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px;text-wrap:balance}
.card p{margin:0 0 10px;font-size:14px;opacity:.85}
.card .stars{font-size:30px;letter-spacing:6px;color:var(--gold);margin:4px 0 8px}
.card .stars .off{color:rgba(255,255,255,.18)}
.card .bank{font-weight:800;margin:6px 0 4px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:8px 0 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#193a55;color:var(--ink);font:800 14px Nunito,system-ui,sans-serif;text-align:left;cursor:pointer}
.btn small{display:block;font-weight:600;opacity:.75;font-size:12px}
.btn .price{color:var(--gold);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--gold);color:#1a1204;border:0;justify-content:center;box-shadow:0 3px 0 #a67c14;margin-top:14px}
.link{background:none;border:0;color:var(--ink);opacity:.6;font:600 12px Nunito,system-ui,sans-serif;margin-top:12px;text-decoration:underline;cursor:pointer}
</style>

<body>

<div id="stage">
  <canvas id="c" aria-label="Lighthouse Keeper game"></canvas>
  <div id="hud">
    <div class="chip" id="where"><div id="wal"><i class="coin"></i><b id="walN">0</b><span id="walF"></span></div><small id="hl">Headland 1 · ★ 0</small></div>
    <div class="chip" id="phase"><svg id="clk" viewBox="0 0 44 26" width="36" height="22" aria-hidden="true"><path d="M4 23 A18 18 0 0 1 40 23" fill="none" stroke="rgba(244,236,216,.35)" stroke-width="1.5" stroke-dasharray="2 3"/><line x1="1" y1="23.5" x2="43" y2="23.5" stroke="rgba(244,236,216,.4)"/><circle id="orb" r="4.2" cx="4" cy="23" fill="#f6c343"/></svg><span id="phtxt">Day<small>Night in 90s</small></span></div>
    <button class="chip" id="menu" type="button" aria-label="Pause and settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  </div>
  <div id="toast"><h2></h2><p></p></div>
  <div id="tip">Drag anywhere to walk</div>
  <div id="tut" hidden><span class="n" id="tutN"></span><span class="h" id="tutH"></span><button type="button" id="tutSkip">Skip</button></div>
  <div id="info" hidden></div>
  <button id="bell" type="button">Hold to light the lamp</button>
  <div id="modal" hidden><div class="card" id="card"></div></div>
</div>

<script>
(()=>{
const SIM=!!window.__SIM;
const stage=document.getElementById('stage'),cv=document.getElementById('c');let ctx=cv.getContext('2d');
const fog=document.createElement('canvas'),fctx=fog.getContext('2d');
const landCv=document.createElement('canvas'),lctx=landCv.getContext('2d');let landDirty=true;const FOGS=0.5;
const $=id=>document.getElementById(id);
let S=1,W=400,H=700,dpr=1;
const G={};let pads=[];let coast=[];

/* ---------- tuning (set by simulation) ---------- */
const CFG={firstDay:90,day:60,sk0:5,skN:3,skL:1.2,hpExp:0.72,nightGrow:0.04,chests0:4,chestCoins:5,chestsDawn:3,towerHp:100,
 skiff:{hp:18,spd:27,dps:5,r:11,coins:2},fog:{hp:26,spd:20,dps:5,r:12,coins:3,fog:true},boss:{hp:240,spd:11,dps:20,r:22,coins:14},krakenHp:36,
 trip:12,cratePrice:3,priceStep:2};
const ET={skiff:CFG.skiff,fog:CFG.fog,boss:CFG.boss};

/* ---------- map: a headland jutting north from the mainland ---------- */
function coastY(x){const dx=(x-G.cx)/G.rx;const a=Math.abs(dx)<1?G.cy-G.ry*Math.sqrt(1-dx*dx):1e4,b=G.band,k=26;
 const m=Math.min(a,b);return m-k*Math.log(1+Math.exp(-Math.abs(a-b)/k));}
const walkable=(x,y)=>x>=12&&x<=388&&y<=H-14&&y>=coastY(x)+14;
const PADS=[
 {id:'jetty1',type:'jetty',at:()=>({x:46,y:coastY(46)+30}),cost:4,req:null},
 {id:'canL',type:'cannon',at:()=>({x:G.cx-92,y:G.cy-G.ry*0.5}),cost:8,req:'jetty1'},
 {id:'canR',type:'cannon',at:()=>({x:G.cx+92,y:G.cy-G.ry*0.5}),cost:10,req:'canL',minL:2},
 {id:'lamp',type:'lamp',at:()=>({x:G.cx,y:G.ly+46}),cost:12,req:'canL',minL:2},
 {id:'jetty2',type:'jetty',at:()=>({x:354,y:coastY(354)+30}),cost:12,req:'canL',minL:2},
 {id:'canC',type:'cannon',at:()=>({x:G.cx,y:G.cy-G.ry*0.87}),cost:20,req:'canR'},
 {id:'dog',type:'dog',at:()=>({x:G.cottage.x-54,y:G.cottage.y+6}),cost:15,req:'jetty1',minL:3},
 {id:'cart',type:'cart',at:()=>({x:150,y:Math.min(H-128,G.band+56)+6}),cost:20,req:'jetty2',minL:3},
 {id:'market',type:'market',at:()=>({x:92,y:Math.min(H-128,G.band+56)}),cost:6,req:null,start:1},
];
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);const old=G.cy!==undefined?{cy:G.cy,ry:G.ry,band:G.band,H}:null;
 cv.width=landCv.width=Math.max(1,Math.round(r.width*dpr));cv.height=landCv.height=Math.max(1,Math.round(r.height*dpr));fog.width=Math.max(1,Math.round(r.width*dpr*FOGS));fog.height=Math.max(1,Math.round(r.height*dpr*FOGS));landDirty=true;
 S=Math.max(0.1,r.width/400);H=Math.max(560,r.height/S);layout();if(old&&st&&(Math.abs(old.cy-G.cy)>0.5||Math.abs(old.H-H)>0.5))remap(old);}
function remap(o){const my=y=>y<o.band?G.cy+(y-o.cy)*(G.ry/o.ry):G.band+(y-o.band)*((H-G.band)/Math.max(1,o.H-o.band));
 const land=e=>{e.y=my(e.y);e.x=Math.max(14,Math.min(386,e.x));e.y=Math.min(H-16,Math.max(e.y,coastY(e.x)+16));};
 st.coins.forEach(land);st.chests.forEach(land);st.crates.forEach(land);land(st.keeper);st.keeper.goal=null;if(st.dog)land(st.dog);if(st.cart)land(st.cart);
 for(const e of st.enemies){e.y=my(e.y);e.ty=coastY(e.tx)-10;}for(const m of st.merchants){m.y=my(m.y);const hp=harbourPoint();m.tx=hp.x;m.ty=hp.y;}for(const k of st.krakens)k.y=coastY(k.x)-26;}
function layout(){landDirty=true;G.cx=200;G.cy=Math.max(H*0.64,H-272);G.rx=176;G.ry=Math.min(175,H*0.24);G.band=G.cy+G.ry*0.12;
 G.lx=200;G.ly=G.cy-G.ry*0.15;G.ox=G.lx;G.oy=G.ly-62;
 coast=[];for(let x=0;x<=400;x+=5)coast.push([x,coastY(x)]);
 G.cottage={x:320,y:Math.min(H-120,G.band+58)};
 pads.forEach(p=>{const q=p.at();p.x=q.x;p.y=q.y;});}

/* ---------- saved progress ---------- */
const KEY='lk_meta_v3',RUNKEY='lk_run_v3';
const UPS={speed:['Sea legs','Keeper walks 12% faster'],start:['Salvage crate','Start every headland with 5 more coins'],dmg:['Better powder','All cannons deal 15% more damage'],net:['Faster boats','Fishing trips are 15% quicker'],hull:['Stone base','Lighthouse gets 25 more health']};
const COAST=['Hunstanton','Holme','Brancaster','Wells','Blakeney Point','Sheringham','Cromer','Mundesley','Happisburgh','Winterton','Gorleston','Lowestoft Ness'],FINALE=12;
const hName=L=>L<=FINALE?COAST[L-1]:'Open sea '+(L-FINALE);
const PAINTS=[{id:'red',name:'Classic red',c:'#c8402e',need:0},{id:'black',name:'Storm black',c:'#2b2e33',need:6},{id:'green',name:'Harbour green',c:'#2f8f5b',need:12},{id:'blue',name:'Royal blue',c:'#2f5fb5',need:20},{id:'gold',name:'Gold leaf',c:'#d4a52a',need:'finale'}];
const HATS=[{id:'sou',name:"Yellow sou'wester",need:0},{id:'beanie',name:'Red beanie',need:4},{id:'cap',name:"Captain's cap",need:10},{id:'fisher',name:"Blue fisherman's cap",need:16},{id:'crown',name:"Keeper's crown",need:'finale'}];
const SEA={calm:{name:'Calm',hp:0.7,n:0.8,day:1.2,spd:1,cap:3,tower:25,starX:1,d:'Weaker, fewer ships and longer days'},standard:{name:'Standard',hp:1,n:1,day:1,spd:1,cap:3,tower:0,starX:1,d:'The sea as intended'},stormy:{name:'Stormy',hp:1.12,n:1.15,day:0.9,spd:1.05,cap:99,tower:0,starX:2,d:'Tougher, faster, more ships. Stars count double for paints and hats'}};
const sea=()=>SEA[meta.sea]||SEA.standard;
const owned=it=>it.need==='finale'?meta.finale:meta.earned>=it.need;
const paintC=()=>(PAINTS.find(q=>q.id===meta.paint)||PAINTS[0]).c;
const prefersRM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const freshMeta=()=>({ver:4,island:1,stars:0,earned:0,up:{speed:0,start:0,dmg:0,net:0,hull:0},last:Date.now(),muted:false,music:true,rm:prefersRM,lossL:null,sens:'normal',tutDone:SIM,sea:'standard',seaAsked:false,best:{},paint:'red',hat:'sou',finale:false,streakL:0,streakN:0,stats:{played:0,sunk:0,saved:0,turned:0,attempts:0,wins:0,lostN:[0,0,0]}});
let meta=freshMeta();
function migrate(m){const f=freshMeta(),out=Object.assign(f,m);out.up=Object.assign(freshMeta().up,m.up||{});out.best=Object.assign({},m.best||{});out.stats=Object.assign(freshMeta().stats,m.stats||{});
 if(m.earned==null){let spent=0;for(const k in out.up)spent+=out.up[k]*(out.up[k]+1)/2;out.earned=(out.stars||0)+spent;}
 out.ver=4;return out;}
let lastSeen=null;
if(!SIM)try{let m=null;for(const k of [KEY,'lk_meta_v2','lk_meta_v1']){const v=localStorage.getItem(k);if(v){m=JSON.parse(v);break;}}if(m&&(m.up||m.island)){lastSeen=m.last||null;meta=migrate(m);saveMeta();}}catch(e){}
function saveMeta(){meta.last=Date.now();if(SIM)return;try{localStorage.setItem(KEY,JSON.stringify(meta))}catch(e){}}
let awayHrs=0,pendingBonus=0;{awayHrs=lastSeen?Math.max(0,Math.min(4,(Date.now()-lastSeen)/3.6e6)):0;}

/* ---------- sound (made in code, starts after first tap) ---------- */
const SND={ac:null,out:null,noise:null,last:{}};
function audioInit(){if(SIM)return;try{if(!SND.ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC();SND.ac=ac;
  SND.out=ac.createGain();SND.out.gain.value=meta.muted?0:0.7;SND.out.connect(ac.destination);
  SND.mus=ac.createGain();SND.mus.gain.value=meta.music?0.55:0;SND.mus.connect(ac.destination);
  const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SND.noise=b;waves();}
 if(SND.ac.state==='suspended')SND.ac.resume();}catch(e){}}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function noiseSrc(){const s=SND.ac.createBufferSource();s.buffer=SND.noise;s.loop=true;return s;}
function tone(type,f0,f1,dur,peak,delay=0,filt){const ac=SND.ac,t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 env(g,t,0.005,peak,dur);let n=o;if(filt){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f;}n.connect(g);g.connect(SND.out);o.start(t);o.stop(t+dur+0.05);}
function burst(ftype,freq,dur,peak,delay=0,sweep){const ac=SND.ac,t=ac.currentTime+delay,s=noiseSrc(),f=ac.createBiquadFilter(),g=ac.createGain();f.type=ftype;f.frequency.setValueAtTime(freq,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+dur);
 env(g,t,0.004,peak,dur);s.connect(f);f.connect(g);g.connect(SND.out);s.start(t,Math.random());s.stop(t+dur+0.05);}

const msgQ=[];let msgCur=null,msgT=0,msgGap=0;
function toast(h,p){if(SIM)return;if(msgCur&&msgCur.h===h&&msgCur.p===p)return;if(msgQ.some(m=>m.h===h&&m.p===p))return;msgQ.push({h,p});if(msgQ.length>6)msgQ.shift();}
function msgClear(){msgQ.length=0;msgCur=null;msgGap=0;if(!SIM)$('toast').style.opacity=0;}
function msgUpdate(dt){if(SIM)return;const el=$('toast');
 if(msgCur){msgT+=dt;if(msgT>=(msgQ.length?2.4:3.6)){msgCur=null;el.style.opacity=0;msgGap=0.35;}}
 else{msgGap-=dt;if(msgGap<=0&&msgQ.length){msgCur=msgQ.shift();msgT=0;el.querySelector('h2').textContent=msgCur.h;el.querySelector('p').textContent=msgCur.p;el.classList.toggle('banner',!!(st&&st.phase==='night'));el.style.opacity=1;}}}

/* ---------- nights: each one adds a new threat ---------- */
function startNight(){if(st.night===2)st.cp=snapState();st.night++;st.phase='night';st.t=0;st.warned=false;st.keeper.inTower=true;joy=null;
 const n=st.night,L=st.L;st.hpMul=Math.pow(L,CFG.hpExp)*(1+CFG.nightGrow*(n-1))*(1-(st.assist||0));
 const q=[];const sk=Math.round((CFG.sk0+CFG.skN*n+(L-1)*CFG.skL*(n===1?0.5:1))*(1-(st.assist||0)));if(n===1)st.hpMul*=0.85;
 const skN=Math.max(3,Math.round(sk*sea().n));for(let i=0;i<skN;i++)q.push({type:'skiff',at:1.5+i*(26/skN)+Math.random()*1.2});
 st.hpMul*=sea().hp*(L===1?0.8:1);
 if(n>=2){const f=Math.max(1,Math.round((n-1+Math.floor((L-1)/2))*sea().n));for(let i=0;i<f;i++)q.push({type:'fog',at:6+i*7});}
 if(n===3){if(L>=2)q.push({type:'kraken',at:9});q.push({type:'boss',at:18});}
 if(n<=2||L>=3)q.push({type:'merchant',at:n===1?9:7});
 q.sort((a,b)=>a.at-b.at);st.q=q;st.nightTotal=q.filter(x=>x.type!=='merchant').length;play('bell');play('horn');
 toast('Night '+n,n===1?'The keeper climbs to the lamp. Drag to swing the beam.':n===2?'New: fog ships only show up in the beam':L===1?'New: a ghost galleon':L===2?'New: a kraken, then the ghost galleon':'The kraken and the ghost galleon are coming');}
const LANES=[40,120,200,280,360];

 const d=ET[type];let x=LANES[Math.floor(Math.random()*LANES.length)]+(Math.random()*30-15),y=-30;if(tutOn()&&!st.tutF.lit&&!st.enemies.length&&type==='skiff'){x=Math.random()<0.5?80:320;y=Math.min(260,coastY(x)-120);}
 const tx=x+(G.cx-x)*0.35,ty=coastY(tx)-10;
 const bm=type==='boss'&&st.L===1?0.6:1;st.enemies.push({type,x,y,hp:d.hp*st.hpMul*bm,max:d.hp*st.hpMul*bm,d,tx,ty,atk:false,lit:false,beam:false,fire:0.6,h:Math.PI/2,burnAcc:0,burnT:0,smokeT:0});}

function spawnKraken(){const cans=pads.filter(p=>p.type==='cannon'&&p.level>0&&!p.grabbed);const tgt=cans.length?cans[Math.floor(Math.random()*cans.length)]:null;

 st.krakens.push({x,y:coastY(x)-26,tgt,hp:CFG.krakenHp*st.hpMul,max:CFG.krakenHp*st.hpMul,t:0,state:'rise',beam:false});if(tgt)tgt.grabbed=true;

const num=(x,y,txt,col)=>st.nums.push({x,y,txt,col,t:0});
const part=o=>st.parts.push(Object.assign({t:0,vx:0,vy:0,r:3,max:0.8},o));
function update(dt){
 msgUpdate(dt);
 st.shake=Math.max(0,st.shake-dt);st.hitFlash=Math.max(0,st.hitFlash-dt);
 for(const p of st.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='plank'){p.vx*=0.97;p.vy*=0.97;p.rot=(p.rot||0)+dt*3;}}

 for(const n of st.nums)n.t+=dt;st.nums=st.nums.filter(n=>n.t<0.9);
 for(const w of st.wrecks)w.t+=dt;st.wrecks=st.wrecks.filter(w=>w.t<1.6);
 if(st.over)return;
 {const tc=tutOn()&&st.phase==='day'&&pads.find(p=>p.id==='canL').level<1;if(!tc){if(tutOn()&&st.phase==='day'&&!st.tutClock){st.tutClock=true;st.t=Math.max(st.t,st.dayLen-40);}st.t+=dt;}}st.dk+=((st.phase==='night'?1:0)-st.dk)*Math.min(1,dt*1.5);
 // keeper
 const k=st.keeper,spd=95*(1+0.12*meta.up.speed);let vx=0,vy=0;
 if(bot){vx=bot.vx;vy=bot.vy;}
 else if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,m=Math.hypot(dx,dy);if(m>5){const f=Math.min(1,0.35+0.65*Math.min(m,40)/40);vx=dx/m*f;vy=dy/m*f;}}
 else if(k.goal&&!k.inTower){const dx=k.goal.x-k.x,dy=k.goal.y-k.y,m=Math.hypot(dx,dy);k.goal.t+=dt;if(m<2.5||k.goal.t>8)k.goal=null;else{const f=Math.min(1,m/12);vx=dx/m*f;vy=dy/m*f;}}
 if(keys.a||keys.arrowleft)vx=-1;if(keys.d||keys.arrowright)vx=1;if(keys.w||keys.arrowup)vy=-1;if(keys.s||keys.arrowdown)vy=1;
 if(k.inTower){if(keys.q||keys.a||keys.arrowleft)st.aim-=dt*2;if(keys.e||keys.d||keys.arrowright)st.aim+=dt*2;clampAim();vx=0;vy=0;}
 k.mv=Math.hypot(vx,vy);st.idle=k.mv<0.05&&!k.inTower?st.idle+dt:0;
 moveKeeper(k,vx*spd*dt,vy*spd*dt);
 if(vx)k.f=Math.sign(vx);k.walk+=Math.hypot(vx,vy)*dt*12;
 const tl=Math.hypot(k.x-G.lx,(k.y-G.ly)*1.3);if(tl<22){const a=Math.atan2(k.y-G.ly,k.x-G.lx);k.x=G.lx+Math.cos(a)*22;k.y=G.ly+Math.sin(a)*22/1.3;}
 // chests
 for(const c of st.chests){if(c.open){c.t+=dt;continue;}if(!k.inTower&&Math.hypot(k.x-c.x,k.y-c.y)<18){c.open=true;play('creak');st.tutF.chest=true;
   for(let i=0;i<c.coins;i++){const a=Math.random()*6.28,r=10+Math.random()*16;dropCoin(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r*0.7);}
   st.fx.push({kind:'ring',x:c.x,y:c.y,t:0});}}

 // crates: pick up, then sell at the market

 st.crates=st.crates.filter(c=>!c.dead);
 const mk=market();st.sellT-=dt;
 if(!k.inTower&&st.fish>0&&Math.hypot(k.x-mk.x,k.y-mk.y)<30&&st.sellT<=0){st.sellT=0.18;st.fish--;st.tutF.sold=true;const pr=priceL(mk.level);st.carried+=pr;num(mk.x,mk.y-26,'+'+pr,'#f6c343');play('sell');}
 // build spots
 for(const p of pads){if(!unlocked(p))continue;
  if(p.build>0){p.build-=dt;if(p.build<=0)p.pop=0.45;}if(p.pop>0)p.pop-=dt;if(p.recoil>0)p.recoil-=dt;
  if(p.level<3){const pp=padPos(p),near=!k.inTower&&Math.abs(k.x-pp.x)<pp.s/2+4&&Math.abs(k.y-pp.y)<pp.s/2+4,on=near&&st.carried>0&&!(p.build>0)&&!p.lock;
   if(p.lock&&!near&&!(p.build>0))p.lock=false;
   p.dwell=on&&k.mv<0.12?(p.dwell||0)+dt:0;
   if(p.dwell>0.45){p.t+=dt;
    while(p.t>0.05&&st.carried>0){p.t-=0.05;st.carried--;p.paid++;st.fx.push({kind:'fly',x:k.x,y:k.y-14,tx:pp.x,ty:pp.y,t:0});play('clink');
     if(p.paid>=cost(p)){p.level++;{const q=padPos(p);for(const c of st.chests){if(c.open||Math.hypot(c.x-q.x,c.y-q.y)>36)continue;for(const dx of [44,-44,70,-70]){const nx=c.x+dx;if(walkable(nx,c.y+4)&&pads.every(o=>{const r=padPos(o);return Math.hypot(r.x-nx,r.y-c.y)>36})){c.x=nx;break;}}}}if(p.level===3&&SPECS[p.type]){if(SIM)chooseSpec(p);else{const tryC=()=>{if(!$('modal').hidden||st.over){setTimeout(tryC,800);return;}chooseSpec(p);};setTimeout(tryC,1500);}}p.paid=0;p.dwell=0;p.build=1.4;p.lock=true;st.fx.push({kind:'ring',x:p.x,y:p.y,t:0});play('hammer');
      toast(padInfo(p).t+(p.level>1?' level '+p.level:' built'),p.type==='dog'?'It will fetch coins you have not picked up':p.type==='cart'?'It hauls crates to the market for you':p.type==='jetty'?'Collect its crates of fish on the beach':p.type==='lamp'?'Wider beam, brighter lamp':p.type==='market'?'Crates now sell for more':'It fires at anything in the light');break;}}}else p.t=0;}
  if(p.level<1)continue;
  if(p.type==='jetty'){const b=st.boats[p.id]||(st.boats[p.id]={u:0,out:false,wait:1.5});
   if(!b.out){if(st.phase==='day'||p.spec==='night'){b.wait-=dt;if(b.wait<=0){b.out=true;b.u=0;}}}
   else{b.u+=dt/(tutOn()&&!st.tutF.crate?4:tripT(p.level));if(b.u>=1){b.out=false;b.u=0;b.wait=0.8;const s=jettySide(p);

     st.shots.push({x:mx,y:my,e:best,lx:best.x,ly:best.y,dmg:canDmg(p.level)*(p.spec==='long'?1.2:1),trav:0,slow:p.spec==='chain'});
     part({kind:'flash',x:mx,y:my,r:7,max:0.12});for(let i=0;i<4;i++)part({kind:'smoke',x:mx,y:my,vx:Math.cos(p.ang)*20+Math.random()*16-8,vy:Math.sin(p.ang)*20-8+Math.random()*8,r:4+Math.random()*3,max:0.9});
     play('boom');}}}}
 // coins
 for(const c of st.coins){c.age+=dt;const d=Math.hypot(k.x-c.x,k.y-c.y);if(d<60&&c.age>0.35){c.x+=(k.x-c.x)/d*300*dt;c.y+=(k.y-c.y)/d*300*dt;}if(d<12&&c.age>0.35){c.dead=true;st.carried++;play('clink');st.fx.push({kind:'wal',x:c.x,y:c.y-4,t:0});}}

 // night

  if(tutOn()&&!st.tutF.lit&&st.enemies.length){for(const q of st.q)q.at+=dt;}
