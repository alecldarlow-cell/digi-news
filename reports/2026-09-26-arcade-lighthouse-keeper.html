<style>
:root{color-scheme:dark;--ink:#f4ecd8;--night:#081421;--panel:rgba(8,20,33,.8);--line:rgba(244,236,216,.2);--gold:#f6c343;--sea:#1b5a7d}
html,body{height:100%;height:100dvh}
html{background:#123f63}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--sea)}
canvas{display:block;width:100%;height:100%;touch-action:none}
:root{--st:env(safe-area-inset-top,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
#hud{position:absolute;left:calc(10px + var(--sl));top:calc(9px + var(--st));pointer-events:none;color:rgba(244,236,216,.78);text-shadow:0 1px 3px rgba(0,0,0,.55)}
#prog{position:absolute;left:0;right:0;top:var(--st);height:3px;background:rgba(8,20,33,.25);pointer-events:none}#prog i{display:block;height:100%;width:0;background:#f6c343;opacity:.7;transition:background .6s}
#flash{position:absolute;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);font:800 13px Nunito,system-ui,sans-serif;color:var(--ink);background:rgba(8,20,33,.55);border-radius:20px;padding:4px 12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .35s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.sr:focus{clip:auto;width:auto;height:auto;left:calc(8px + var(--sl));top:calc(40px + var(--st));padding:8px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:800 13px Nunito,system-ui,sans-serif}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;line-height:1.25}
.chip small{display:block;font-weight:600;font-size:12px;opacity:.75}
#wal{display:flex;align-items:center;gap:5px;font:800 14px Nunito,system-ui,sans-serif;transform-origin:left center}#wal .coin{opacity:.85}
#walN{font-variant-numeric:tabular-nums}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4 0 18%,#f6c343 22% 66%,#b88a1b 70%);display:inline-block;flex:none}
.crt{width:12px;height:10px;background:#a7743f;border:1px solid #6e4a24;border-radius:2px;display:inline-block;margin-left:6px}
#walF{font-size:12px;display:flex;align-items:center;gap:2px;margin-left:4px}
#walF .full{color:#ff8a70;margin-left:4px;font-size:11px}
.bump{animation:bump .3s ease-out}@keyframes bump{40%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
.star{color:var(--gold)}
#phase{display:flex;align-items:center;gap:8px}
#bell{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:800 15px Nunito,system-ui,sans-serif;color:#1a1204;background:linear-gradient(90deg,#fff1c4 0 var(--p,0%),var(--gold) var(--p,0%));border:0;border-radius:12px;padding:13px 18px;min-height:48px;touch-action:none;-webkit-touch-callout:none;box-shadow:0 3px 0 #a67c14;cursor:pointer;white-space:nowrap}
#bell:focus-visible,.btn:focus-visible,#menu:focus-visible{outline:3px solid #fff;outline-offset:2px}
#tut{position:absolute;left:50%;top:calc(34px + var(--st));transform:translateX(-50%);width:min(340px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:#f6c343;color:#1a1204;border-radius:12px;padding:7px 8px 7px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #a67c14}
#tut .tn{font-size:11px;font-weight:800;opacity:.7;white-space:nowrap}
#tut .h{flex:1}
#tut button{pointer-events:auto;background:rgba(26,18,4,.12);border:0;border-radius:8px;color:#1a1204;font:800 12px Nunito,system-ui,sans-serif;padding:8px 10px;min-height:36px;cursor:pointer}
#stage.tutOn #info{top:calc(84px + var(--st))}#stage.tutOn #toast{top:calc(132px + var(--st))}#stage.tutOn #tip{display:none}#stage.tutOn #flash{opacity:0!important}
.seg{display:flex;gap:6px;margin:8px 0 2px}.seg button{flex:1;margin:0;justify-content:center;flex-direction:column;align-items:center;text-align:center}.seg button.on{background:var(--gold);color:#1a1204;border:0}
#tip{position:absolute;left:50%;top:calc(40px + var(--st));transform:translateX(-50%);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#info{position:absolute;left:50%;transform:translateX(-50%);width:min(320px,calc(100% - 24px));top:calc(40px + var(--st));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:none;font-size:12px;line-height:1.3}
#info .cost.short{color:#c9c2b0}
#info b{font-size:13px;font-weight:800}
#info .cost{float:right;color:var(--gold);font-weight:800;font-size:13px}
#info .stat{margin-top:1px;color:#ffe9a6;font-weight:700;font-variant-numeric:tabular-nums}
#info .desc{opacity:.8}
#toast{position:absolute;left:50%;top:calc(118px + var(--st));transform:translateX(-50%);text-align:center;pointer-events:none;transition:opacity .5s;width:86%}
#toast h2{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:28px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#toast p{margin:4px 0 0;font-weight:700;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#toast.banner{top:calc(40px + var(--st));width:max-content;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
#toast.banner h2{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:14px;text-shadow:none}
#toast.banner p{font-size:12px;margin-top:1px;text-shadow:none;font-weight:600}
.note{font-size:12px;opacity:.7;margin:12px 0 0}
#sign{position:absolute;left:0;top:0;width:min(260px,calc(100% - 24px));background:#fff6dc;color:#1a1204;border-radius:12px;padding:8px 11px 9px;font-size:13px;line-height:1.3;box-shadow:0 3px 0 #a67c14,0 6px 18px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .25s}
#sign b{display:block;font-weight:800;font-size:13px;margin-bottom:1px}#sign span{font-weight:600}
#sign.on{opacity:1}
.results{display:flex;justify-content:center;gap:14px;align-items:center;font-weight:800;font-size:15px;margin:2px 0 12px}.results .stars{font-size:20px;letter-spacing:2px;margin:0}
.beach{background:#193a55;border-radius:12px;padding:12px 14px;text-align:left;margin:0 0 4px}
.beach .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.beach h3{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:24px;margin:0 0 2px}
.beach .fl{font-size:13px;opacity:.8;margin:0 0 10px;font-style:italic}
.beach .nw{font-size:14px;font-weight:800;margin:0 0 6px}.beach .nw i{font-style:normal;color:var(--gold)}
.beach .tp{font-size:13px;margin:0;opacity:.9}.beach .tp b{color:var(--gold)}
.phead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;margin:-6px -6px 8px}
.phead h2{margin:0;font-size:22px}.phead::after{content:'';width:64px}
.bk{background:none;border:0;color:var(--gold);font:800 14px Nunito,system-ui,sans-serif;min-height:44px;min-width:64px;padding:0 6px;text-align:left;cursor:pointer;border-radius:8px}
.bk:focus-visible{outline:3px solid #fff}
.sect{text-align:left;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:16px 2px 0}
.nav .chev{font-size:24px;line-height:1;opacity:.6}
.lbl{text-align:left;font-weight:800;font-size:14px;margin:10px 2px 0}.lbl small{display:block;font-weight:600;opacity:.7;font-size:12px}
.sw2{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;flex:none}.sw2::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.sw2.on{background:var(--gold)}.sw2.on::after{left:21px}
@media (prefers-reduced-motion:reduce){.sw2::after{transition:none}}
.btn.opt.on{border-color:var(--gold)}.dot2{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.4);flex:none}.btn.opt.on .dot2{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 45%,transparent 50%)}
.btn.danger small{color:#ffb4a4}
.card .btn+.note{margin-top:14px}.btn.armed{border-color:#ff8a70;background:#3a2226}

.chart{text-align:left;max-height:52vh;overflow-y:auto;margin:6px 0 4px;position:relative}
.crow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-left:2px dashed rgba(244,236,216,.25);margin-left:12px;padding-left:22px;position:relative}
.crow .dot{position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:#193a55;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.crow .nm{flex:1;font-weight:800;font-size:14px}.crow .nm small{display:block;color:var(--gold);font-weight:700;font-size:12px}
.crow .st{color:var(--gold);letter-spacing:2px}.crow .st .off{color:rgba(255,255,255,.2)}
.crow.lock{opacity:.45}.crow.lock .dot{border-color:rgba(244,236,216,.3)}
.crow.cur .dot{background:var(--gold);color:#1a1204}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px;border:1px solid #2a1d10}
.log{text-align:left;margin:6px 0}.lrow{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
#modal{position:absolute;inset:0;background:rgba(4,10,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.card{background:#10263a;border:1px solid var(--line);border-radius:16px;padding:20px 18px;max-width:360px;width:100%;text-align:center}
.card h2{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 6px;text-wrap:balance}
.card p{margin:0 0 10px;font-size:14px;opacity:.85}
.card .stars{font-size:30px;letter-spacing:6px;color:var(--gold);margin:4px 0 8px}
.card .stars .off{color:rgba(255,255,255,.18)}
.card .bank{font-weight:800;margin:6px 0 4px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:8px 0 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#193a55;color:var(--ink);font:800 14px Nunito,system-ui,sans-serif;text-align:left;cursor:pointer}
.btn small{display:block;font-weight:600;opacity:.75;font-size:12px}
.btn .price{color:var(--gold);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--gold);color:#1a1204;border:0;justify-content:center;box-shadow:0 3px 0 #a67c14;margin-top:14px}
.link.home{display:block;text-align:center}
.link{background:none;border:0;color:var(--ink);opacity:.6;font:600 12px Nunito,system-ui,sans-serif;margin-top:12px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c" aria-label="Lighthouse Keeper game"></canvas>
  <div id="prog" aria-hidden="true"><i id="progF"></i></div>
  <div id="hud"><div id="wal" aria-label="Coins carried"><i class="coin"></i><b id="walN">0</b><span id="walF"></span></div></div>
  <div id="flash" role="status" aria-live="polite"></div>
  <button id="menu" class="sr" type="button">Pause (tap the game or press Esc)</button>
  <div id="toast"><h2></h2><p></p></div>
  <div id="tip">Drag anywhere to walk</div>
  <div id="tut" hidden><span class="tn" id="tutN"></span><span class="h" id="tutH"></span><button type="button" id="tutSkip">Skip</button></div>
  <div id="info" hidden></div>
  <div id="sign" hidden role="status" aria-live="polite"><b id="signH"></b><span id="signP"></span></div>
  <button id="bell" type="button">Hold to light the lamp</button>
  <div id="modal" hidden><div class="card" id="card"></div></div>
</div>

<script>
(()=>{
const SIM=!!window.__SIM;
const stage=document.getElementById('stage'),cv=document.getElementById('c');let ctx=cv.getContext('2d');
const fog=document.createElement('canvas'),fctx=fog.getContext('2d');
const landCv=document.createElement('canvas'),lctx=landCv.getContext('2d');let landDirty=true;const FOGS=0.5;
const $=id=>document.getElementById(id);
let S=1,W=400,H=700,dpr=1;
const G={};let pads=[];let coast=[];

/* ---------- tuning (set by simulation) ---------- */
const CFG={firstDay:90,day:60,sk0:5,skN:3,skL:1.2,hpExp:0.68,nightGrow:0.04,chests0:4,chestCoins:5,chestsDawn:3,towerHp:100,
 skiff:{hp:18,spd:27,dps:5,r:11,coins:2},fog:{hp:26,spd:20,dps:5,r:12,coins:3,fog:true},boss:{hp:240,spd:11,dps:20,r:22,coins:14},krakenHp:36,
 trip:12,cratePrice:3,priceStep:1.5,
 /* damage as a slope, not a cliff: lit ships chip the tower from range on the way in; at the shore fewer fire at once, each harder and slower */
 chipR:210,chipGap:3.5,chipMul:0.5,chipN:3,shoreGap:2.6,shoreMul:1.8,
 /* mid game pressure from headland 3 */
 midN:1.2,midHp:1.05};
const ET={skiff:CFG.skiff,fog:CFG.fog,boss:CFG.boss};

/* ---------- map: a headland jutting north from the mainland ---------- */
/* ---------- headland maps: every beach has its own coast shape, cannon spots, approach and look ----------
   shape: cx centre, rx half-width, ry height factor, sk skew (+ raises the east flank), wob [amp,freq,phase] coves.
   slots: cannon spots as [dx from centre, depth below the coast in headland heights]. from: where ships come from,
   [weight,'t'|'l'|'r',a,b] (top: x range; sides: height range as a fraction of the sea above the point). */
const MAPS=[null,

/* ---------- camera: close in on the keeper by day, frame the whole headland at night ----------
   Screen units are CSS px / S, so the screen is always 400 units wide and H tall, and at zoom 1 centred on (200, H/2)
   the camera is exactly the old fixed view. Everything in the world is drawn and hit-tested through it; UI stays in screen space. */
const DAYZ=1.6,CAM_EASE=1.0;
let cam={x:200,y:400,z:1,tr:null,mode:''};
const scrToWorld=q=>({x:(q.x-200)/cam.z+cam.x,y:(q.y-H/2)/cam.z+cam.y}),worldToScr=p=>({x:(p.x-cam.x)*cam.z+200,y:(p.y-cam.y)*cam.z+H/2});
function camGoal(){if(!st||st.phase==='night'||st.keeper.inTower)return{x:200,y:H/2,z:1,mode:'night'};
 const z=DAYZ,hw=200/z,hh=H/(2*z),k=st.keeper,top=Math.max(0,G.cy-G.ry-150);
 return{x:Math.max(hw,Math.min(400-hw,k.x)),y:Math.max(top+hh,Math.min(H-hh,k.y-24)),z,mode:'day'};}
function camSnap(){const g=camGoal();cam.x=g.x;cam.y=g.y;cam.z=g.z;cam.mode=g.mode;cam.tr=null;}
function camUpdate(dt){const g=camGoal();
 if(g.mode!==cam.mode){cam.tr={t:0,x:cam.x,y:cam.y,z:cam.z};cam.mode=g.mode;}
 if(cam.tr){cam.tr.t+=dt;const u=Math.min(1,cam.tr.t/CAM_EASE),e=u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  /* ease in view-size space so the zoom feels even */
  const iz=1/cam.tr.z+(1/g.z-1/cam.tr.z)*e;cam.z=1/iz;cam.x=cam.tr.x+(g.x-cam.tr.x)*e;cam.y=cam.tr.y+(g.y-cam.tr.y)*e;if(u>=1)cam.tr=null;}
 else{const f=1-Math.exp(-dt*6);cam.x+=(g.x-cam.x)*f;cam.y+=(g.y-cam.y)*f;cam.z+=(g.z-cam.z)*f;}}
function applyCam(c,k,ox,oy){c.setTransform(k*cam.z,0,0,k*cam.z,k*(200-cam.x*cam.z+ox),k*(H/2-cam.y*cam.z+oy));}

function downArrow(x,ay0){const b=meta.rm?0:Math.abs(Math.sin(clock*4))*6,ay=ay0-b;ctx.fillStyle='#f6c343';ctx.strokeStyle='#2a1d10';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-9,ay-10);ctx.lineTo(x+9,ay-10);ctx.lineTo(x+9,ay-3);ctx.lineTo(x+14,ay-3);ctx.lineTo(x,ay+9);ctx.lineTo(x-14,ay-3);ctx.lineTo(x-9,ay-3);ctx.closePath();ctx.fill();ctx.stroke();}

/* ---------- HUD ---------- */
let lastInfo='',lastWal=-1,lastFish=-1,walT=0,lastLeft=-1,lastPh='',flashT=0,progW='';
/* transient status line: night number and threats, shown when they change and then faded */
function flash(t,secs){if(SIM)return;const el=$('flash');el.textContent=t;el.style.opacity=1;flashT=secs||2.2;}
const threatsLeft=()=>st.enemies.length+st.q.filter(x=>x.type!=='merchant').length+st.krakens.length;
function hud(dt){const left=threatsLeft(),night=st.phase==='night';
 if(flashT>0){flashT-=dt||0;if(flashT<=0)$('flash').style.opacity=0;}
 const ph=st.over?'over':st.phase+st.night;

 else if(night&&left!==lastLeft){if(left<lastLeft)flash(left?`${left} threat${left===1?'':'s'} left`:`Night ${st.night} cleared`,left?1.6:2.6);lastLeft=left;}
 if(st.carried!==lastWal){const w=$('wal');if(st.carried>lastWal&&lastWal>=0&&!meta.rm){w.classList.remove('bump');void w.offsetWidth;w.classList.add('bump');}$('walN').textContent=st.carried;lastWal=st.carried;}
 if(st.fish!==lastFish){$('walF').innerHTML=st.fish?`<i class="crt"></i>×${st.fish}${st.fish>=8?'<span class="full">full</span>':''}`:'';lastFish=st.fish;}
 walT-=1;if(walT<=0){walT=30;const wr=$('wal').getBoundingClientRect(),sr=stage.getBoundingClientRect();G.wsx=(wr.left+7-sr.left)/S;G.wsy=(wr.top+wr.height/2-sr.top)/S;}
 {const u=night?(st.nightTotal?1-left/st.nightTotal:0):Math.min(1,st.t/st.dayLen),w=(u*100).toFixed(1)+'%',c=night?'#b9c7d6':(st.dayLen-st.t<15?'#f08a4b':'#f6c343'),k=w+c;
  if(k!==progW){progW=k;const f=$('progF');f.style.width=w;f.style.background=c;}}
 $('bell').hidden=st.phase!=='day'||st.over||(tutOn()&&pads.find(p=>p.id==='canL').level<1);{const b=st.phase==='day'?earlyBonus():0,tx=b>0?'Hold to light the lamp · +'+b:'Hold to light the lamp';if($('bell').textContent!==tx)$('bell').textContent=tx;}
 let near=null,nd=1e9;if(!st.over&&!st.keeper.inTower)for(const p of pads){if(!unlocked(p)||!padOpen(p)||p.build>0||p.lock)continue;const pp=padPos(p),d=Math.hypot(st.keeper.x-pp.x,st.keeper.y-pp.y);if(d<pp.s/2+16&&d<nd){nd=d;near=p;}}
 let html='';if(near){const i=padInfo(near),rem=cost(near)-near.paid;html=`<span class="cost${st.carried<rem?' short':''}">${rem} coins</span><b>${i.t} · ${near.type==='mason'?(st.hp>=st.maxHp?'shield':'repair'):near.level?'level '+(near.level+1):'build'}</b><div class="stat">${i.s}</div>`;}
 if(html!==lastInfo){lastInfo=html;$('info').innerHTML=html;$('info').hidden=!html;}
 {const tc=tutCur(),el=$('tut');stage.classList.toggle('tutOn',!!tc);el.hidden=!tc;if(tc){const tx=`Step ${tc.i+1} of ${tc.n}`;if($('tutN').textContent!==tx)$('tutN').textContent=tx;if($('tutH').textContent!==tc.h)$('tutH').textContent=tc.h;}
  if(tc&&tc.i===5){bellEl.style.boxShadow=meta.rm?'0 0 0 4px #fff':`0 0 0 ${3+2*Math.sin(clock*6)|0}px #fff, 0 3px 0 #a67c14`;}else bellEl.style.boxShadow='';}
 const tip=$('tip');let t='';
 if(!html&&!st.over&&!msgCur){if(st.phase==='day'&&st.L===1&&pads[0].level===0)t=st.chests.some(c=>!c.open)?'Drag anywhere to walk · follow the arrow · tap to pause':'Stand still on the boat spot to build it';
  else if(st.fish>0&&st.phase==='day'&&Math.hypot(st.keeper.x-market().x,st.keeper.y-market().y)>60)t='Fish only pays once sold: take your crates to the market';
  }
 tip.textContent=t;tip.style.opacity=t?1:0;}

/* ---------- loop ---------- */
if(window.__DGTEST)window.__dg={get st(){return st},get pads(){return pads},set st(v){st=v},snapState,saveRun,newIsland,lose,cleared,end:w=>{if(st.over)return;w?cleared():lose();},sign:(id,h,p)=>sign(id,()=>st.keeper,h,p),get meta(){return meta}};
