<style>
:root{--ink:#1c2f34;--soft:#4a5d61;--page:#e4d9c5;--deep:#1d4750;--sea:#24545c;--foam:#f5f7f2;--glass:rgba(250,248,243,.9);--line:rgba(28,47,52,.1);--focus:#1f6f86;--font:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}

body{overflow:hidden;overscroll-behavior:none;background:transparent}
#stage{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--page);
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

#fsBtn{z-index:5}
#stage.wide .ibtn{background:rgba(255,255,255,.7);border-color:var(--line);color:var(--ink)}
.ibtn:focus-visible,.btn:focus-visible,.back:focus-visible,.bk:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.back{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--foam);font-weight:700;font-size:14px;text-decoration:none;z-index:5}
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(18,42,48,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow-y:auto;z-index:4}
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.15);backdrop-filter:blur(20px) saturate(1.15);border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:24px 18px 18px;width:100%;max-width:368px;box-shadow:0 24px 60px rgba(12,34,40,.28),0 2px 6px rgba(12,34,40,.08);text-align:center;max-height:100%;overflow-y:auto}
.card h2{font-weight:700;font-size:24px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.card h2.hero{font-weight:300;font-size:44px;letter-spacing:-.035em;margin:4px 0 10px;color:var(--deep)}
.card h3{font-weight:700;font-size:15px;margin:18px 4px 8px;text-align:left}
.card p{margin:0 auto 12px;font-size:15px;line-height:1.5;color:var(--soft);max-width:32ch}
.card .small{font-size:13.5px}
.card .foot{font-size:13px;margin:14px 0 0;color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;margin:0;padding:10px 16px;border:0;border-radius:0;background:transparent;color:var(--ink);font:600 15px var(--font);text-align:left;cursor:pointer;text-decoration:none}
.btn small{display:block;font-weight:500;font-size:13px;color:var(--soft);margin-top:1px}
.btn.primary{background:var(--deep);color:var(--foam);border-radius:26px;justify-content:center;font-weight:700;font-size:16px;margin:6px 0 0;box-shadow:0 6px 16px rgba(29,71,80,.28)}
.btn.armed{background:#fbefe6}
.btn.armed small{color:#8a3b1c}
.btn:disabled{cursor:default;color:var(--soft)}
.btn .chev{font-size:22px;line-height:1;color:var(--soft)}
.list{background:rgba(255,255,255,.7);border-radius:18px;overflow:hidden;margin-top:12px;text-align:left}
.list>.btn+.btn,.list>.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.sw{width:46px;height:28px;border-radius:14px;background:#cfc8ba;position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--deep)}.sw.on::after{left:21px}
.sect{font-size:13px;font-weight:700;color:var(--soft);text-align:left;margin:20px 6px 0}
.sect+.list{margin-top:8px}
.phead{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin:-10px -6px 8px}
.phead h2{margin:0;font-size:18px}
.phead .bk{background:none;border:0;color:var(--deep);font:700 15px var(--font);min-height:44px;text-align:left;padding:0 8px;cursor:pointer;border-radius:12px}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 4px}
.slot{background:rgba(255,255,255,.62);border-radius:16px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:100px}
.slot canvas{width:48px;height:48px}
.slot b{font-size:12px;line-height:1.25;font-weight:700;color:var(--ink)}
.slot span{font-size:11.5px;color:var(--soft);line-height:1.25}
.slot.no b{color:var(--soft);font-weight:600}
.row{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 16px;font-size:15px}
.row .grow{flex:1}
.new{font-size:11.5px;font-weight:700;background:var(--deep);color:var(--foam);border-radius:10px;padding:3px 8px;white-space:nowrap}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);border-radius:20px;padding:5px 12px 5px 6px;font-size:15px}
.chip b{font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}
.fcell{background:rgba(255,255,255,.62);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;line-height:1.25}
.fcell canvas{width:52px;height:52px}
.fcell b{font-weight:700}
.fcell .sub{color:var(--soft);font-size:12px}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid #a39c8e;flex:none}
.opt.on .dot{border-color:var(--deep);background:radial-gradient(circle,var(--deep) 0 45%,transparent 50%)}
#modal.titlev{padding:0;display:block;background:linear-gradient(180deg,rgba(14,36,42,.82) 0%,rgba(14,36,42,.6) 38%,rgba(14,36,42,.38) 62%,rgba(14,36,42,.55) 100%);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
#modal.titlev .card{position:absolute;inset:0;max-width:none;max-height:none;border-radius:0;border:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 24px;overflow:hidden}
.tv-top{position:absolute;left:24px;right:24px;top:calc(76px + env(safe-area-inset-top,0px))}
#modal.titlev .hero{color:var(--foam);font-size:54px;margin:0 0 12px}
.tv-top p{color:var(--foam);opacity:.92;font-size:15.5px;max-width:30ch}
.tv-mid{position:absolute;left:0;right:0;top:55%;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.tv-mid .btn.primary{width:min(340px,100%);min-height:56px;background:var(--foam);color:var(--deep);font-size:17px;box-shadow:0 10px 30px rgba(8,24,28,.35)}
.tv-links{display:flex;gap:10px;margin-top:14px;width:min(340px,100%)}
.tv-links .btn{flex:1;min-height:56px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--foam);font-size:14px;font-weight:700;padding:8px 12px;justify-content:center;text-align:center}
.tv-links .btn small{color:var(--foam);opacity:.85;font-size:12px}
.tv-mid .foot{color:var(--foam);opacity:.85;font-size:13px;margin:16px 0 0}
@media (max-height:600px){.tv-top{top:calc(60px + env(safe-area-inset-top,0px))}#modal.titlev .hero{font-size:42px}}
@media (orientation:landscape) and (max-height:620px){.tv-top{top:50%;transform:translateY(-50%);right:auto;width:44%;text-align:left}.tv-top p{margin-left:0}.tv-mid{left:48%;top:50%;transform:translateY(-50%)}}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:rgba(245,247,242,.94);border-radius:20px;padding:10px 16px;font-weight:700;font-size:14px;line-height:1.3;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .6s;max-width:calc(100% - 132px);text-align:center;box-shadow:0 8px 24px rgba(12,34,40,.22);z-index:3}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tut{display:flex;align-items:center;gap:12px;text-align:left}
.tut p{margin:0;flex:1;font-weight:600;color:var(--ink);font-size:16px;line-height:1.35;max-width:none}
.tut .btn{width:auto;flex:none;min-width:96px;margin:0}
@media (prefers-reduced-motion:reduce){.sw,.sw::after,#toast{transition:none}}
</style>
</head>

<script>
(()=>{'use strict';
/* ---------- engine: pure board logic (shared with the balance simulator) ---------- */
const COLS=7,ROWS=8,NC=6;
const TIDE_SECS=240;
const BAL={jar0:24,jarStep:2,jarCap:40,k4At:99,findRow:6,findAdj:1};
/* animation timings in seconds; the simulator uses the same numbers */
const TIMES={swap:.2,back:.2,clear:.4,fallBase:.22,fallRow:.05,shuffle:1.5};
const TIMES_RM={swap:.12,back:.12,clear:.22,fallBase:.14,fallRow:.02,shuffle:.6};
function rngFrom(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function colourGrid(P){return P.map(row=>row.map(p=>p?p.c:-1));}
function matchCells(g){const m=new Set();
 for(let r=0;r<ROWS;r++){let run=1;for(let c=1;c<=COLS;c++){if(c<COLS&&g[r][c]>=0&&g[r][c]===g[r][c-1])run++;else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r*COLS+k);run=1;}}}
 for(let c=0;c<COLS;c++){let run=1;for(let r=1;r<=ROWS;r++){if(r<ROWS&&g[r][c]>=0&&g[r][c]===g[r-1][c])run++;else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k*COLS+c);run=1;}}}
 return m;}
function lineAt(g,r,c){const v=g[r][c];if(v<0)return 0;let h=1,k=c-1;while(k>=0&&g[r][k]===v){h++;k--;}k=c+1;while(k<COLS&&g[r][k]===v){h++;k++;}
 let w=1;k=r-1;while(k>=0&&g[k][c]===v){w++;k--;}k=r+1;while(k<ROWS&&g[k][c]===v){w++;k++;}return (h>=3?h:0)+(w>=3?w:0);}
function swapGain(g,r1,c1,r2,c2){const a=g[r1][c1],b=g[r2][c2];if(a===b||a<0||b<0)return null;g[r1][c1]=b;g[r2][c2]=a;
 const x=lineAt(g,r1,c1),y=lineAt(g,r2,c2);g[r1][c1]=a;g[r2][c2]=b;if(!x&&!y)return null;
 const out={};if(x)out[b]=(out[b]||0)+x;if(y)out[a]=(out[a]||0)+y;return out;}
function listMoves(g){const out=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
 if(c+1<COLS){const s=swapGain(g,r,c,r,c+1);if(s)out.push({r1:r,c1:c,r2:r,c2:c+1,gain:s});}
 if(r+1<ROWS){const s=swapGain(g,r,c,r+1,c);if(s)out.push({r1:r,c1:c,r2:r+1,c2:c,gain:s});}}return out;}
function isNeighbour(r1,c1,r2,c2){return Math.abs(r1-r2)+Math.abs(c1-c2)===1;}
function makeBoard(rng,ids,opts){opts=opts||{};
 for(let tries=0;tries<400;tries++){const g=[];
  for(let r=0;r<ROWS;r++){g.push([]);for(let c=0;c<COLS;c++){let v,guard=0;
   do{v=Math.floor(rng()*NC);guard++;}while(guard<50&&((c>=2&&g[r][c-1]===v&&g[r][c-2]===v)||(r>=2&&g[r-1][c]===v&&g[r-2][c]===v)));g[r].push(v);}}
  if(opts.easy!==undefined&&!plantEasy(g,rng,opts.easy))continue;
  if(matchCells(g).size)continue;
  if(listMoves(g).length<(opts.minMoves||3))continue;
  return g.map(row=>row.map(c=>({id:ids.n++,c})));}
 throw new Error('board');}
/* the first board ever: a plain horizontal match in the middle of the board, in a colour the jar wants */
function plantEasy(g,rng,col){const r=4,c=2;g[r][c]=col;g[r][c+1]=col;g[r][c+2]=(col+1)%NC;g[r+1][c+2]=col;
 for(let k=0;k<COLS;k++)if(k<c||k>c+2){if(g[r][k]===col)g[r][k]=(col+2+k)%NC;}

const ROUND_R=[.37,.358,.372,.352,.366,.36,.355,.37];

  case 'round':{const n=ROUND_R.length,pts=ROUND_R.map((r,i)=>{const a=i/n*Math.PI*2;return[Math.cos(a)*r*u,Math.sin(a)*r*u];});

  case 'oval':c.ellipse(0,0,.42*u,.28*u,-.38,0,Math.PI*2);break;

let shownGot={},jarShown=[],shownGathered=0,trayShown=[false,false,false],tutEl=null,modalOpen=false,cardKind=null,srHalf=false,srNear=false;
const TM=()=>meta.rm?TIMES_RM:TIMES;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const easeS=k=>-(Math.cos(Math.PI*k)-1)/2;
const cellX=c=>L.bx+(c+.5)*L.cell,cellY=r=>L.by+(r+.5)*L.cell;
const jarFull=()=>Object.keys(run.targets).every(k=>run.got[k]>=run.targets[k]);
const freedCount=()=>run.finds.filter(f=>f.freed).length;
function say(t){const el=$('live');el.textContent='';setTimeout(()=>{el.textContent=t;},30);}

function pickFinds(){const B=meta.beach,pool=FINDS.filter(f=>f.beach==='sand'||f.beach===B),out=[];
 for(let n=0;n<3;n++){let tot=0;const w=pool.map(f=>{if(out.includes(f.id))return 0;let x=meta.found[f.id]?1:3;if(B!=='sand'&&f.beach===B)x*=2;tot+=x;return x;});
  let r=rng()*tot,pick=null;for(let i=0;i<pool.length;i++){if(!w[i])continue;r-=w[i];pick=pool[i].id;if(r<=0)break;}out.push(pick);}
 return out;}
function newRun(kind){const targets=jarPlan(meta.filled,rng),first=!meta.tutDone,got={};for(const k in targets)got[k]=0;
 ids={n:1};const easyCol=+Object.keys(targets)[0];P=makeBoard(rng,ids,first?{easy:easyCol}:{});
 const finds=placeFinds(rng,pickFinds(),first?[[4,2],[4,3],[4,4],[5,4]]:null);
 run={v:1,tide:meta.tide,targets,got,gathered:0,p:0,finds,started:false,startKind:kind,total0:meta.total,easy:first?{r1:4,c1:4,r2:5,c2:4}:null};
 srHalf=srNear=false;rndArm(kind);resetDisplay();saveRun();}
function restoreRun(o){run=o;run.total0=meta.total;run.easy=null;ids={n:1};P=o.board.map(row=>row.map(c=>({id:ids.n++,c})));
 if(matchCells(colourGrid(P)).size||!listMoves(colourGrid(P)).length)shuffleBoard(P,rng,ids);
 if(run.started)run.startKind='resume';rndArm(run.startKind);srHalf=run.p>=.5;srNear=run.p>=.85;resetDisplay();}
function resetDisplay(){disp.clear();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=P[r][c];disp.set(p.id,{x:c,y:r,a:1,s:1,c:p.c});}
 shownGot=Object.assign({},run.got);jarShown=[];const ks=Object.keys(run.got);let more=true;for(let i=0;more;i++){more=false;for(const k of ks)if(i<run.got[k]){jarShown.push(+k);more=true;}}
 shownGathered=run.gathered;trayShown=run.finds.map(f=>f.freed);fliers=[];fx=[];phase='idle';anim=null;queue=[];cur=null;sel=null;hint=null;idleT=0;pendingEnd=false;}
function saveRun(){if(!run||mode==='end')return;sset(RUNKEY,{v:1,tide:run.tide,p:run.p,gathered:run.gathered,board:colourGrid(P),targets:run.targets,got:run.got,finds:run.finds,started:run.started,startKind:run.startKind});}

/* ---------- moves ---------- */
function beginRound(){if(!rnd.open){rndStart();if(rnd.open)run.started=true;}}
const canPlay=()=>mode==='play'&&!modalOpen&&phase==='idle'&&!pendingEnd&&run.p<1;
function trySwap(r1,c1,r2,c2){if(!canPlay()||r2<0||r2>=ROWS||c2<0||c2>=COLS||!isNeighbour(r1,c1,r2,c2))return false;
 audioInit();idleT=0;hint=null;sel=null;
 beginRound();
 const a=P[r1][c1],b=P[r2][c2];
 if(!swapGain(colourGrid(P),r1,c1,r2,c2)){phase='back';anim={t:0,a:{id:a.id,f:[r1,c1],to:[r2,c2]},b:{id:b.id,f:[r2,c2],to:[r1,c1]}};sfx('back');return true;}
 if(tutEl)hideTutorial();
 P[r1][c1]=b;P[r2][c2]=a;const steps=resolveBoard(P,rng,ids,run.finds);
 for(const s of steps)if(s.type==='clear'){for(const q of s.cleared){run.gathered++;meta.total++;if(run.targets[q.c]!==undefined&&run.got[q.c]<run.targets[q.c]){run.got[q.c]++;q.jar=true;}}
  s.fresh=s.freed.map(id=>{meta.found[id]=(meta.found[id]||0)+1;return meta.found[id]===1;});}
 saveMeta();saveRun();phase='swap';anim={t:0,a:{id:a.id,f:[r1,c1],to:[r2,c2]},b:{id:b.id,f:[r2,c2],to:[r1,c1]}};queue=steps;sfx('swap');return true;}
function pickHint(){if(run.easy&&P[run.easy.r1]&&swapGain(colourGrid(P),run.easy.r1,run.easy.c1,run.easy.r2,run.easy.c2))return run.easy;
 const ms=listMoves(colourGrid(P));if(!ms.length)return null;let best=null,bs=-1;
 for(const m of ms){let s=0;for(const k in m.gain){s+=m.gain[k];if(run.targets[k]!==undefined&&run.got[k]<run.targets[k])s+=10;}if(s>bs){bs=s;best=m;}}return best;}

/* ---------- playback ---------- */
function startStep(){cur=queue.shift();stepT=0;if(!cur){settle();return;}const T=TM();
 if(cur.type==='clear'){sub='lift';sfx('clink',cur.depth);
  cur.cleared.forEach((q,i)=>{const d=disp.get(q.id);if(d)d.going=true;fliers.push({c:q.c,x0:cellX(q.col),y0:cellY(q.r),t:-(T.clear*.55+i*.035),dur:(meta.rm?.45:.85)+Math.random()*.12,jar:!!q.jar});});
  cur.freed.forEach((id,i)=>{const f=run.finds.find(x=>x.id===id),slot=run.finds.indexOf(f);fx.push({f:FIND[id],slot,x0:cellX(f.c),y0:cellY(f.r),t:0,dur:meta.rm?1.1:1.7});sfx('find');
   toast((cur.fresh[i]?'New rare find: ':'Rare find: ')+FIND[id].name);say('Rare find freed: '+FIND[id].name+'.');});}
 else{sub='wave';waveDone=false;sfx('wave');toast('A wave rearranges the glass');say('No moves were left, so a wave rearranged the glass.');}}
function stepUpdate(dt){const T=TM();stepT+=dt;
 if(sub==='lift'){const k=Math.min(1,stepT/T.clear);for(const q of cur.cleared){const d=disp.get(q.id);if(d){d.s=1+(meta.rm?.04:.14)*easeS(Math.min(1,k*1.6));d.a=1-easeS(k);d.lift=meta.rm?0:k*.18;}}
  if(k>=1){for(const q of cur.cleared)disp.delete(q.id);let md=0;
   for(const f of cur.fall){const d=disp.get(f.id);if(d){d.fy0=f.r0;d.fy1=f.r1;md=Math.max(md,f.r1-f.r0);}}
   for(const s of cur.spawn){disp.set(s.id,{x:s.col,y:s.r0,a:1,s:1,c:s.c,fy0:s.r0,fy1:s.r1});md=Math.max(md,s.r1-s.r0);}
   fallDur=T.fallBase+T.fallRow*md;sub='fall';stepT=0;}}
 else if(sub==='fall'){const k=Math.min(1,stepT/fallDur),e=easeS(k);
  for(const d of disp.values())if(d.fy1!==undefined){d.y=d.fy0+(d.fy1-d.fy0)*e;if(k>=1){d.y=d.fy1;delete d.fy0;delete d.fy1;}}
  if(k>=1)startStep();}
 else if(sub==='wave'){if(!waveDone&&stepT>=T.shuffle/2){waveDone=true;const keep=new Map(disp);disp.clear();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=P[r][c];disp.set(p.id,{x:c,y:r,a:1,s:1,c:p.c});}}
  if(stepT>=T.shuffle)startStep();}}
function settle(){phase='idle';cur=null;idleT=0;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=P[r][c],d=disp.get(p.id);if(d){d.x=c;d.y=r;d.a=1;d.s=1;d.lift=0;d.going=false;}else disp.set(p.id,{x:c,y:r,a:1,s:1,c:p.c});}
 saveRun();
 const need=Object.keys(run.targets).filter(k=>run.got[k]<run.targets[k]).map(k=>(run.targets[k]-run.got[k])+' '+glassLabel(+k)+(run.targets[k]-run.got[k]>1?'s':''));
 say(need.length?'Jar still needs '+need.join(', ')+'.':'The jar is full.');
 if(jarFull())pendingEnd=true;else ensureMoves();}
function ensureMoves(){if(phase!=='idle'||listMoves(colourGrid(P)).length)return;const sh=shuffleBoard(P,rng,ids);queue=[{type:'shuffle',pos:sh.pos,fresh:sh.fresh}];phase='steps';startStep();saveRun();}

/* ---------- the tide ---------- */
function finish(win){if(mode!=='play')return;pendingEnd=false;hideTutorial();
 const stars=freedCount();rndEnd(win,{score:run.gathered,stars});
 const unlocked=[...BEACHES.map(b=>({n:b.name,kind:'beach',need:b.need})),...JARS.map(j=>({n:j.name,kind:'jar',need:j.need}))].filter(u=>u.need>run.total0&&u.need<=meta.total);
 const done=run;if(win)meta.filled++;meta.tide=done.tide+1;saveMeta();sdel(RUNKEY);mode='end';sel=null;hint=null;
 sfx(win?'full':'turn');say(win?'The jar is full.':'The tide has turned.');showEnd(win,done,stars,unlocked);}

/* ---------- update ---------- */
function update(dt){toastTick(dt);if(mode!=='play'||modalOpen)return;clock+=dt;const T=TM();
 if(rnd.open)rnd.secs+=dt;
 if(rnd.open&&run.p<1&&!pendingEnd){run.p=Math.min(1,run.p+dt/TIDE_SECS);
  if(!srHalf&&run.p>=.5){srHalf=true;say('The tide is halfway up the shore.');}if(!srNear&&run.p>=.85){srNear=true;say('The tide is near the sandcastle.');}}
 if(phase==='swap'||phase==='back'){anim.t+=dt;const tot=phase==='swap'?T.swap:T.swap+T.back;let k;
  if(phase==='swap')k=ease(Math.min(1,anim.t/T.swap));else{const amp=.42;k=anim.t<T.swap?ease(anim.t/T.swap)*amp:ease(Math.max(0,1-(anim.t-T.swap)/T.back))*amp;}
  for(const o of [anim.a,anim.b]){const d=disp.get(o.id);if(!d)continue;d.x=o.f[1]+(o.to[1]-o.f[1])*k;d.y=o.f[0]+(o.to[0]-o.f[0])*k;}
  if(anim.t>=tot){if(phase==='swap'){phase='steps';startStep();}else{for(const o of [anim.a,anim.b]){const d=disp.get(o.id);if(d){d.x=o.f[1];d.y=o.f[0];}}phase='idle';anim=null;}}}
 else if(phase==='steps')stepUpdate(dt);
 for(const f of fliers){f.t+=dt;if(f.t>=f.dur&&!f.done){f.done=true;shownGathered++;if(f.jar){jarShown.push(f.c);shownGot[f.c]=(shownGot[f.c]||0)+1;sfx('land');}}}
 fliers=fliers.filter(f=>!f.done);
 for(const e of fx){e.t+=dt;if(e.t>=e.dur&&!e.done){e.done=true;trayShown[e.slot]=true;}}fx=fx.filter(e=>!e.done);
 if(phase==='idle'){idleT+=dt;if(meta.hints&&!hint&&(idleT>8||tutEl))hint=pickHint();
  if((pendingEnd||run.p>=1)&&!fliers.length&&!fx.length){shownGot=Object.assign({},run.got);finish(jarFull());}}}

/* ---------- toast ---------- */
const toastQ=[];let toastT=0,toastOn=false;
function toast(t){if(toastQ.length<4)toastQ.push(t);}
function toastTick(dt){const el=$('toast');if(toastOn){toastT-=dt;if(toastT<=0){toastOn=false;el.classList.remove('on');toastT=-.5;}}
 else{toastT+=dt;if(toastT>=0&&toastQ.length){el.textContent=toastQ.shift();el.classList.add('on');toastOn=true;toastT=2.6;}}}
/* ---------- drawing ---------- */
const FONT='Manrope,system-ui,-apple-system,"Segoe UI",sans-serif';
let amb=0;   // ambient time: the sea keeps moving on the title screen, and stops under reduced motion
function draw(){const B=beachOf(meta.beach);ctx.setTransform(dpr,0,0,dpr,0,0);amb=meta.rm?0:performance.now()/1000;
 if(scene)ctx.drawImage(scene,0,0,W,H);if(!run)return;
 drawSea(B);drawHud(B);drawBoard(B);drawShoreEdge(B);drawTide(B);drawFinds(B);
 for(const f of fliers){if(f.t<0)continue;const k=Math.min(1,f.t/f.dur),e=easeS(k),tg=f.jar?{x:L.jar.x+L.jar.w/2,y:L.jar.y+24}:{x:L.tg.x+60,y:L.tg.y+64};
  const x=f.x0+(tg.x-f.x0)*e,y=f.y0+(tg.y-f.y0)*e-(meta.rm?0:Math.sin(Math.PI*k)*46),s=L.cell*SPR*(1-.6*e);ctx.globalAlpha=f.jar?1:1-.75*k;ctx.drawImage(sprites[f.c],x-s/2,y-s/2,s,s);ctx.globalAlpha=1;}
 for(const e of fx){const k=e.t/e.dur,sl=slotPos(e.slot),s0=L.cell*.95,s1=sl.s*.95;let x,y,s,a=1;
  if(k<.45){const q=easeS(k/.45);x=e.x0;y=e.y0-q*L.cell*(meta.rm?.1:.5);s=s0;a=meta.rm?q:1;
   if(!meta.rm){const g=ctx.createRadialGradient(x,y,2,x,y,s0*.8);g.addColorStop(0,`rgba(255,250,228,${.75*q})`);g.addColorStop(1,'rgba(255,250,228,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s0*.8,0,7);ctx.fill();}}
  else{const q=easeS((k-.45)/.55),yy=e.y0-L.cell*(meta.rm?.1:.5);x=e.x0+(sl.x-e.x0)*q;y=yy+(sl.y-yy)*q-(meta.rm?0:Math.sin(Math.PI*q)*40);s=s0+(s1-s0)*q;}
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);drawFind(ctx,e.f,s,false);ctx.restore();}}

function seaPath(){const s=L.sea;ctx.beginPath();if(!s.r){ctx.rect(0,0,s.w,s.h);return;}ctx.moveTo(0,0);ctx.lineTo(s.w,0);ctx.lineTo(s.w,s.h-s.r);ctx.arcTo(s.w,s.h,s.w-s.r,s.h,s.r);ctx.lineTo(0,s.h);ctx.closePath();}
function drawSea(B){const s=L.sea;ctx.save();seaPath();ctx.clip();
 const g=ctx.createLinearGradient(0,0,0,s.h);g.addColorStop(0,B.deep);g.addColorStop(.82,B.sea);g.addColorStop(1,B.shallow);ctx.fillStyle=g;ctx.fillRect(0,0,s.w,s.h);
 ctx.lineCap='round';
 for(let i=0;i<8;i++){const y=s.h*(.08+i*.12),ph=i*1.7+amb*(.16+i*.025);ctx.strokeStyle=`rgba(255,255,255,${(.03+.018*(i%3)).toFixed(3)})`;ctx.lineWidth=1+(i%2)*.8;ctx.beginPath();
  for(let x=-10;x<=s.w+10;x+=10){const yy=y+Math.sin(x/57+ph)*3.2+Math.sin(x/19-ph*1.3)*1.1;x===-10?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}ctx.stroke();}
 if(s.r){const f=ctx.createLinearGradient(0,s.h-14,0,s.h);f.addColorStop(0,'rgba(255,255,255,0)');f.addColorStop(1,'rgba(255,255,255,.18)');ctx.fillStyle=f;ctx.fillRect(0,s.h-14,s.w,14);}
 ctx.restore();}
/* the surf line where the sea meets the board: drawn over the top row so new glass washes in from under it */
function drawShoreEdge(B){if(L.wide)return;const y=L.sea.h;ctx.save();
 const wave=(off,amp,sp,ph)=>x=>y+off+Math.sin(x*.045+amb*sp+ph)*amp+Math.sin(x*.11-amb*sp*.7)*amp*.35;
 const a=wave(2,2.2,.8,0),b=wave(7,1.6,.6,2);
 ctx.beginPath();ctx.moveTo(0,y-6);for(let x=0;x<=W;x+=6)ctx.lineTo(x,a(x));ctx.lineTo(W,y-6);ctx.closePath();ctx.fillStyle=B.shallow;ctx.fill();
 ctx.beginPath();for(let x=0;x<=W;x+=6){x?ctx.lineTo(x,b(x)):ctx.moveTo(x,b(x));}for(let x=W;x>=0;x-=6)ctx.lineTo(x,a(x));ctx.closePath();ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=B.foam;ctx.lineWidth=2.6;ctx.beginPath();for(let x=0;x<=W;x+=6){x?ctx.lineTo(x,a(x)):ctx.moveTo(x,a(x));}ctx.stroke();
 ctx.globalAlpha=.45;ctx.lineWidth=1.2;ctx.beginPath();for(let x=0;x<=W;x+=6){x?ctx.lineTo(x,b(x)):ctx.moveTo(x,b(x));}ctx.stroke();ctx.restore();}

function drawHud(B){const J=L.jar,total=Object.values(run.targets).reduce((a,b)=>a+b,0);
 drawJar(ctx,J.x,J.y,J.w,J.h,jarShown,total,meta.jar,true);
 ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle=B.foam;
 ctx.globalAlpha=.92;ctx.font=`700 14px ${FONT}`;ctx.fillText('Tide '+run.tide,L.label.x,L.label.y);ctx.globalAlpha=1;
 const keys=Object.keys(run.targets),cw=Math.min(84,L.tg.w/keys.length);
 keys.forEach((k,i)=>{const x=L.tg.x+i*cw,y=L.tg.y+20,left=run.targets[k]-(shownGot[k]||0),done=left<=0;
  ctx.globalAlpha=done?.55:1;ctx.drawImage(sprites[k],x-9,y-26,52,52);ctx.globalAlpha=1;
  if(done){ctx.fillStyle=B.foam;ctx.beginPath();ctx.arc(x+28,y+10,8.5,0,7);ctx.fill();ctx.strokeStyle=B.deep;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x+24,y+10);ctx.lineTo(x+27,y+13);ctx.lineTo(x+32.5,y+7);ctx.stroke();}
  else{ctx.fillStyle=B.foam;ctx.font=`800 22px ${FONT}`;ctx.fillText(String(left),x+39,y+1);}});
 ctx.fillStyle=B.foam;ctx.globalAlpha=.88;ctx.font=`600 13px ${FONT}`;ctx.fillText(shownGathered+(shownGathered===1?' piece':' pieces')+' gathered',L.tg.x,L.tg.y+62);ctx.globalAlpha=1;}

function drawCastle(cx,by,B){const c=B.castle,d=darken(c,.25);ctx.save();
 ctx.fillStyle='rgba(70,48,22,.16)';ctx.beginPath();ctx.ellipse(cx,by+.5,18,3,0,0,7);ctx.fill();
 ctx.fillStyle=c;ctx.strokeStyle=d;ctx.lineWidth=1;ctx.lineJoin='round';
 const tower=(x,w,h)=>{const l=x-w/2,r=x+w/2,t=by-h;ctx.beginPath();ctx.moveTo(l,by);ctx.lineTo(l+1,t);ctx.lineTo(l+1,t-3);ctx.lineTo(x-w/6,t-3);ctx.lineTo(x-w/6,t);ctx.lineTo(x+w/6,t);ctx.lineTo(x+w/6,t-3);ctx.lineTo(r-1,t-3);ctx.lineTo(r-1,t);ctx.lineTo(r,by);ctx.closePath();ctx.fill();ctx.stroke();};
 tower(cx-9,9,9);tower(cx+9,9,9);tower(cx,11,15);
 ctx.strokeStyle='#34474c';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(cx,by-18);ctx.lineTo(cx,by-25);ctx.stroke();
 ctx.fillStyle=B.sea;ctx.beginPath();ctx.moveTo(cx,by-25);ctx.lineTo(cx+7,by-23);ctx.lineTo(cx,by-21);ctx.closePath();ctx.fill();ctx.restore();}
function drawTide(B){const t=L.tide,p=run.p;ctx.save();rr(ctx,t.x,t.y,t.w,t.h,t.h/2);ctx.clip();
 let g=ctx.createLinearGradient(0,t.y,0,t.y+t.h);g.addColorStop(0,B.dry2);g.addColorStop(1,B.dry);ctx.fillStyle=g;ctx.fillRect(t.x,t.y,t.w,t.h);
 g=ctx.createLinearGradient(0,t.y,0,t.y+9);g.addColorStop(0,'rgba(70,48,22,.16)');g.addColorStop(1,'rgba(70,48,22,0)');ctx.fillStyle=g;ctx.fillRect(t.x,t.y,t.w,9);
 const right=t.x+t.w-14,left=t.x+44,wx=right-p*(right-left);
 const edge=(off,amp,sp)=>{ctx.beginPath();ctx.moveTo(t.x+t.w,t.y);for(let y=0;y<=t.h;y+=3)ctx.lineTo(wx+off+Math.sin(y*.4+amb*sp)*amp,t.y+y);ctx.lineTo(t.x+t.w,t.y+t.h);ctx.closePath();};
 ctx.fillStyle=B.wet1;ctx.globalAlpha=.5;edge(-10,1.8,.8);ctx.fill();ctx.globalAlpha=1;
 g=ctx.createLinearGradient(wx,0,t.x+t.w,0);g.addColorStop(0,B.shallow);g.addColorStop(.3,B.sea);g.addColorStop(1,B.deep);ctx.fillStyle=g;edge(0,2.2,1.2);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.16)';edge(7,1.6,1.6);ctx.fill();
 ctx.strokeStyle=B.foam;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();for(let y=0;y<=t.h;y+=3){const x=wx+Math.sin(y*.4+amb*1.2)*2.2;y?ctx.lineTo(x,t.y+y):ctx.moveTo(x,t.y+y);}ctx.stroke();
 ctx.restore();ctx.strokeStyle='rgba(70,48,22,.14)';ctx.lineWidth=1;rr(ctx,t.x+.5,t.y+.5,t.w-1,t.h-1,t.h/2);ctx.stroke();
 drawCastle(t.x+24,t.y+t.h-5,B);}

function slotPos(i){const f=L.finds,s=44;return{x:f.x+96+i*(s+12)+s/2,y:f.y+f.h/2,s};}
function drawFinds(B){const f=L.finds;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle='#34474c';ctx.font=`700 14px ${FONT}`;ctx.fillText('Rare finds',f.x,f.y+f.h/2);
 run.finds.forEach((fd,i)=>{const p=slotPos(i),s=p.s,g=ctx.createRadialGradient(p.x,p.y-3,s*.12,p.x,p.y,s*.56);g.addColorStop(0,'rgba(90,66,36,.2)');g.addColorStop(.8,'rgba(90,66,36,.06)');g.addColorStop(1,'rgba(90,66,36,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,s*.56,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y+.8,s*.47,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.save();ctx.translate(p.x,p.y);const it=FIND[fd.id];if(trayShown[i])drawFind(ctx,it,s*.98,false);else drawFind(ctx,TYPE_GHOST[it.type],s*.78,true);ctx.restore();});
 const endX=slotPos(2).x+26;ctx.font=`600 13px ${FONT}`;const nm=B.name;if(f.x+f.w-endX>ctx.measureText(nm).width+12){ctx.textAlign='right';ctx.fillStyle='#4a5d61';ctx.fillText(nm,f.x+f.w,f.y+f.h/2);ctx.textAlign='left';}}

function drawBoard(B){const cell=L.cell,bx=L.bx,by=L.by,w=cell*COLS,h=cell*ROWS;ctx.save();
 for(const f of run.finds)if(!f.freed){const x=cellX(f.c),y=cellY(f.r);ctx.fillStyle='rgba(255,240,210,.2)';ctx.beginPath();ctx.ellipse(x,y+cell*.3,cell*.34,cell*.11,0,0,7);ctx.fill();}
 ctx.beginPath();ctx.rect(bx-12,by-4,w+24,h+16);ctx.clip();
 const list=[...disp.entries()].sort((a,b)=>a[1].y-b[1].y);const selId=sel&&phase==='idle'&&P[sel.r][sel.c]?P[sel.r][sel.c].id:-1;
 for(const [id,d] of list){if(d.a<=0)continue;const x=bx+(d.x+.5)*cell,y=by+(d.y+.5)*cell-(d.lift||0)*cell;let s=cell*SPR*d.s;
  if(id===selId){s*=1.07;const g=ctx.createRadialGradient(x,y,cell*.2,x,y,cell*.5);g.addColorStop(0,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,cell*.5,0,7);ctx.fill();}
  let a=d.a;if(d.fy1!==undefined&&d.y<0)a*=Math.max(0,1+d.y*1.2);
  if(sub==='wave'&&phase==='steps'){const wf=1-stepT/TM().shuffle;a*=Math.min(1,.15+Math.abs(d.x/COLS-wf)*2.2);}
  const sh=GLASS[d.c].shape,rot=(((id*7919)%21)-10)/10*(sh==='drop'||sh==='heart'?.1:.22);
  ctx.globalAlpha=a;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(sprites[d.c],-s/2,-s/2,s,s);ctx.restore();ctx.globalAlpha=1;}
 if(hint&&phase==='idle'&&mode==='play'){for(const [r,c] of [[hint.r1,hint.c1],[hint.r2,hint.c2]]){const x=cellX(c),y=cellY(r);
  if(meta.rm){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,cell*.46,0,7);ctx.stroke();}
  else{const ph=(clock*.55)%1.6;if(ph<1){ctx.save();ctx.beginPath();ctx.arc(x,y,cell*.42,0,7);ctx.clip();const gx=x-cell+ph*cell*2,g=ctx.createLinearGradient(gx-cell*.3,y-cell*.3,gx+cell*.3,y+cell*.3);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-cell,y-cell,cell*2,cell*2);ctx.restore();}
   ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,cell*.47,0,7);ctx.stroke();}}}
 for(const f of run.finds)if(!f.freed){const x=cellX(f.c)+cell*.3,y=cellY(f.r)+cell*.3,tw=meta.rm?1:.78+.22*Math.sin(clock*2.2+f.c);twinkle(x,y,cell*.13*tw);}
 if(sub==='wave'&&phase==='steps'){const wf=1-stepT/TM().shuffle,wx=bx-10+wf*(w+20),g=ctx.createLinearGradient(wx-cell,0,wx+cell*1.4,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.35,B.shallow);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.75;ctx.fillStyle=g;ctx.fillRect(wx-cell,by-10,cell*2.4,h+20);ctx.globalAlpha=1;
  ctx.strokeStyle=B.foam;ctx.lineWidth=3;ctx.beginPath();for(let y=-10;y<=h+10;y+=6){const x=wx+Math.sin(y*.08)*5;y===-10?ctx.moveTo(x,by+y):ctx.lineTo(x,by+y);}ctx.stroke();}
 if(cursor&&document.activeElement===cv&&mode==='play'){ctx.setLineDash([5,4]);ctx.strokeStyle='#fff';ctx.lineWidth=2.5;rr(ctx,bx+cursor.c*cell+3,by+cursor.r*cell+3,cell-6,cell-6,12);ctx.stroke();ctx.strokeStyle='#1c2f34';ctx.lineDashOffset=4.5;ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;}
 ctx.restore();}
function twinkle(x,y,r){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.32:r;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}ctx.closePath();ctx.fillStyle='#fffbea';ctx.strokeStyle='rgba(60,40,15,.65)';ctx.lineWidth=1;ctx.fill();ctx.stroke();ctx.restore();}

/* ---------- input: swipe, tap-tap, keyboard ---------- */
function cellAt(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left-L.bx,y=e.clientY-r.top-L.by;if(x<0||y<0||x>=L.cell*COLS||y>=L.cell*ROWS)return null;return{r:Math.floor(y/L.cell),c:Math.floor(x/L.cell),x:e.clientX,y:e.clientY};}
cv.addEventListener('pointerdown',e=>{audioInit();if(!canPlay())return;const h=cellAt(e);if(!h)return;beginRound();drag={id:e.pointerId,r:h.r,c:h.c,x:h.x,y:h.y,done:false};idleT=0;hint=hint&&tutEl?hint:null;cursor=null;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||drag.done)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,th=L.cell*.32;
 if(Math.max(Math.abs(dx),Math.abs(dy))>th){drag.done=true;const h=Math.abs(dx)>Math.abs(dy);sel=null;trySwap(drag.r,drag.c,drag.r+(h?0:Math.sign(dy)),drag.c+(h?Math.sign(dx):0));}});
function pointerEnd(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;if(!d.done&&e.type==='pointerup')tapCell(d.r,d.c);}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function tapCell(r,c){if(!canPlay())return;if(sel&&sel.r===r&&sel.c===c){sel=null;return;}
 if(sel&&isNeighbour(sel.r,sel.c,r,c)){const s=sel;sel=null;trySwap(s.r,s.c,r,c);return;}sel={r,c};sfx('swap');}
addEventListener('keydown',e=>{audioInit();
 if(modalOpen){if(e.key==='Tab')trapFocus(e);else if(e.key==='Escape'&&cardKind==='pause'){e.preventDefault();resume();}return;}
 if(mode!=='play')return;const k=e.key;
 if(k==='Escape'||k==='p'||k==='P'){e.preventDefault();openPause();return;}
 if(document.activeElement!==cv)return;
 const dir={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
 if(dir){e.preventDefault();if(!cursor)cursor={r:4,c:3};else cursor={r:Math.max(0,Math.min(ROWS-1,cursor.r+dir[0])),c:Math.max(0,Math.min(COLS-1,cursor.c+dir[1]))};idleT=0;return;}
 if(k==='Enter'||k===' '){e.preventDefault();if(!cursor){cursor={r:4,c:3};return;}if(canPlay())beginRound();tapCell(cursor.r,cursor.c);}});

/* ---------- full screen (Android and desktop browsers; iPhone Safari has no full-screen API for pages) ---------- */
const fsOK=(()=>{try{return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled);}catch(e){return false;}})();
const isFS=()=>{try{return !!(document.fullscreenElement||document.webkitFullscreenElement);}catch(e){return false;}};
function toggleFS(){try{if(isFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;const p=x&&x.call(document);if(p&&p.catch)p.catch(()=>{});}
 else{const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;const p=rq&&rq.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
function fsSync(){const b=$('fsBtn');b.hidden=!(fsOK&&mode==='title'&&cardKind==='title');b.setAttribute('aria-label',isFS()?'Leave full screen':'Full screen');
 $('fsIcon').setAttribute('d',isFS()?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
 const s=$('sFs');if(s){const on=isFS();s.setAttribute('aria-checked',on);s.querySelector('.sw').classList.toggle('on',on);}}
$('fsBtn').addEventListener('click',()=>{audioInit();toggleFS();});
document.addEventListener('fullscreenchange',()=>{fsSync();layout();});document.addEventListener('webkitfullscreenchange',()=>{fsSync();layout();});

/* ---------- cards ---------- */
let lastFocus=null;
function focusables(){return[...$('card').querySelectorAll('button:not([disabled]),a[href]')].filter(x=>x.offsetParent!==null);}
function trapFocus(e){const f=focusables();if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus();}}
function showCard(kind,html,mount){if(!modalOpen)lastFocus=document.activeElement;modalOpen=true;cardKind=kind;const tv=html.indexOf('tv-top')>=0;$('modal').classList.toggle('titlev',tv);$('card').innerHTML=html;$('modal').hidden=false;$('card').scrollTop=0;
 drag=null;if(mount)mount($('card'));const first=$('card').querySelector('[data-focus]')||focusables()[0];if(first)try{first.focus({preventScroll:true});}catch(_){}
 $('back').hidden=!(kind==='title');$('pause').hidden=true;fsSync();}
function hideCard(){modalOpen=false;cardKind=null;$('modal').hidden=true;$('card').innerHTML='';$('back').hidden=true;$('pause').hidden=mode!=='play';fsSync();
 if(mode==='play')try{cv.focus({preventScroll:true});}catch(_){}}
const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn);};
const sw=(id,v,label,sub)=>`<button class="btn" id="${id}" role="switch" aria-checked="${v}"><span>${label}${sub?`<small>${sub}</small>`:''}</span><i class="sw${v?' on':''}" aria-hidden="true"></i></button>`;
const nav=(id,label,sub)=>`<button class="btn" id="${id}"><span>${label}<small>${sub}</small></span><span class="chev" aria-hidden="true">&#8250;</span></button>`;
const head=t=>`<div class="phead"><button class="bk" id="bk" type="button" data-focus>&#8249; Back</button><h2 id="cardTitle">${t}</h2><span></span></div>`;
const foundN=()=>FINDS.filter(f=>meta.found[f.id]).length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showTitle(){mode='title';const cont=run&&run.started;
 showCard('title',`<div class="tv-top"><h2 id="cardTitle" class="hero">Sea Glass</h2>
 <p>Swap two pieces of sea glass to line up three of a kind. Fill the jar before the tide reaches the sandcastle. No move limit, no rush.</p></div>
 <div class="tv-mid"><button class="btn primary" id="go" data-focus>${cont?'Carry on with tide '+run.tide:'Begin tide '+run.tide}</button>
 <div class="tv-links"><button class="btn" id="tShelf"><span>Collection shelf<small>${foundN()} of ${FINDS.length} rare finds</small></span></button>
 <button class="btn" id="tLooks"><span>Beaches and jars<small>${esc(beachOf(meta.beach).name)}</small></span></button></div>
 <p class="foot">${meta.total} piece${meta.total===1?'':'s'} of sea glass gathered so far</p></div>`,()=>{
  on('go',()=>{audioInit();startPlay();});on('tShelf',()=>showShelf(showTitle));on('tLooks',()=>showLooks(showTitle));});}
function startPlay(){mode='play';hideCard();if(!meta.tutDone&&!tutEl)showTutorial();if(!run.started&&run.easy&&!meta.tutDone)hint=run.easy;}
function showTutorial(){tutEl=document.createElement('div');tutEl.className='card tut';tutEl.setAttribute('role','note');
 placeTut();
 tutEl.innerHTML='<p>Swap two pieces to line up three</p><button class="btn primary" type="button" id="tutOk">Got it</button>';stage.appendChild(tutEl);placeTut();
 $('tutOk').addEventListener('click',()=>{hideTutorial();try{cv.focus({preventScroll:true});}catch(_){}});}
function placeTut(){if(!tutEl)return;tutEl.style.cssText=L.wide?`position:absolute;left:12px;top:${Math.round(L.finds.y+L.finds.h+8)}px;width:${Math.round(L.side-24)}px;z-index:3;padding:10px 10px 10px 14px;flex-wrap:wrap`:'position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:380px;z-index:3;padding:12px 12px 12px 16px';}
function hideTutorial(){if(tutEl){tutEl.remove();tutEl=null;}if(!meta.tutDone){meta.tutDone=true;saveMeta();}}
function openPause(){if(mode!=='play'||modalOpen)return;sel=null;drag=null;saveRun();
 const P2=()=>showCard('pause',`<h2 id="cardTitle">Paused</h2><p class="small">The tide waits while you're here.</p>
 <button class="btn primary" id="res" data-focus>Resume</button>
 <div class="sect">Settings</div><div class="list">
 ${sw('sSnd',!meta.muted,'Sound','Glass clinks and a quiet surf')}
 ${sw('sRm',meta.rm,'Reduce motion','Shorter, softer movement')}
 ${sw('sHint',meta.hints,'Move hints','A faint shimmer after 8 seconds')}
 ${fsOK?sw('sFs',isFS(),'Full screen','Hide the browser bars'):''}</div>
 <div class="sect">Your shore</div><div class="list">
 ${nav('pShelf','Collection shelf',foundN()+' of '+FINDS.length+' rare finds')}
 ${nav('pLooks','Beaches and jars',esc(beachOf(meta.beach).name)+' with the '+esc(jarOf(meta.jar).name.toLowerCase()))}</div>
 <div class="sect">This tide</div><div class="list">
 <button class="btn" id="again"><span>Start this tide again<small>Everything you've gathered stays on your shelf</small></span></button>
 <a class="btn" href="../games.html"><span>&larr; Digi Games<small>Your tide is saved for next time</small></span></a></div>`,()=>{
  on('res',resume);
  on('sSnd',()=>{audioInit();setMute(!meta.muted);P2();$('sSnd').focus();});
  on('sRm',()=>{meta.rm=!meta.rm;saveMeta();P2();$('sRm').focus();});
  on('sHint',()=>{meta.hints=!meta.hints;hint=null;saveMeta();P2();$('sHint').focus();});
  on('sFs',()=>{toggleFS();});
  on('pShelf',()=>showShelf(P2));on('pLooks',()=>showLooks(P2));
  on('again',()=>{const b=$('again');if(b.dataset.sure!=='1'){b.dataset.sure='1';b.classList.add('armed');b.querySelector('small').textContent='Tap again to start tide '+run.tide+' fresh';return;}
   hideTutorial();newRun('retry');hideCard();toast('Tide '+run.tide+', fresh from the sea');});});
 P2();}
function resume(){hideCard();}
function showShelf(back){const groups=[['stopper','Stoppers'],['marble','Marbles'],['shard','Pottery shards']];
 showCard(cardKind||'shelf',head('Collection shelf')+`<p class="small">${foundN()} of ${FINDS.length} found. Rare finds wash up buried under the glass: clear a piece next to the twinkle to free one.</p>`+
  groups.map(([t,n])=>`<h3>${n}</h3><div class="shelf">`+FINDS.filter(f=>f.type===t).map(f=>{const c=meta.found[f.id]||0,bn=beachOf(f.beach);
   return `<div class="slot${c?'':' no'}" data-f="${f.id}"><b>${c?esc(f.name):'Not yet found'}</b><span>${c?(c>1?'Found '+c+' times':'Found once'):(f.beach==='sand'?'Any beach':esc(bn.name))}</span></div>`;}).join('')+'</div>').join(''),el=>{
  el.querySelectorAll('[data-f]').forEach(s=>{const f=FIND[s.dataset.f];s.prepend(findIcon(f,48,!meta.found[f.id]));});on('bk',back);});}
function showLooks(back){const opt=(kind,x,cur)=>{const ok=meta.total>=x.need;return `<button class="btn opt${cur?' on':''}" data-${kind}="${x.id}" role="radio" aria-checked="${cur}" ${ok?'':'disabled'}><span>${esc(x.name)}<small>${ok?esc(x.d):'Unlocks at '+x.need+' pieces gathered'}</small></span><i class="dot" aria-hidden="true"></i></button>`;};
 showCard(cardKind||'looks',head('Beaches and jars')+`<p class="small">${meta.total} pieces gathered. A new beach brings its own rare finds from the next tide.</p><h3>Beach</h3><div class="list" role="radiogroup" aria-label="Beach">${BEACHES.map(b=>opt('b',b,b.id===meta.beach)).join('')}</div><h3>Jar</h3><div class="list" role="radiogroup" aria-label="Jar">${JARS.map(j=>opt('j',j,j.id===meta.jar)).join('')}</div>`,el=>{
  el.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{meta.beach=b.dataset.b;saveMeta();applyBeach();showLooks(back);const x=$('card').querySelector(`[data-b="${meta.beach}"]`);if(x)x.focus();}));
  el.querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>{meta.jar=b.dataset.j;saveMeta();showLooks(back);const x=$('card').querySelector(`[data-j="${meta.jar}"]`);if(x)x.focus();}));
  on('bk',back);});}
function applyBeach(){const B=beachOf(meta.beach);const R=document.documentElement.style;R.setProperty('--page',B.dry);R.setProperty('--deep',B.deep);try{document.querySelector('meta[name=theme-color]').setAttribute('content',B.deep);}catch(_){}if(L.cell)buildScene();}
function showEnd(win,done,stars,unlocked){
 const chips=Object.keys(done.targets).map(k=>`<span class="chip" data-g="${k}" aria-label="${esc(glassLabel(+k))}s: ${done.got[k]} of ${done.targets[k]}"><b aria-hidden="true">${done.got[k]} of ${done.targets[k]}</b></span>`).join('');
 const fcells=done.finds.map(f=>{const it=FIND[f.id];return `<div class="fcell" data-fd="${f.id}"><b>${f.freed?esc(it.name):'Still buried'}</b>${f.freed&&meta.found[f.id]===1?'<span class="new">New</span>':''}${f.freed?'':`<span class="sub">a ${it.type==='shard'?'pottery shard':it.type}</span>`}</div>`;}).join('');
 const card=()=>showCard('end',`<h2 id="cardTitle">${win?'The jar is full':'The tide has turned'}</h2>
 <p>${win?'Tide '+done.tide+' is done, with time to spare.':'The sea takes the shore back for a while. Every piece you gathered on tide '+done.tide+' is on your shelf.'}</p>
 <div class="chips">${chips}</div><p class="small">${done.gathered} piece${done.gathered===1?'':'s'} gathered this tide</p>
 <h3>Rare finds: ${stars} of 3</h3><div class="fgrid">${fcells}</div>
 ${unlocked.length?'<h3>Unlocked</h3><div class="list">'+unlocked.map(u=>`<div class="row"><span class="grow">${esc(u.n)}</span><span class="new">${u.kind==='beach'?'New beach':'New jar'}</span></div>`).join('')+'</div>':''}
 <button class="btn primary" id="next" data-focus>Next tide</button>
 <div class="list">${nav('eShelf','Collection shelf',foundN()+' of '+FINDS.length+' rare finds')}
 ${unlocked.length?nav('eLooks','Beaches and jars','Try what you unlocked'):''}
 <a class="btn" id="eBack" href="../games.html"><span>&larr; Digi Games</span></a></div>`,el=>{
  el.querySelectorAll('[data-g]').forEach(r=>r.prepend(glassIcon(+r.dataset.g,26)));
  el.querySelectorAll('[data-fd]').forEach(r=>{const f=FIND[r.dataset.fd],fr=done.finds.find(x=>x.id===f.id).freed;const ic=findIcon(fr?f:TYPE_GHOST[f.type],52,!fr);ic.setAttribute('aria-hidden','true');r.prepend(ic);});
  on('next',()=>{newRun('new');mode='play';hideCard();});on('eShelf',()=>showShelf(card));on('eLooks',()=>showLooks(card));});
 card();}

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveRun();saveMeta();try{if(SND.ac)SND.ac.suspend();}catch(_){}if(mode==='play'&&!modalOpen)openPause();}
 else{try{if(SND.ac&&SND.ac.state==='suspended')SND.ac.resume();}catch(_){}last=performance.now();}});
addEventListener('pagehide',()=>{saveRun();saveMeta();});
addEventListener('blur',()=>{drag=null;});
addEventListener('resize',()=>{layout();});
$('pause').addEventListener('click',()=>{audioInit();openPause();});

/* ---------- test hook (only when the page sets window.__DGTEST first) ---------- */
if(TEST){window.__dg={
 end(win){if(mode==='title')startPlay();if(mode!=='play')return false;if(modalOpen)hideCard();beginRound();finish(!!win);return true;},
 start(){if(mode==='title')startPlay();return mode;},
 swap:(r1,c1,r2,c2)=>trySwap(r1,c1,r2,c2),
 tap:(r,c)=>tapCell(r,c),
 moves:()=>listMoves(colourGrid(P)),
 setBoard(g){ids={n:1};P=g.map(row=>row.map(c=>({id:ids.n++,c})));resetDisplay();saveRun();ensureMoves();},
 setTide(p){run.p=p;},
 speed(k){speed=k;},
 layout:()=>JSON.parse(JSON.stringify(L)),
 state:()=>({mode,phase,modal:modalOpen,card:cardKind,tide:run.tide,p:run.p,started:run.started,startKind:run.startKind,got:run.got,targets:run.targets,gathered:run.gathered,finds:run.finds,board:colourGrid(P),hint,tut:!!tutEl,round:rnd.open,meta:JSON.parse(JSON.stringify(meta)),fliers:fliers.length})};}

/* ---------- boot ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000))*speed;last=now;try{update(dt);draw();}catch(err){if(TEST)console.error(err);}requestAnimationFrame(frame);}
layout();applyBeach();
{const saved=cleanRun(sget(RUNKEY));if(saved&&saved.tide===meta.tide)restoreRun(saved);else{sdel(RUNKEY);newRun('new');}}
showTitle();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{}).catch(()=>{});

})();
</script>
