<style>
:root{color-scheme:dark;--ink:#eef0f7;--dim:rgba(238,240,247,.68);--night:#060b1f;--panel:rgba(10,16,38,.86);--line:rgba(238,240,247,.16);--warm:#ffc97a}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--night)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:4px;background:rgba(238,240,247,.08);pointer-events:none}
#barF{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(255,201,122,.35),rgba(255,201,122,.75));border-radius:0 2px 2px 0}
#hud{position:absolute;left:0;right:0;top:calc(4px + env(safe-area-inset-top,0px));padding:8px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#cnt{font-weight:800;font-size:14px;color:var(--warm);opacity:0;padding:6px 10px;background:rgba(6,11,31,.45);border-radius:10px;font-variant-numeric:tabular-nums;transition:opacity .8s}
#pz{pointer-events:auto;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(6,11,31,.5);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#cue{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));text-align:center;font-family:Lora,Georgia,serif;font-style:italic;font-size:20px;color:var(--ink);opacity:.7;pointer-events:none;transition:opacity .9s ease;text-shadow:0 1px 10px rgba(0,0,0,.6)}
#tut{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(340px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-weight:700;font-size:15px;line-height:1.3;box-sizing:border-box}
#tut span{flex:1}
#tut button{background:rgba(238,240,247,.1);border:0;border-radius:10px;color:var(--ink);font:800 13px Nunito,system-ui,sans-serif;min-height:44px;min-width:56px;padding:0 12px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ov{position:absolute;inset:0;background:rgba(3,6,18,.62);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;box-sizing:border-box}
#ov.title{display:block;padding:0;background:linear-gradient(180deg,rgba(3,6,18,.35),rgba(3,6,18,.15) 40%,rgba(3,6,18,.55))}
.tTop{position:absolute;left:20px;right:20px;top:8%;text-align:center}
.tTop h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:40px;margin:0;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.tTop p{margin:8px auto 0;max-width:300px;font-size:15px;line-height:1.4;color:var(--dim)}
.tLen{position:absolute;left:0;right:0;top:calc(60% - 96px);display:flex;justify-content:center;gap:8px}
.pill{min-height:44px;min-width:78px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:rgba(10,16,38,.7);color:var(--ink);font:800 15px Nunito,system-ui,sans-serif;cursor:pointer}
.pill.on{background:var(--warm);color:#23160a;border-color:var(--warm)}
.go{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:min(260px,72%);height:56px;border:0;border-radius:28px;background:var(--warm);color:#23160a;font:800 18px Nunito,system-ui,sans-serif;cursor:pointer;box-shadow:0 0 30px rgba(255,201,122,.35)}
.tMore{position:absolute;left:12px;right:12px;top:calc(60% + 40px);bottom:8px;overflow-y:auto;text-align:center}
.lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:6px 0 4px}
.sws{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sw i{width:26px;height:30px;border-radius:40%;display:block;box-shadow:0 0 12px var(--g)}
.sw.on{border-color:var(--ink)}
.sw:disabled{cursor:default}.sw:disabled i{opacity:.22;box-shadow:none}
.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,38,.7);color:var(--ink);font:800 13px Nunito,system-ui,sans-serif;cursor:pointer}
.chip.on{border-color:var(--warm);color:var(--warm)}
.chip:disabled{opacity:.35;cursor:default}
.note{font-size:12px;color:var(--dim);margin:8px 0 2px;line-height:1.35}
.row{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
.link{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;background:none;border:0;color:var(--dim);font:700 14px Nunito,system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.card{background:#0c1433;border:1px solid var(--line);border-radius:18px;padding:22px 18px 14px;max-width:360px;width:100%;text-align:center;box-sizing:border-box}
.card h2{font-family:Lora,Georgia,serif;font-weight:500;font-size:28px;margin:0 0 6px}
.card p{margin:0 0 10px;font-size:15px;line-height:1.4;color:var(--dim)}
.stars{font-size:32px;letter-spacing:8px;color:var(--warm);margin:2px 0 4px}
.stars .off{color:rgba(238,240,247,.16)}
.big{font-family:Lora,Georgia,serif;font-size:46px;line-height:1.1;margin:4px 0 2px}
.new{background:rgba(255,201,122,.1);border:1px solid rgba(255,201,122,.35);border-radius:12px;padding:8px 10px;margin:6px 0 4px;font-weight:700;font-size:14px;color:var(--warm)}
.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;margin:8px 0 0;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:#16204a;color:var(--ink);font:800 15px Nunito,system-ui,sans-serif;text-align:left;cursor:pointer;box-sizing:border-box}
.btn small{display:block;font-weight:600;font-size:12px;color:var(--dim)}
.btn.primary{background:var(--warm);color:#23160a;border:0;justify-content:center;margin-top:14px}
.btn.center{justify-content:center}
.btn.armed{border-color:var(--warm)}
.slbl{text-align:left;font-weight:800;font-size:15px;margin:12px 2px 0}
.seg{display:flex;gap:6px;margin-top:6px}.seg .pill{flex:1;min-width:0;padding:0 6px;font-size:13px}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(238,240,247,.2);position:relative;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--warm)}.tg.on::after{left:21px}
.card{margin:auto}
.modes{position:absolute;left:0;right:0;top:calc(60% - 146px);display:flex;justify-content:center;gap:8px}
.mode{min-height:46px;min-width:124px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(10,16,38,.7);color:var(--ink);font:800 16px Nunito,system-ui,sans-serif;cursor:pointer}
.mode.on{border-color:var(--warm);color:var(--warm);background:rgba(40,30,20,.55)}
.tLen.u{top:calc(60% - 92px)}
#uskip{position:absolute;left:10px;top:calc(12px + env(safe-area-inset-top,0px));min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(6,11,31,.5);color:var(--ink);font:800 14px Nunito,system-ui,sans-serif;cursor:pointer}
#cue.u{font-size:18px;line-height:1.35;padding:0 22px}
#sub{position:absolute;left:0;right:0;bottom:calc(9% - 26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--dim);opacity:0;pointer-events:none;transition:opacity .9s ease}
.safe{text-align:left;font-size:15px;line-height:1.45;color:var(--ink);background:rgba(255,201,122,.07);border:1px solid rgba(255,201,122,.25);border-radius:12px;padding:10px 12px;margin:4px 0 6px}
.sky{display:block;width:100%;height:96px;border-radius:12px;margin:8px 0 6px}
.facts{display:flex;justify-content:center;gap:18px;margin:2px 0 8px;font-weight:800;font-size:15px}
.facts b{display:block;font-family:Lora,Georgia,serif;font-weight:500;font-size:30px;color:var(--warm)}
.chips.l{justify-content:flex-start;margin-top:6px}
@media (max-height:600px){.tTop{top:4%}.tTop h1{font-size:30px}.tTop p{display:none}}
@media (prefers-reduced-motion:reduce){#cue,#cnt,#sub{transition:none}.tg::after{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c" aria-label="Lantern Drift: a paper lantern on a night river"></canvas>
  <div id="bar" aria-hidden="true"><i id="barF"></i></div>
  <div id="hud">
    <span id="cnt" aria-live="off">&#10022; 0</span>
    <button id="pz" type="button" aria-label="Pause and settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
  </div>
  <button id="uskip" type="button" hidden>Skip this one</button>
  <div id="cue"></div>
  <div id="sub" aria-hidden="true">keep breathing</div>
  <div id="tut" hidden><span>Hold as the light rises, let go as it falls</span><button type="button" id="tutSkip">Skip</button></div>
  <div id="ov" hidden></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('c'),ctx=cv.getContext('2d'),ov=$('ov');
let W=360,H=640,dpr=1,waterY=460;

/* ---------- breathing model (tuned by simulation) ----------
   One breath = 10 s: 4 s in (hold), 6 s out (release) = 6 breaths a minute.
   Breath-curve lantern: each hold (or release) moves the lantern along a wave,
   slow at the start and end of the breath and quicker in the middle, like lungs
   filling and emptying. A little steady movement (BL) is mixed in so a thumb
   press always responds, and holding past 4 s keeps drifting gently. The guide
   ribbon is the path of a perfectly paced breather using the same physics, so
   breathing on pace keeps the lantern on a smooth, sine-like ribbon.
   A light counts if the lantern is near it vertically AND, on the rising and
   falling stretches, the player is breathing the right way (in on the rise,
   out on the fall). Near the turns, either is fine.                       */
const HSOFT=1.05,HMAX=1.32;   // above the top of the wave the lantern slows gently, and stops at HMAX (well clear of the lights)
const CYCLE=10,IN=4,OUT=6,LOW=0.3,AMP=0.62,TOL=0.23,STEP=1,EASE=6,BL=0.15;
const UP=AMP/IN,DOWN=AMP/OUT;
const LENS={2:120,3:180,5:300};
const GN=1000,GT=new Float32Array(GN);
const prof=u=>u<1?BL+(1-BL)*Math.PI/2*Math.sin(Math.PI*u):BL;   // integrates to 1 over the breath
const vTarget=(hold,th)=>hold?UP*prof(th/IN):-DOWN*prof(th/OUT);
(function(){let h=LOW,v=-DOWN*BL;const dt=CYCLE/GN;
 for(let c=0;c<4;c++)for(let i=0;i<GN;i++){if(c===3)GT[i]=h;const t=i*dt,hold=t<IN;v+=(vTarget(hold,hold?t:t-IN)-v)*Math.min(1,dt*EASE);h+=v*dt;}})();
function g(t){if(t<0)return GT[0];const u=(t%CYCLE)/CYCLE*GN,i=Math.floor(u),f=u-i;return GT[i%GN]*(1-f)+GT[(i+1)%GN]*f;}
const lightT=k=>k*STEP;   // one light a second; every breath has a light exactly at its top (4 s) and bottom (0 s)
const isTurn=k=>{const p=lightT(k)%CYCLE;return p===0||p===IN;};
function needs(t){const p=t%CYCLE;return p>0.5&&p<IN-0.4?1:p>IN+0.6&&p<CYCLE-0.5?-1:0;} // 1 = breathing in, -1 = out, 0 = either

/* ---------- looks and unlocks ---------- */
const COLS=[{id:'amber',name:'Amber',need:0,c:'#ffb45c',g:'255,180,92'},{id:'rose',name:'Rose',need:1,c:'#ff8fab',g:'255,143,171'},
 {id:'jade',name:'Jade',need:3,c:'#6fe0a8',g:'111,224,168'},{id:'lilac',name:'Lilac',need:5,c:'#b9a2ff',g:'185,162,255'},{id:'moon',name:'Moonlight',need:8,c:'#dfe9ff',g:'223,233,255'}];
const SCENES=[
 {id:'night',name:'Night river',need:0,sky:['#050a1c','#0b1636','#1a2a58'],water:['#0b1533','#040816'],hill:'#070d24',hill2:'#0b1432',stars:1,moon:'#f3eed8'},
 {id:'dusk',name:'Dusk',need:2,sky:['#150d2e','#40265a','#c4677a'],water:['#2a1838','#0d0718'],hill:'#1a1030',hill2:'#2a1840',stars:0.35,sun:1,moon:'#ffd9a8'},
 {id:'snow',name:'Snow',need:4,sky:['#0b1320','#1a2838','#33455c'],water:['#12202f','#070d16'],hill:'#1d2a3a',hill2:'#2b3a4d',stars:0.5,snow:1,moon:'#eef4ff',cap:'#dfe8f2'},
 {id:'harbour',name:'Harbour lights',need:6,sky:['#040812','#0a1430','#172650'],water:['#081230','#02050f'],hill:'#060b1c',hill2:'#0a1128',stars:0.7,harbour:1,moon:'#f3eed8'}];

/* ---------- saved progress (localStorage, every access in try/catch) ---------- */
const KEY='digi-lantern-drift-v1';
const prefersRM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const SNDS={both:'Waves and pad',waves:'Waves',pad:'Pad',off:'Off'};
const coarse=(()=>{try{return matchMedia('(pointer: coarse)').matches}catch(e){return false}})();
// Unwind settings (added in the revision; older saves simply get these defaults):
// gm = last mode picked, un = 4 (Short) or 7 (Full), ulong = longer rests, ugentle = off|slight|release,
// uskip = areas always skipped, uspeak = spoken cues, usafe = safety card seen, usess = Unwind sessions done
const fresh=()=>({v:1,sessions:0,best:0,mins:0,len:3,col:'amber',scene:'night',snd:'both',rm:prefersRM,tutDone:false,fs:coarse,
 gm:'breathe',un:4,ulong:false,ugentle:'off',uskip:[],uspeak:false,usafe:false,usess:0});
let meta=fresh();
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object'){meta=Object.assign(fresh(),o);if(o.snd===undefined&&o.muted)meta.snd='off';delete meta.muted;}}}catch(e){}

if(!LENS[meta.len])meta.len=3;
if(meta.gm!=='unwind')meta.gm='breathe';
if(meta.un!==7)meta.un=4;

/* ---------- Digi site tracking (site contract §5) ----------
   A round is one session: it opens on the first hold (never on the title,
   length picker or tutorial card) and closes when the session timer finishes.
   Leaving or restarting mid-session sends nothing (counted as abandoned).
   No level field: the game has no levels.
   Unwind: a round is one Unwind session, from the first hold (the first
   opening breath) to the end of the finale. mode = 'unwind-4' | 'unwind-7'.
   game_end adds skips; win = clean releases >= 40% of the groups attempted
   (tracking only: the screen stays gentle either way).                    */
const GAME='lantern-drift';
let rnd={armed:false,open:false,secs:0,how:'new'};
const modeStr=()=>S.mode.charAt(0)==='u'?'unwind-'+U.n:S.len+'min';
function trk(ev,x){try{if(window.digi&&window.digi.track)window.digi.track(ev,Object.assign({game:GAME},x));}catch(e){}}
function rndArm(how){rnd={armed:true,open:false,secs:0,how:how||'new'};}
function rndStart(){if(!rnd.armed||rnd.open)return;rnd.armed=false;rnd.open=true;trk('game_start',{mode:modeStr(),start:rnd.how});}
function rndEnd(win,x){if(!rnd.open)rndStart();if(!rnd.open)return;rnd.open=false;trk('game_end',Object.assign({win:!!win,secs:Math.round(rnd.secs),mode:modeStr()},x));}
// in the update loop, while playing and not paused: if(rnd.open) rnd.secs+=dt;

/* ---------- sound (WebAudio, made in code, starts only after a tap) ----------
   A soft wave (brown noise through a moving low-pass) and a warm pad (an open
   D chord, slightly detuned, drifting on two slow unsynced LFOs) share one
   synthetic reverb. Both swell and brighten as the lantern rises with the
   in-breath and settle as it sinks; pitch never slides. Gathered lights ring
   quiet low-passed bells from the same chord, at most one every ~2 s.      */
const AU={ac:null};
const CHORD=[146.83,220,293.66,329.63,440],BELLS=[587.33,659.25,880,987.77,1174.66];
function audioInit(){try{if(!AU.ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC();AU.ac=ac;
  AU.out=ac.createGain();AU.out.gain.value=meta.snd==='off'?0:0.9;AU.out.connect(ac.destination);
  AU.bus=ac.createGain();AU.bus.gain.value=0.0001;AU.bus.connect(AU.out);
  AU.verb=ac.createConvolver();{const len=Math.round(ac.sampleRate*3.5),b=ac.createBuffer(2,len,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}AU.verb.buffer=b;}
  const vg=ac.createGain();vg.gain.value=0.5;AU.verb.connect(vg);vg.connect(AU.bus);
  {const len=ac.sampleRate*4,nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
   const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;AU.wlp=ac.createBiquadFilter();AU.wlp.type='lowpass';AU.wlp.Q.value=0.4;AU.wlp.frequency.value=300;
   AU.wg=ac.createGain();AU.wg.gain.value=0;ns.connect(AU.wlp);AU.wlp.connect(AU.wg);AU.wg.connect(AU.bus);const ws=ac.createGain();ws.gain.value=0.25;AU.wg.connect(ws);ws.connect(AU.verb);ns.start();}
  {AU.plp=ac.createBiquadFilter();AU.plp.type='lowpass';AU.plp.Q.value=0.5;AU.plp.frequency.value=500;AU.pg=ac.createGain();AU.pg.gain.value=0;
   CHORD.forEach((f,k)=>[-4,4].forEach(ct=>{const o=ac.createOscillator();o.type=k===0?'sine':'triangle';o.frequency.value=f;o.detune.value=ct+Math.random()*2;const og=ac.createGain();og.gain.value=(k===0?0.5:0.22)/(1+k*0.3);o.connect(og);og.connect(AU.plp);o.start();}));
   [[0.07,120],[0.13,60]].forEach(([r,d])=>{const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=r;lg.gain.value=d;l.connect(lg);lg.connect(AU.plp.frequency);l.start();});
   AU.plp.connect(AU.pg);AU.pg.connect(AU.bus);const ps=ac.createGain();ps.gain.value=0.6;AU.pg.connect(ps);ps.connect(AU.verb);}}
 if(AU.ac.state!=='running'&&meta.snd!=='off')AU.ac.resume();}catch(e){}}
function audioTick(){if(!AU.ac||!AU.bus)return;try{const t=AU.ac.currentTime,m=meta.snd,f=Math.max(0,Math.min(1,(S.h-LOW)/AMP));
 const bus=S.paused?0.0001:S.mode==='play'?1:S.mode==='ready'?0.6:S.mode==='end'?0.35:S.mode==='uplay'?0.85:S.mode==='uready'?0.6:S.mode==='uend'?0.35:0.3;
 AU.bus.gain.setTargetAtTime(bus,t,S.paused?0.25:1.1);
 const w=m==='both'||m==='waves',p=m==='both'||m==='pad',both=m==='both';
 AU.wlp.frequency.setTargetAtTime(260+f*900,t,0.25);AU.wg.gain.setTargetAtTime(w?(both?0.05+f*0.14:0.07+f*0.2):0,t,0.25);
 AU.plp.frequency.setTargetAtTime(420+f*900,t,0.4);AU.pg.gain.setTargetAtTime(p?(both?0.035+f*0.03:0.06+f*0.05):0,t,0.5);}catch(e){}}
let lastBell=-9;
function chime(y){if(!AU.ac||!AU.bus||meta.snd==='off')return;try{const ac=AU.ac,t=ac.currentTime;if(t-lastBell<1.8)return;lastBell=t;
 const o=ac.createOscillator(),lp=ac.createBiquadFilter(),gn=ac.createGain(),s2=ac.createGain();o.type='sine';o.frequency.value=BELLS[Math.max(0,Math.min(4,Math.round((y-LOW)/AMP*4)))];
 lp.type='lowpass';lp.frequency.value=1600;gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(0.022,t+0.03);gn.gain.exponentialRampToValueAtTime(0.0001,t+3.2);
 o.connect(lp);lp.connect(gn);gn.connect(AU.bus);s2.gain.value=0.7;gn.connect(s2);s2.connect(AU.verb);o.start(t);o.stop(t+3.4);}catch(e){}}
function setSound(m){meta.snd=SNDS[m]?m:'both';save();try{if(AU.out)AU.out.gain.value=meta.snd==='off'?0:0.9;if(AU.ac&&meta.snd!=='off'&&AU.ac.state!=='running')AU.ac.resume();}catch(e){}if(meta.snd==='off')hush();}

/* ---------- Unwind cues: tones, buzzes, optional speech ----------
   Three distinct soft tones so a session works with eyes closed:
   cue = a slow rising tone (a new area, get ready to tense),
   release = a warm bell (let go now), next = two low notes (the rest is
   ending, a new area is coming). Buzzes where the phone supports them
   (Android; iPhone doesn't vibrate from a web page). Speech is optional,
   off by default, and only uses voices that run on the device.        */
function tone(kind){if(!AU.ac||!AU.bus||meta.snd==='off'||simHold!==null)return;try{const ac=AU.ac,t=ac.currentTime;
 const note=(f,f2,at,dur,peak,type)=>{const o=ac.createOscillator(),lp=ac.createBiquadFilter(),gn=ac.createGain(),s2=ac.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+at+dur*0.6);lp.type='lowpass';lp.frequency.value=1800;
  gn.gain.setValueAtTime(0.0001,t+at);gn.gain.exponentialRampToValueAtTime(peak,t+at+(f2?dur*0.35:0.03));gn.gain.exponentialRampToValueAtTime(0.0001,t+at+dur);
  o.connect(lp);lp.connect(gn);gn.connect(AU.bus);s2.gain.value=0.6;gn.connect(s2);s2.connect(AU.verb);o.start(t+at);o.stop(t+at+dur+0.1);};
 if(kind==='cue'){note(293.66,440,0,1.6,0.05);note(587.33,880,0.05,1.5,0.012);}
 else if(kind==='bell'){note(880,0,0,3.6,0.05);note(1318.5,0,0,2.4,0.014);note(440,0,0,3.2,0.02);}
 else if(kind==='nag'){note(659.25,0,0,1.6,0.035);note(659.25,0,0.45,1.8,0.03);}
 else if(kind==='next'){note(220,0,0,1.4,0.05,'triangle');note(293.66,0,0.5,1.8,0.045,'triangle');}}catch(e){}}
let buzzed=false;   // only ever cancel a buzz we started (Chrome logs an error for vibrate before the first tap)
function buzz(p){if(simHold!==null)return;try{if(navigator.vibrate){buzzed=true;navigator.vibrate(p);}}catch(e){}}
let voice=null;
function findVoice(){try{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return null;const vs=speechSynthesis.getVoices().filter(v=>v.localService===true);
 voice=vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]||null;}catch(e){voice=null;}return voice;}
try{if(window.speechSynthesis){findVoice();speechSynthesis.addEventListener('voiceschanged',findVoice);}}catch(e){}
function say(txt){if(!meta.uspeak||meta.snd==='off'||simHold!==null||!voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.voice=voice;u.lang=voice.lang;u.rate=0.85;u.pitch=0.95;u.volume=0.9;speechSynthesis.speak(u);}catch(e){}}
function hush(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}try{if(buzzed&&navigator.vibrate){buzzed=false;navigator.vibrate(0);}}catch(e){}}

/* ---------- full screen ----------
   A web page can't hide the browser's address and status bars by itself. On
   phones that allow it (Android Chrome, not iPhone), tapping Begin or Again asks
   for full screen and keeps the phone upright; it's on by default on touch
   screens and can be switched off in the pause menu. Swiping back exits it.  */
const fsOK=(()=>{try{return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled)}catch(e){return false}})();
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function goFS(){if(!fsOK||!meta.fs||isFS())return;try{const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!rq)return;const p=rq.call(el,{navigationUI:'hide'});
 const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});}catch(e){}};if(p&&p.then)p.then(lock,()=>{});else lock();}catch(e){}}
function exitFS(){try{if(!isFS())return;const x=document.exitFullscreen||document.webkitExitFullscreen;const p=x&&x.call(document);if(p&&p.catch)p.catch(()=>{});}catch(e){}}

/* ---------- state ---------- */
const S={mode:'title',paused:false,len:meta.len,dur:180,total:360,tau:0,h:LOW,v:0,hold:false,lh:false,th:0,idx:0,got:0,seen:0,marks:new Uint8Array(360),parts:[],flashT:0};
let anyRound=false,clock=0,scroll=0,simHold=null;
const ptrs=new Set();let keyHold=false;
const holding=()=>simHold!==null?simHold:(ptrs.size>0||keyHold);
const pps=()=>W*(meta.rm?0.06:0.11);
const LX=()=>W*0.3;
function yOf(h){const top=H*0.27+22,bot=waterY-24;return bot-h*(bot-top);}   // h=1 sits a little below the old spot, leaving room above the wave

function enterReady(){try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(e){}ov.hidden=true;ov.className='';S.mode='ready';S.paused=false;S.len=meta.len;S.dur=LENS[S.len];S.total=Math.round(S.dur/STEP);
 S.marks=new Uint8Array(S.total);S.idx=0;S.got=0;S.seen=0;S.tau=0;S.h=g(0);S.v=0;S.hold=false;S.parts=[];ptrs.clear();keyHold=false;
 rndArm(anyRound?'retry':'new');$('tut').hidden=meta.tutDone;S.guide=!meta.tutDone;lastCue='';}
function beginSession(){if(S.mode!=='ready'||S.paused)return;S.mode='play';S.tau=0;S.h=g(0);S.v=-DOWN*BL;S.lh=true;S.th=0;anyRound=true;rndStart();}
function onHold(){audioInit();if(S.mode==='ready'&&!S.paused)beginSession();else if(S.mode==='uready'&&!S.paused)uBegin();}
function judge(i){const t=lightT(i),gd=g(t),n=needs(t);
 const ok=n===0?Math.abs(S.h-gd)<TOL*0.7:Math.abs(S.h-gd)<TOL&&(n===1)===S.hold;   // turn lights: either direction, a little closer
 S.marks[i]=ok?1:2;S.seen++;
 if(ok){S.got++;chime(gd);if(simHold===null){S.flashT=1;if(!meta.rm&&(!S.parts.length||S.parts[S.parts.length-1].t>0.9))S.parts.push({t:0});}}}
function finish(force){if(S.mode!=='play')return;S.mode='end';S.paused=false;ptrs.clear();keyHold=false;$('tut').hidden=true;
 const pct=S.seen?Math.round(100*S.got/S.seen):0,stars=pct>=85?3:pct>=65?2:pct>=40?1:0;
 const win=force===undefined?pct>=40:!!force;
 const before=meta.sessions;meta.sessions++;meta.best=Math.max(meta.best,pct);meta.mins+=Math.round(S.tau/60);if(!meta.tutDone)meta.tutDone=true;save();
 const fresh=[...COLS.filter(c=>c.need>before&&c.need<=meta.sessions).map(c=>c.name+' lantern'),...SCENES.filter(c=>c.need>before&&c.need<=meta.sessions).map(c=>c.name+' river')];
 rndEnd(win,{score:pct,stars});
 if(simHold===null)showEnd(pct,stars,fresh);}

/* ---------- Unwind: progressive muscle relaxation ----------
   Same world, same control: hold = breathe in and tense, let go = breathe out
   and release. The phone can't feel muscles, so only timing is judged.
   Session: two opening breaths (4 s in, 6 s out) -> for each muscle group:
   cue 2 s (rising tone, lantern brightens) -> wait for a hold -> tense (ring
   fills over 6 s, bell at 6 s) -> release (6 s breath out, the lantern slips
   its mooring and floats up to stay in the sky) -> rest 15 s (25 s with
   longer rests; never judged) -> next. Finale: one last breath, every
   lantern in the sky glows at once, then a gentle summary.
   Clean release = held at least 3 s and let go within 2 s of the bell
   (4-8 s). Let go before 3 s: the lantern settles back and the group repeats
   once, softer; a second early let-go moves on. Still holding 3 s after the
   bell: "let go now" and a buzz; at 10 s it moves on anyway.
   All timers advance only in update(), which doesn't run while paused.   */
const AREAS=[{id:'hands',name:'Hands and forearms'},{id:'arms',name:'Upper arms'},{id:'face',name:'Face'},{id:'jaw',name:'Jaw and neck'},
 {id:'shoulders',name:'Shoulders and back'},{id:'stomach',name:'Stomach'},{id:'legs',name:'Legs and feet'}];
const GROUPS={
 7:[{a:['hands'],area:'hands and forearms',pl:1,go:'Squeeze the phone and make a fist with your other hand.',sl:'Squeeze the phone just slightly, and curl your other hand loosely.'},
  {a:['arms'],area:'upper arms',pl:1,go:'Bend your elbows and tighten your biceps.',sl:'Bend your elbows and tighten your upper arms just slightly.'},
  {a:['face'],area:'face',pl:0,go:'Scrunch up your eyes and nose.',sl:'Scrunch your eyes and nose just slightly.'},
  {a:['jaw'],area:'jaw and neck',pl:1,go:'Clench your teeth gently and tip your chin slightly down.',sl:'Touch your teeth together lightly, chin just slightly down.'},
  {a:['shoulders'],area:'shoulders and upper back',pl:1,go:'Shrug your shoulders up and back.',sl:'Lift your shoulders just slightly.'},
  {a:['stomach'],area:'stomach',pl:0,go:'Draw your stomach in.',sl:'Draw your stomach in just slightly.'},
  {a:['legs'],area:'legs and feet',pl:1,go:'Press your knees together and point your toes gently, lightly, to avoid cramp.',sl:'Press your knees together just slightly and point your toes very gently.'}],
 4:[{a:['hands','arms'],area:'arms and hands',pl:1,go:'Squeeze the phone, make a fist with your other hand and bend your elbows to tighten your arms.',sl:'Squeeze the phone just slightly and bend your elbows, tightening your arms a little.'},
  {a:['face','jaw'],area:'face and neck',pl:1,go:'Scrunch your eyes and nose, clench your teeth gently, chin slightly down.',sl:'Scrunch your eyes and nose just slightly, teeth lightly together.'},
  {a:['shoulders','stomach'],area:'shoulders, chest and stomach',pl:1,go:'Shrug your shoulders up and back and draw your stomach in.',sl:'Lift your shoulders just slightly and draw your stomach in a little.'},
  {a:['legs'],area:'legs and feet',pl:1,go:'Press your knees together and point your toes gently, lightly, to avoid cramp.',sl:'Press your knees together just slightly and point your toes very gently.'}]};
const UCUE=2,UBELL=6,UEARLY=3,UNAG=9,UMAX=10,UREL=6,UOPEN=20,UFIN=10,UGLOW=4;
const restLen=()=>meta.ulong?25:15;
const gText=gr=>meta.ugentle==='release'?`Hold lightly and notice your ${gr.area}, then let go and let ${gr.pl?'them':'it'} soften.`:meta.ugentle==='slight'?gr.sl:gr.go;
const skipped=gr=>gr.a.some(a=>meta.uskip.includes(a));   // Short groups: skipped if any of their areas is on the skip list
let uSim=false;   // true only while the test hook runs a whole session instantly
let U={n:4,gs:[],res:[],gi:-1,ph:'idle',t:0,ht:0,tot:0,rep:0,soft:false,susp:false,bell:false,nag:false,recue:false,nx:false,ten:0,sky:[],rip:[],dim:0,bodyA:0,moorA:0,half:-1};
function enterUnwind(){try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(e){}ov.hidden=true;ov.className='';
 S.mode='uready';S.paused=false;ptrs.clear();keyHold=false;$('tut').hidden=true;
 const n=meta.un===7?7:4;U={n,gs:GROUPS[n],res:GROUPS[n].map(()=>null),gi:-1,ph:'idle',t:0,ht:0,tot:0,rep:0,soft:false,susp:false,bell:false,nag:false,recue:false,nx:false,ten:0,sky:[],rip:[],dim:0,bodyA:0,moorA:0,half:-1};
 S.h=g(0);S.v=0;S.hold=false;S.parts=[];S.flashT=0;rndArm(anyRound?'retry':'new');lastCue='';}
function uBegin(){if(S.mode!=='uready'||S.paused)return;S.mode='uplay';U.ph='open';U.t=0;U.half=-1;S.h=g(0);S.v=-DOWN*BL;S.lh=true;S.th=0;anyRound=true;rndStart();}
function breathStep(dt,hold){S.hold=hold;if(hold!==S.lh){S.lh=hold;S.th=0;}S.th+=dt;S.v+=(vTarget(hold,S.th)-S.v)*Math.min(1,dt*EASE);S.h+=S.v*dt;
 if(S.h<0){S.h=0;if(S.v<0)S.v=0;}if(S.h>HSOFT&&S.v>0)S.v*=Math.max(0,1-(S.h-HSOFT)/(HMAX-HSOFT));if(S.h>HMAX){S.h=HMAX;if(S.v>0)S.v=0;}}
function breathSay(t,first,end){if(t>end-0.5)return;const h=Math.floor(t/CYCLE)*2+((t%CYCLE)<IN?0:1);if(h!==U.half){U.half=h;say(h%2?'And out.':first&&h===0?'Breathe in slowly.':'In.');}}
function uNext(){U.gi++;while(U.gi<U.n&&skipped(U.gs[U.gi])){U.res[U.gi]={skip:true};U.gi++;}
 U.t=0;U.ht=0;U.rep=0;U.soft=false;U.susp=false;U.bell=false;U.nag=false;U.recue=false;U.nx=false;U.ten=0;
 if(U.gi>=U.n){U.ph='finale';U.half=-1;S.th=0;S.lh=holding();S.v=0;return;}
 U.ph='cue';tone('cue');say(gText(U.gs[U.gi]));}
function uCueAgain(){U.ph='cue';U.t=0;U.ht=0;U.bell=false;U.nag=false;U.recue=false;U.susp=false;U.soft=true;tone('cue');say('A little softer this time. '+gText(U.gs[U.gi]));}
function uRelease(clean){const gi=U.gi;U.res[gi]={skip:false,clean:!!clean,rep:U.rep};
 U.sky.push({gi,t0:U.tot,ten:U.ten});U.moorA=0;U.ph='release';U.t=0;if(!U.bell){tone('bell');say('Breathe out, and let it all go.');}U.bell=true;}
function uSkip(){if(S.mode!=='uplay'||S.paused||(U.ph!=='cue'&&U.ph!=='wait'))return;U.res[U.gi]={skip:true};U.ph='gap';U.t=0;tone('next');hush();}
function uUpdate(dt){
 U.t+=dt;U.tot+=dt;if(rnd.open)rnd.secs+=dt;
 const hold=holding(),rl=restLen();
 switch(U.ph){
 case 'open':breathStep(dt,hold);breathSay(U.t,true,UOPEN);if(U.t>=UOPEN)uNext();break;
 case 'cue':U.ten+=(0-U.ten)*Math.min(1,dt*3);if(U.t>=UCUE){U.ph='wait';U.t=0;}break;
 case 'wait':
  if(hold){U.ph='tense';U.t=0;U.ht=0;buzz(40);}
  else if(U.t>=8&&!U.recue){U.recue=true;tone('cue');}
  break;
 case 'tense':
  if(U.susp){if(!hold)break;U.susp=false;}   // after a pause mid-tense, the ring waits for the next hold, then carries on
  if(!hold){if(U.ht<UEARLY){U.ph='settle';U.t=0;U.set0=U.ten;hush();break;}uRelease(U.ht>=UBELL-2&&U.ht<=UBELL+2);break;}
  U.ht+=dt;U.ten=Math.min(1,U.ht/UBELL);
  if(U.ht>=UBELL&&!U.bell){U.bell=true;tone('bell');buzz([60,90,60]);say('And let go.');}

function update(dt){

  if(S.h<0){S.h=0;if(S.v<0)S.v=0;}if(S.h>HSOFT&&S.v>0)S.v*=Math.max(0,1-(S.h-HSOFT)/(HMAX-HSOFT));if(S.h>HMAX){S.h=HMAX;if(S.v>0)S.v=0;}
  S.tau+=dt;if(rnd.open)rnd.secs+=dt;

  if(!meta.tutDone&&S.tau>=CYCLE){meta.tutDone=true;save();$('tut').hidden=true;}
  if(S.tau>=S.dur){finish();return;}
 }else if(S.mode==='uplay'){uUpdate(dt);if(S.mode!=='uplay')return;
 }else if(S.mode==='ready'||S.mode==='title'||S.mode==='uready'){S.h=g(0)+Math.sin(clock*1.3)*0.012;S.hold=false;}
 else if(S.mode==='end'){S.v+=(0-S.v)*Math.min(1,dt*2);S.h+=(LOW-S.h)*Math.min(1,dt*0.6);}
 S.flashT=Math.max(0,S.flashT-dt*1.1);
 if(um){const ph=S.mode==='uplay'?U.ph:'';U.dim+=((ph==='rest'?1:0)-U.dim)*Math.min(1,dt*0.8);
  U.bodyA+=((['cue','wait','tense','settle','release'].includes(ph)?1:ph==='rest'?0.75:0)-U.bodyA)*Math.min(1,dt*1.6);
  U.moorA+=((['cue','wait','tense','settle'].includes(ph)?1:0)-U.moorA)*Math.min(1,dt*(ph==='release'?6:2));
  for(const q of U.rip)q.t+=dt;U.rip=U.rip.filter(q=>q.t<1.8);}

   if(ph==='tense'&&U.ht>=UBELL){const k=rm?0.6:0.45+0.35*Math.sin(clock*4);blob('255,201,122',mx,ly,R*1.6,0.25*k);}}}
 // the breath-out guide: a circle shrinking over the 6 s out-breath
 if(ph==='release'){const f=cl01(U.t/UREL);ctx.lineWidth=2;ctx.strokeStyle='rgba(238,240,247,.12)';ctx.beginPath();ctx.arc(mx,my,48,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(255,220,170,.6)';ctx.fillStyle='rgba(255,220,170,.06)';ctx.beginPath();ctx.arc(mx,my,8+40*(1-f),0,7);ctx.fill();ctx.stroke();}
 // opening and closing breaths: the Breathe lantern and a ring showing where the breath should be
 let ba=0,bt=0;if(ph==='ready')ba=1;else if(ph==='open'){ba=cl01((UOPEN-U.t)/1.5);bt=U.t;}else if(ph==='finale'){ba=cl01(U.t/1.5);bt=U.t;}else if(ph==='glow'){ba=1-cl01(U.t/2);bt=UFIN;}
 if(ba>0.01){const bx=W*0.5,by=yOf(ph==='ready'?S.h:S.h),gy=yOf(g(bt));
  ctx.lineWidth=2;ctx.strokeStyle=`rgba(255,236,200,${(0.4*ba).toFixed(3)})`;ctx.fillStyle=`rgba(255,236,200,${(0.05*ba).toFixed(3)})`;ctx.beginPath();ctx.arc(bx,gy,30,0,7);ctx.fill();ctx.stroke();
  for(let j=0;j<6;j++)blob(lc.g,bx+(rm?0:Math.sin(clock*1.4+j*0.9)*2.5),waterY+8+j*11,16-j*1.6,(0.32-j*0.045)*(1-S.h*0.55)*ba);
  blob(lc.g,bx,by,70,(0.28+(S.hold?0.1:0))*ba);lanternAt(bx,by+(rm?0:Math.sin(clock*1.7)*1.2),lc,1,ba);}
}
function drawUnwindTop(rm){
 if(U.dim>0.01){ctx.fillStyle=`rgba(2,4,12,${(0.42*U.dim).toFixed(3)})`;ctx.fillRect(0,0,W,H);}
 ctx.lineWidth=1.5;for(const q of U.rip){const u=q.t/1.8,r=rm?20:8+u*46,a=0.32*(1-u)*(rm?0.8:1);ctx.strokeStyle=`rgba(220,232,255,${a.toFixed(3)})`;ctx.beginPath();ctx.ellipse(q.x,q.y,r,r*0.42,0,0,7);ctx.stroke();}}
function drawLantern(x,y,lc){const w=34,h=40;
 ctx.strokeStyle='rgba(20,14,10,.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y-h/2-6);ctx.lineTo(x,y-h/2-14);ctx.stroke();
 const gr=ctx.createRadialGradient(x,y+4,2,x,y,w*0.75);gr.addColorStop(0,'#fff6e2');gr.addColorStop(0.45,lc.c);gr.addColorStop(1,`rgba(${lc.g},.55)`);
 ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x-w*0.3,y-h/2);ctx.bezierCurveTo(x-w*0.72,y-h*0.32,x-w*0.72,y+h*0.32,x-w*0.3,y+h/2);ctx.lineTo(x+w*0.3,y+h/2);ctx.bezierCurveTo(x+w*0.72,y+h*0.32,x+w*0.72,y-h*0.32,x+w*0.3,y-h/2);ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(90,50,20,.28)';ctx.lineWidth=1;for(const s of [-0.5,0,0.5]){ctx.beginPath();ctx.moveTo(x+s*w*0.3,y-h/2);ctx.quadraticCurveTo(x+s*w*0.62,y,x+s*w*0.3,y+h/2);ctx.stroke();}
 for(const yy of [-0.2,0.2]){ctx.beginPath();ctx.moveTo(x-w*0.52,y+yy*h);ctx.quadraticCurveTo(x,y+yy*h+2,x+w*0.52,y+yy*h);ctx.stroke();}
 ctx.fillStyle='#2a1c14';rr(x-w*0.34,y-h/2-6,w*0.68,6,2);ctx.fill();rr(x-w*0.3,y+h/2,w*0.6,5,2);ctx.fill();
 ctx.fillStyle='rgba(255,210,140,.8)';ctx.beginPath();ctx.moveTo(x-2,y+h/2+5);ctx.lineTo(x+2,y+h/2+5);ctx.lineTo(x,y+h/2+12);ctx.closePath();ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- HUD ---------- */
let lastCue='',lastCnt=-1,lastBar=-1,lastVis='',lastU=false,lastSk=false,lastSb=false;
function hud(){const cue=$('cue');let t='';
 const um=S.mode.charAt(0)==='u';
 if(S.mode==='ready')t='Hold anywhere to breathe in';else if(S.mode==='play')t=(S.tau%CYCLE)<IN?'Breathe in':'Breathe out';else if(um)t=uCueText();
 if(um!==lastU){lastU=um;cue.classList.toggle('u',um);}
 const sk=S.mode==='uplay'&&!S.paused&&(U.ph==='cue'||U.ph==='wait');if(sk!==lastSk){lastSk=sk;$('uskip').hidden=!sk;}
 const sb=S.mode==='uplay'&&U.ph==='tense'&&!U.susp&&U.ht<UBELL;if(sb!==lastSb){lastSb=sb;$('sub').style.opacity=sb?0.5:0;}
 if(t!==lastCue){lastCue=t;cue.style.opacity=0;if(t)setTimeout(()=>{if(lastCue===t){cue.textContent=t;cue.style.opacity=0.7;}},meta.rm?0:350);}
 const n=S.mode==='play'||S.mode==='end'?S.got:0;if(n!==lastCnt){lastCnt=n;$('cnt').textContent='✦ '+n;}
 const vis=S.mode+'|'+(S.mode==='play');if(vis!==lastVis){lastVis=vis;$('cnt').style.opacity=S.mode==='play'?0.85:0;$('pz').hidden=!(S.mode==='play'||S.mode==='ready'||S.mode==='uplay'||S.mode==='uready');}
 const b=S.mode==='play'?Math.min(1,S.tau/S.dur):S.mode==='end'||S.mode==='uend'?1:S.mode==='uplay'?uProg():0,bp=Math.round(b*1000);if(bp!==lastBar){lastBar=bp;$('barF').style.width=(b*100).toFixed(1)+'%';}}

/* ---------- loop ---------- */
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);waterY=H*0.72;
 try{hudB=$('hud').getBoundingClientRect().top-r.top+62;}catch(e){hudB=70;}}   // hudB = bottom of the pause button row (46px button + padding), whether or not it's showing
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;update(dt);draw();hud();audioTick();requestAnimationFrame(frame);}

/* ---------- test hooks (only when window.__DGTEST is set) ---------- */
if(window.__DGTEST)window.__dg={
 end:w=>{if(S.mode==='end'||S.mode==='uend')return;
  if(S.mode.charAt(0)==='u'||(S.mode==='title'&&meta.gm==='unwind')){if(S.mode==='title')enterUnwind();if(S.mode==='uready'){S.paused=false;uBegin();}S.paused=false;uFinish(w===undefined?undefined:!!w);return;}
  if(S.mode==='title')enterReady();if(S.mode==='ready'){S.paused=false;beginSession();}S.paused=false;finish(w===undefined?undefined:!!w);},
 get meta(){return meta},get S(){return S},get U(){return U},g,uScore,pause,resume,uSkip,save,
 // step the real update loop by `secs` seconds (headless timing tests); hold = what the player is doing
 step(secs,hold){simHold=hold===undefined?null:!!hold;const dt=1/60;for(let i=0;i<Math.round(secs*60);i++)update(dt);simHold=null;},
 // run a whole Unwind session instantly; bot(U,S) returns true to hold. Returns the score and a log of phase changes.
 usim(bot,n,opts){opts=opts||{};meta.un=n||4;enterUnwind();simHold=true;uSim=true;uBegin();const dt=1/60,log=[];let k=0,lp='',t=0;
  while(S.mode==='uplay'&&k++<2e5){simHold=!!bot(U,S);if(opts.pauseAt&&opts.pauseAt(U,t)){pause();const tU=JSON.stringify([U.ph,U.t,U.ht,U.gi,rnd.secs]);for(let i=0;i<120;i++)update(dt);log.push({frozen:tU===JSON.stringify([U.ph,U.t,U.ht,U.gi,rnd.secs])});resume();}
   update(dt);t+=dt;const p=U.gi+':'+U.ph+(U.soft?'~':'');if(p!==lp){log.push({p,t:+t.toFixed(2),ht:+U.ht.toFixed(2)});lp=p;}}
  simHold=null;uSim=false;const r=Object.assign(uScore(),{res:U.res.slice(),secs:rnd.secs,tot:U.tot,log});return r;},
 // run a whole session instantly through the real update loop; bot(tau,S) returns true to hold
 sim(bot,len){meta.len=len||3;enterReady();simHold=true;beginSession();const dt=1/60;let n=0;while(S.mode==='play'&&n++<1e6){simHold=!!bot(S.tau,S);update(dt);}
  simHold=null;const r={pct:S.seen?Math.round(100*S.got/S.seen):0,got:S.got,seen:S.seen,total:S.total};showTitle();return r;}};

addEventListener('resize',resize);
resize();showTitle();requestAnimationFrame(frame);
})();
</script>
